<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pay Your Balance · Bedrock Homeowner Portal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/brand.css">
<!-- Stripe.js must load from js.stripe.com (PCI): card and bank details go straight to Stripe, never to our server. -->
<script src="https://js.stripe.com/v3"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--cream, #FAFAF6); color: var(--ink, #1a1a1a);
    font-family: var(--font-sans, 'Inter', -apple-system, sans-serif); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  header { background: var(--navy, #0B1D34); color: #fff; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
  header a { color: var(--gold, #D4AF37); text-decoration: none; font-weight: 600; font-size: 14px; }
  header .t { font-family: var(--font-serif, Georgia, serif); font-size: 20px; font-weight: 600; }
  main { max-width: 520px; margin: 0 auto; padding: 20px 16px 48px; }
  .card { background: #fff; border: 1px solid var(--rule, #E5E3DA); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  h2 { font-family: var(--font-serif, Georgia, serif); color: var(--navy, #0B1D34); font-size: 22px; margin: 0 0 6px; }
  .muted { color: var(--ink-soft, #4a4a4a); font-size: 13.5px; }
  .amount { font-size: 28px; font-weight: 700; color: var(--navy, #0B1D34); margin: 4px 0 2px; }
  .choice { display: block; border: 1px solid var(--rule, #E5E3DA); border-radius: 10px; padding: 12px 14px; margin: 10px 0; cursor: pointer; }
  .choice input { margin-right: 8px; }
  .choice .sub { color: var(--ink-soft, #4a4a4a); font-size: 12.5px; margin-left: 24px; }
  .choice.on { border-color: var(--navy, #0B1D34); box-shadow: 0 0 0 1px var(--navy, #0B1D34) inset; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--rule, #E5E3DA); }
  .row.total { border-bottom: none; font-weight: 700; font-size: 17px; color: var(--navy, #0B1D34); }
  .disclosure { background: var(--cream, #FAFAF6); border-left: 3px solid var(--gold, #D4AF37); padding: 10px 12px; font-size: 13px; margin: 12px 0; }
  button.primary { width: 100%; padding: 13px 16px; border: none; border-radius: 9px; background: var(--navy, #0B1D34); color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; }
  button.primary:disabled { opacity: .55; cursor: default; }
  button.link { background: none; border: none; color: var(--navy-soft, #2A4870); font-weight: 600; cursor: pointer; padding: 10px 0; font-size: 14px; }
  .err { color: var(--tx-bad, #b91c1c); font-size: 13.5px; margin-top: 10px; min-height: 1em; }
  .ok { color: var(--tx-ok, #15803d); }
  #pe { margin: 14px 0; min-height: 60px; }
  .hidden { display: none; }
  @media (max-width: 400px) { .card { padding: 16px; } .amount { font-size: 24px; } }
</style>
</head>
<body>
<header><a href="/portal">&larr; Portal</a><span class="t">Pay your balance</span></header>
<main>
  <div id="stepLoading" class="card"><p class="muted">Loading your balance…</p></div>

  <div id="stepError" class="card hidden">
    <h2>Online payment unavailable</h2>
    <p id="errText" class="muted"></p>
    <p><a href="/portal">Back to the portal</a></p>
  </div>

  <div id="stepMethod" class="card hidden">
    <div class="muted">Amount due to <span id="assocName"></span></div>
    <div class="amount" id="dueAmt"></div>
    <p class="muted">How would you like to pay?</p>
    <label class="choice" id="chCard"><input type="radio" name="kind" value="card"><b>Card</b>
      <div class="sub" id="feeCard"></div></label>
    <label class="choice" id="chBank"><input type="radio" name="kind" value="us_bank_account"><b>Bank account (ACH)</b>
      <div class="sub" id="feeAch"></div></label>
    <div id="peWrap" class="hidden">
      <div id="pe"></div>
      <p class="muted">The fee for your card type is shown on the next screen, before you pay.</p>
      <button class="primary" id="btnReview">Review payment</button>
    </div>
    <div class="err" id="errMethod"></div>
  </div>

  <div id="stepReview" class="card hidden">
    <h2>Review your payment</h2>
    <div class="muted" id="rvMethod"></div>
    <div class="row"><span>Assessment</span><span id="rvAssess"></span></div>
    <div class="row" id="rvFeeRow"><span id="rvFeeLabel"></span><span id="rvFee"></span></div>
    <div class="row total"><span>Total</span><span id="rvTotal"></span></div>
    <div class="disclosure" id="rvDisclosure"></div>
    <button class="primary" id="btnPay">Pay</button>
    <button class="link" id="btnChange">Use a different card or account</button>
    <div class="err" id="errReview"></div>
  </div>

  <div id="stepResult" class="card hidden">
    <h2 id="resTitle"></h2>
    <p id="resText" class="muted"></p>
    <div id="resBreakdown"></div>
    <p><a href="/portal">Back to the portal</a></p>
  </div>
</main>
<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const usd = (c) => '$' + (Number(c || 0) / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const params = new URLSearchParams(location.search);
  const propertyId = params.get('property_id') || null;
  const steps = ['stepLoading', 'stepError', 'stepMethod', 'stepReview', 'stepResult'];
  const show = (id) => steps.forEach((s) => $(s).classList.toggle('hidden', s !== id));
  const fail = (msg) => { $('errText').textContent = msg || 'Something went wrong. Please try again or contact management.'; show('stepError'); };

  let setup = null, stripe = null, elements = null, kind = null, paymentMethodId = null, quote = null;

  // ?staff_test=1: staff verification in Stripe TEST mode only (server refuses otherwise).
  const apiBase = params.get('staff_test') === '1' ? '/api/payments/test/assessment-intent/' : '/api/portal/pay/';
  async function api(path, body) {
    const r = await fetch(apiBase + path, {
      method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ property_id: propertyId }, params.get('staff_test') === '1' && params.get('amount') ? { test_amount_cents: parseInt(params.get('amount'), 10) } : {}, body || {})),
    });
    const j = await r.json().catch(() => ({}));
    if (r.status === 401) { location.href = '/portal-login.html'; throw new Error('Please sign in again.'); }
    return { ok: r.ok && !j.error, status: r.status, j };
  }

  function renderBreakdown(q, el) {
    el.textContent = '';
    const add = (label, val, cls) => {
      const d = document.createElement('div'); d.className = 'row' + (cls ? ' ' + cls : '');
      const a = document.createElement('span'); a.textContent = label;
      const b = document.createElement('span'); b.textContent = val;
      d.appendChild(a); d.appendChild(b); el.appendChild(d);
    };
    add('Assessment', usd(q.assessment_cents));
    if (q.fee_cents > 0) add(q.fee_label, usd(q.fee_cents));
    add('Total', usd(q.total_cents), 'total');
    const disc = document.createElement('div'); disc.className = 'disclosure'; disc.textContent = q.disclosure; el.appendChild(disc);
  }

  function showResult(status, q) {
    const map = {
      succeeded: ['Payment received', 'Thank you. Your payment was approved. Your balance updates as soon as it is confirmed, usually within a minute.'],
      processing: ['Bank payment submitted', 'Thank you. Bank payments take a few business days to clear. Your balance updates when the bank confirms it.'],
    };
    const m = map[status] || ['Payment not completed', 'Your payment was not completed and you have not been charged. Please try again.'];
    $('resTitle').textContent = m[0];
    $('resTitle').className = map[status] ? 'ok' : '';
    $('resText').textContent = m[1];
    if (q && map[status]) renderBreakdown(q, $('resBreakdown')); else $('resBreakdown').textContent = '';
    show('stepResult');
  }

  function mountElement() {
    $('errMethod').textContent = '';
    paymentMethodId = null;
    const opts = Object.assign({}, setup.elements, { paymentMethodTypes: [kind],
      appearance: { theme: 'stripe', variables: { colorPrimary: '#0B1D34', borderRadius: '8px' } } });
    if (kind === 'us_bank_account') opts.paymentMethodOptions = { us_bank_account: { verification_method: 'instant' } };
    try { elements = stripe.elements(opts); }
    catch (e) { delete opts.paymentMethodOptions; elements = stripe.elements(opts); }
    $('pe').textContent = '';
    const pe = elements.create('payment', { layout: 'tabs', wallets: { applePay: 'never', googlePay: 'never' } });
    pe.mount('#pe');
    $('peWrap').classList.remove('hidden');
  }

  function choose(k) {
    kind = k;
    $('chCard').classList.toggle('on', k === 'card');
    $('chBank').classList.toggle('on', k === 'us_bank_account');
    mountElement();
  }

  function renderReview(q) {
    quote = q;
    $('rvMethod').textContent = q.method_display || '';
    $('rvAssess').textContent = usd(q.assessment_cents);
    $('rvFeeRow').classList.toggle('hidden', !(q.fee_cents > 0));
    $('rvFeeLabel').textContent = q.fee_label || '';
    $('rvFee').textContent = usd(q.fee_cents);
    $('rvTotal').textContent = usd(q.total_cents);
    $('rvDisclosure').textContent = q.disclosure || '';
    $('btnPay').textContent = 'Pay ' + usd(q.total_cents);
    $('btnPay').disabled = false;
    $('errReview').textContent = '';
    show('stepReview');
  }

  async function review() {
    const btn = $('btnReview');
    btn.disabled = true; btn.textContent = 'Checking…'; $('errMethod').textContent = '';
    try {
      const sub = await elements.submit();
      if (sub.error) throw new Error(sub.error.message);
      const pm = await stripe.createPaymentMethod({ elements });
      if (pm.error) throw new Error(pm.error.message);
      paymentMethodId = pm.paymentMethod.id;
      const r = await api('quote', { payment_method_id: paymentMethodId });
      if (!r.ok) throw new Error(r.j.hint || r.j.error || 'Could not price this payment.');
      renderReview(r.j);
    } catch (e) {
      $('errMethod').textContent = e.message;
    } finally {
      btn.disabled = false; btn.textContent = 'Review payment';
    }
  }

  async function pay() {
    const btn = $('btnPay');
    btn.disabled = true; btn.textContent = 'Processing…'; $('errReview').textContent = '';
    try {
      const r = await api('confirm', { payment_method_id: paymentMethodId, quote_token: quote.quote_token });
      if (r.status === 409 && r.j.error === 'quote_changed' && r.j.quote) {
        renderReview(r.j.quote);
        $('errReview').textContent = r.j.hint;
        return;
      }
      if (!r.ok) throw new Error(r.j.hint || r.j.error || 'The payment could not be completed.');
      const shown = r.j.quote || quote;
      if (r.j.status === 'requires_action' && r.j.client_secret) {
        const na = await stripe.handleNextAction({ clientSecret: r.j.client_secret });
        if (na.error) throw new Error(na.error.message + ' You have not been charged. Please try again.');
        return showResult(na.paymentIntent && na.paymentIntent.status, shown);
      }
      showResult(r.j.status, shown);
    } catch (e) {
      $('errReview').textContent = e.message;
      btn.disabled = false; btn.textContent = 'Pay ' + usd(quote.total_cents);
    }
  }

  async function start() {
    if (params.get('demo') === '1') return fail('Online payment is not available in the demo portal.');
    let r;
    try { r = await api('setup'); } catch (e) { return fail(e.message); }
    if (!r.ok) return fail(r.j.hint || r.j.detail || r.j.error);
    setup = r.j;
    if (typeof Stripe !== 'function') return fail('The secure payment form could not load. Please check your connection and try again.');
    stripe = Stripe(setup.publishable_key);

    // Back from a bank or card redirect (3-D Secure via return_url).
    const secret = params.get('payment_intent_client_secret');
    if (params.get('returned') === '1' && secret) {
      const pr = await stripe.retrievePaymentIntent(secret);
      return showResult(pr.paymentIntent && pr.paymentIntent.status, null);
    }

    $('assocName').textContent = setup.association_name || 'your association';
    $('dueAmt').textContent = usd(setup.assessment_cents);
    $('feeCard').textContent = setup.fee_schedule.card + '.' + (setup.fee_schedule.debit ? ' ' + setup.fee_schedule.debit + '.' : '');
    $('feeAch').textContent = setup.fee_schedule.ach + '.';
    document.querySelectorAll('input[name="kind"]').forEach((i) => i.addEventListener('change', () => choose(i.value)));
    $('btnReview').addEventListener('click', review);
    $('btnPay').addEventListener('click', pay);
    $('btnChange').addEventListener('click', () => { show('stepMethod'); if (kind) mountElement(); });
    show('stepMethod');
  }
  start();
})();
</script>
</body>
</html>
