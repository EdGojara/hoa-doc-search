<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homeowner 360 — Bedrock</title>
<link rel="stylesheet" href="/brand.css">
<style>
  :root { --navy:#0B1D34; --gold:#D4AF37; --ink:#1a2230; --muted:#5a7390; --line:#e2e8f0; --bg:#f5f7fa; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; color:var(--ink); background:var(--bg); }
  .wrap { max-width:1100px; margin:0 auto; padding:20px 18px 60px; }
  h1 { margin:0; color:var(--navy); font-size:22px; }
  .sub { color:var(--muted); font-size:12.5px; margin:4px 0 16px; }
  .searchbar { display:flex; gap:8px; margin-bottom:14px; }
  .searchbar input { flex:1; padding:11px 14px; font-size:15px; border:1px solid var(--line); border-radius:9px; }
  .searchbar button { padding:0 20px; background:var(--navy); color:#fff; border:none; border-radius:9px; font-size:14px; cursor:pointer; }
  .results { background:#fff; border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-bottom:16px; }
  .rrow { padding:10px 14px; border-bottom:1px solid var(--line); cursor:pointer; display:flex; justify-content:space-between; gap:10px; }
  .rrow:last-child { border-bottom:none; } .rrow:hover { background:#f5f8fc; }
  .rrow .nm { font-weight:600; color:var(--navy); }
  .rrow .meta { font-size:12px; color:var(--muted); }
  .card { background:#fff; border:1px solid var(--line); border-radius:11px; padding:16px; margin-bottom:14px; }
  .hdr { display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:10px; }
  .hdr .nm { font-size:20px; font-weight:700; color:var(--navy); }
  .hdr .ct { font-size:13px; color:var(--muted); margin-top:3px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .chip { font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px; text-transform:uppercase; letter-spacing:.03em; }
  .chip.flag { background:#fee2e2; color:#991b1b; } .chip.ok { background:#dcfce7; color:#166534; } .chip.bal { background:#fef3c7; color:#92400e; }
  .recap { background:linear-gradient(180deg,#f8faff,#eef4fc); border:1px solid #d7e3f4; border-radius:11px; padding:15px; margin-bottom:14px; }
  .recap .lbl { font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:#3b5a86; margin-bottom:6px; display:flex; align-items:center; gap:6px; }
  .recap .body { font-size:14px; line-height:1.55; color:#1f2d3d; white-space:pre-wrap; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:760px){ .grid { grid-template-columns:1fr; } }
  .sec-title { font-size:12px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--navy); margin:0 0 10px; }
  .li { padding:7px 0; border-bottom:1px solid #f1f5f9; font-size:13px; }
  .li:last-child { border-bottom:none; }
  .li .t { color:var(--muted); font-size:11.5px; }
  .badge { display:inline-block; font-size:10px; font-weight:700; padding:1px 7px; border-radius:10px; }
  .b-open { background:#fef3c7; color:#92400e; } .b-res { background:#dcfce7; color:#166534; }
  .money { font-family:ui-monospace,monospace; }
  .tl-in { border-left:3px solid #3b82f6; } .tl-out { border-left:3px solid #94a3b8; } .tl-note { border-left:3px solid var(--gold); }
  .timeline .li.tl-in, .timeline .li.tl-out, .timeline .li.tl-note { padding-left:10px; }
  .notebox { display:flex; gap:6px; margin-bottom:10px; }
  .notebox input { flex:1; padding:7px 10px; font-size:12.5px; border:1px solid var(--line); border-radius:6px; }
  .notebox button { padding:0 12px; background:var(--gold); color:var(--navy); border:none; border-radius:6px; font-size:12px; font-weight:700; cursor:pointer; }
  .dropzone { border:1.5px dashed #cbd5e1; border-radius:8px; padding:10px; text-align:center; font-size:12px; color:var(--muted); cursor:pointer; margin-bottom:10px; background:#fbfcfe; }
  .dropzone.over { border-color:var(--gold); background:#fffdf5; color:var(--navy); }
  .timeline .li { padding-left:10px; }
  .empty { color:var(--muted); font-size:13px; padding:6px 0; }
  .spin { color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <a href="/" style="display:inline-flex;align-items:center;gap:6px;color:#5a7390;text-decoration:none;font-size:13px;font-weight:600;margin-bottom:12px;">&larr; Back to trustEd</a>
  <h1>Homeowner 360</h1>
  <div class="sub">Search a name, address, email, or phone. Everything about the homeowner in one place — for when they call or email.</div>
  <div class="searchbar">
    <input id="q" placeholder="e.g. Chen Gong · 19910 Cape Clover · gongc93@… · 281-…" autofocus onkeydown="if(event.key==='Enter')doSearch()">
    <button onclick="doSearch()">Search</button>
  </div>
  <div class="dropzone" id="gdz" ondragover="event.preventDefault();this.classList.add('over');" ondragleave="this.classList.remove('over');" ondrop="importReviewDrop(event)" onclick="document.getElementById('gfile').click()">📎 Drop an email (.msg/.eml) here to file it to the right homeowner(s) — the system finds who it's from and about, you confirm.</div>
  <input type="file" id="gfile" accept=".msg,.eml" style="display:none" onchange="if(this.files[0])importReview(this.files[0])">
  <div id="reviewModal"></div>
  <div id="results"></div>
  <div id="profile"></div>
</div>
<script>
const API='/api/homeowner';
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const money=c=>{c=Number(c)||0;return (c<0?'-':'')+'$'+(Math.abs(c)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});};
const d10=s=>s?String(s).slice(0,10):'';
// Date + time (Central), for note/correspondence timestamps.
const dt=s=>{ if(!s) return ''; try { return new Date(s).toLocaleString('en-US',{timeZone:'America/Chicago',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'2-digit'}); } catch(_){ return d10(s); } };
// Staff identity — so a note records WHO wrote it. Bootstraps the Supabase JWT
// the same way the other admin screens do; degrades gracefully if unavailable.
window.supa=null;
// Bootstrap the login client so a note records WHO wrote it. Store the promise
// so hoAuthHeader can AWAIT it — the first note-add used to fire before the
// client finished loading (timing race → blank author). Create the client
// whenever the keys are present (don't gate on the enforce flag). (Ed 2026-08-14.)
window._hoAuthReady=(async function(){
  try{
    const cfg=await fetch('/api/auth/config').then(r=>r.json());
    if(!cfg.supabase_url||!cfg.supabase_anon_key) return;
    if(!window.supabase){ await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=res;s.onerror=rej;document.head.appendChild(s);}); }
    window.supa=window.supabase.createClient(cfg.supabase_url,cfg.supabase_anon_key);
  }catch(e){ console.warn('[ho360] auth bootstrap failed:',e.message); }
})();
async function hoAuthHeader(){ try{ await window._hoAuthReady; if(window.supa){ const {data:{session}}=await window.supa.auth.getSession(); if(session&&session.access_token) return {Authorization:'Bearer '+session.access_token}; } }catch(_){}; return {}; }

// Inline edit of the homeowner's email / phone / name, right on the 360 — no
// hunting through property records. Updates the canonical contact. (Ed 2026-07-14.)
function hoToggleEdit(){
  const line=document.getElementById('ho-ctline'), ed=document.getElementById('ho-ctedit');
  if(!line||!ed) return;
  const show = ed.style.display==='none';
  ed.style.display = show?'block':'none'; line.style.display = show?'none':'block';
  if(show){ const em=document.getElementById('ho-email'); if(em) em.focus(); }
}
async function hoSaveContact(cid){
  const email=(document.getElementById('ho-email').value||'').trim();
  const phone=(document.getElementById('ho-phone').value||'').trim();
  const name=(document.getElementById('ho-name').value||'').trim();
  const msg=document.getElementById('ho-editmsg');
  if(email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ msg.style.color='#b91c1c'; msg.textContent='Enter a valid email.'; return; }
  msg.style.color='#5a7390'; msg.textContent='Saving…';
  try{
    const body={ primary_email: email||null, primary_phone: phone||null };
    if(name) body.full_name=name;
    const r=await fetch('/api/contacts/'+encodeURIComponent(cid),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const j=await r.json();
    if(!r.ok){ msg.style.color='#b91c1c'; msg.textContent='Could not save: '+(j.error||'error'); return; }
    openProfile(cid); // refresh the card with the saved values
  }catch(e){ msg.style.color='#b91c1c'; msg.textContent=e.message||'Save failed'; }
}

async function doSearch(){
  const q=document.getElementById('q').value.trim();
  if(q.length<2)return;
  document.getElementById('results').innerHTML='<div class="spin">Searching…</div>';
  document.getElementById('profile').innerHTML='';
  const r=await fetch(API+'/search?q='+encodeURIComponent(q)); const j=await r.json();
  const rs=j.results||[]; const conflicts=(j.name_conflicts||[]);
  if(!rs.length){ document.getElementById('results').innerHTML='<div class="empty">No homeowner found.</div>'; return; }

  // Same-name conflict handling: rows inside an UNRESOLVED "block" conflict are
  // gated until staff verifies same/different — "same name" must never silently
  // become "same person". (Ed 2026-07-25.)
  const blockedIds=new Set();
  conflicts.filter(c=>c.action==='block').forEach(c=>c.contacts.forEach(x=>blockedIds.add(x.contact_id)));

  const ctbl=(cs)=>`<table style="width:100%;border-collapse:collapse;font-size:12.5px;margin:8px 0;"><thead><tr style="color:#64748b;text-align:left;"><th style="padding:4px 6px;">Name</th><th style="padding:4px 6px;">Address</th><th style="padding:4px 6px;">Email</th><th style="padding:4px 6px;">Phone</th></tr></thead><tbody>${cs.map(x=>`<tr style="border-top:1px solid #eef2f7;"><td style="padding:4px 6px;">${esc(x.name)}</td><td style="padding:4px 6px;">${esc((x.properties||[]).join(', ')||'—')}</td><td style="padding:4px 6px;">${esc(x.email||'—')}</td><td style="padding:4px 6px;">${esc(x.phone||'—')}</td></tr>`).join('')}</tbody></table>`;
  const conflictHtml=conflicts.map(c=>{
    if(c.action==='verified_same'||c.action==='verified_different'){
      const same=c.action==='verified_same';
      return `<div style="border:1px solid #bbf7d0;background:#f0fdf4;border-radius:10px;padding:12px 14px;margin-bottom:12px;"><div style="font-weight:700;color:#166534;">✅ Identity verified — ${same?'same person':'confirmed separate owners'}</div>${ctbl(c.contacts)}</div>`;
    }
    const two=c.contacts.length===2;
    const isBlock=c.action==='block';
    const btns=two
      ? `<div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;"><button onclick="verifyIdentity('${c.contacts[0].contact_id}','${c.contacts[1].contact_id}','same_person')" style="background:#0B1D34;color:#fff;border:none;padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer;">Same Person — Link</button><button onclick="verifyIdentity('${c.contacts[0].contact_id}','${c.contacts[1].contact_id}','different_people')" style="background:#fff;color:#334155;border:1px solid #cbd5e1;padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer;">Different People — Keep Separate</button></div>`
      : `<div style="font-size:12px;color:#64748b;margin-top:4px;">More than two same-name records — review each individually.</div>`;
    return `<div style="border:1px solid ${isBlock?'#fecaca':'#fde68a'};background:${isBlock?'#fef2f2':'#fffbeb'};border-radius:10px;padding:12px 14px;margin-bottom:12px;">
      <div style="font-weight:700;color:${isBlock?'#991b1b':'#92400e'};">${isBlock?'⚠️ Identity Conflict Detected':'⚠️ Same name — please verify'}</div>
      <div style="font-size:12.5px;color:#5a7390;margin-top:2px;">${isBlock?'Contact details do not match across these records. Verify before opening either.':'These share a name and one contact detail. Confirm whether they are the same person.'}</div>
      ${ctbl(c.contacts)}${btns}
    </div>`;
  }).join('');

  const rowsHtml=rs.map(x=>{
    const blocked=blockedIds.has(x.contact_id);
    return `<div class="rrow" ${blocked?'style="opacity:0.55;cursor:not-allowed;" title="Resolve the identity conflict above first"':`onclick="openProfile('${x.contact_id}')"`}>
      <div><div class="nm">${esc(x.name)}${blocked?' <span style="font-size:10px;background:#fee2e2;color:#991b1b;padding:1px 6px;border-radius:99px;">verify identity</span>':''}</div><div class="meta">${esc((x.properties||[]).join(' · ')||'—')}</div></div>
      <div class="meta" style="text-align:right;">${esc(x.email||'')}<br>${esc(x.phone||'')}</div>
    </div>`;
  }).join('');

  document.getElementById('results').innerHTML=conflictHtml+'<div class="results">'+rowsHtml+'</div>';
}

async function verifyIdentity(id1,id2,result){
  if(result==='same_person' && !confirm('Confirm these two records are the SAME person and should be treated as one owner?')) return;
  try{
    const r=await fetch(API+'/verify-identity',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contact_id_1:id1,contact_id_2:id2,result})});
    const j=await r.json();
    if(!r.ok) throw new Error(j.error||'save failed');
    doSearch(); // re-run: the conflict now shows as a verified badge and rows unblock
  }catch(e){ alert('Could not save the verification: '+e.message); }
}
window.verifyIdentity=verifyIdentity;

// ── Resolve a violation (owner sent proof / cured) ──────────────────────────
// Preset notes, most-common first, + free-text "Other". Marks the violation
// cured in the DRV store; resolved_at flows the cure through every surface.
const RESOLVE_NOTES=['Photo proof received — cured','Verified cured in field','Owner corrected — resolved','No longer observed — resolved','Cured per management (proof on file)'];
function resolveCtrl(v){
  const opts=RESOLVE_NOTES.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('')+'<option value="__other__">Other (type below)…</option>';
  return `<div style="margin-top:7px;">
    <button onclick="showResolve('${v.id}')" style="font-size:11.5px;padding:3px 11px;border:1px solid #bbf7d0;border-radius:6px;background:#f0fdf4;color:#166534;cursor:pointer;font-weight:700;">✓ Resolve</button>
    <div id="rv-${v.id}" style="display:none;margin-top:7px;padding:9px 11px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:7px;">
      <div style="font-size:11px;color:#5a7390;margin-bottom:4px;font-weight:600;">Resolution note</div>
      <select id="rv-note-${v.id}" onchange="rvToggleOther('${v.id}')" style="width:100%;padding:6px 8px;border:1px solid #cbd5e1;border-radius:5px;font-size:12px;">${opts}</select>
      <input id="rv-free-${v.id}" placeholder="Add a note…" style="display:none;width:100%;margin-top:6px;padding:6px 8px;border:1px solid #cbd5e1;border-radius:5px;font-size:12px;box-sizing:border-box;">
      <div style="margin-top:8px;display:flex;gap:7px;align-items:center;">
        <button onclick="doResolve('${v.id}')" style="font-size:11.5px;padding:4px 12px;border:none;border-radius:6px;background:#0B1D34;color:#fff;cursor:pointer;font-weight:600;">Mark cured</button>
        <button onclick="document.getElementById('rv-${v.id}').style.display='none'" style="font-size:11.5px;padding:4px 10px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;cursor:pointer;">Cancel</button>
        <span id="rv-status-${v.id}" style="font-size:11px;color:#5a7390;"></span>
      </div>
    </div></div>`;
}
window.showResolve=function(id){const el=document.getElementById('rv-'+id);if(el)el.style.display=el.style.display==='none'?'block':'none';};
window.rvToggleOther=function(id){const sel=document.getElementById('rv-note-'+id);const free=document.getElementById('rv-free-'+id);if(sel&&free){const other=sel.value==='__other__';free.style.display=other?'block':'none';if(other)free.focus();}};
window.doResolve=async function(id){
  const sel=document.getElementById('rv-note-'+id);const free=document.getElementById('rv-free-'+id);
  let note=sel?sel.value:'';if(note==='__other__')note=(free&&free.value.trim())||'';
  if(!note){alert('Pick or type a resolution note.');return;}
  const st=document.getElementById('rv-status-'+id);if(st)st.textContent='Saving…';
  try{
    const r=await fetch(API+'/violations/'+encodeURIComponent(id)+'/resolve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({resolved_via:'cured',note})});
    const j=await r.json();if(!r.ok)throw new Error(j.error||'failed');
    if(window._ho&&window._ho.cid)openProfile(window._ho.cid);
  }catch(e){if(st)st.textContent='';alert('Could not resolve: '+e.message);}
};

async function openProfile(cid){
  document.getElementById('results').innerHTML='';
  document.getElementById('profile').innerHTML='<div class="spin">Loading homeowner…</div>';
  const r=await fetch(API+'/profile/'+cid); const d=await r.json();
  if(!r.ok){ document.getElementById('profile').innerHTML='<div class="empty">Could not load.</div>'; return; }
  const c=d.contact, ps=d.properties||[];
  // Stash context so the "email this letter" composer can pre-fill recipient + community.
  window._ho={ cid, name:(c&&c.full_name)||'', email:(c&&(c.primary_email||c.secondary_email))||'', propertyId:(ps[0]&&ps[0].id)||null, communityId:(ps[0]&&ps[0].community_id)||null, balanceCents:(d.ar&&d.ar.balance_cents)||0 };
  const openV=(d.violations||[]).filter(v=>v.open);
  // Drop voided violations from the record — they add no value and muddy the history. (Ed 2026-08-10)
  const vios=(d.violations||[]).filter(v=>String(v.current_stage)!=='voided' && v.resolved_via!=='voided');
  const flagChips=(d.flags||[]).map(f=>`<span class="chip flag">${esc(String(f.state).replace(/_/g,' '))}</span>`).join('');
  const balChip = d.ar.balance_cents>0?`<span class="chip bal">Owes ${money(d.ar.balance_cents)}</span>`:(d.ar.balance_cents<0?`<span class="chip ok">Credit ${money(-d.ar.balance_cents)}</span>`:`<span class="chip ok">Current</span>`);
  const am=d.amenity;
  const amenChip = (am&&am.allowed===false)?`<span class="chip" style="background:#fee2e2;color:#991b1b;font-weight:700;">🚫 Amenity restricted · past-due assessments</span>`
    :(am&&am.enforcement_override==='on_payment_plan')?`<span class="chip" style="background:#dbeafe;color:#1e40af;">Amenity OK · payment plan</span>`
    :(am&&am.enforcement_override==='in_bankruptcy')?`<span class="chip" style="background:#ede9fe;color:#5b21b6;">Amenity OK · bankruptcy</span>`:'';
  const openChip = openV.length?`<span class="chip flag">${openV.length} open violation${openV.length===1?'':'s'}</span>`:`<span class="chip ok">No open violations</span>`;

  // Collection / legal status (STAFF-ONLY). Glanceable header chip + a card below.
  const COLL_LABEL={with_attorney:'With attorney',lien_filed:'Lien filed',foreclosure:'Foreclosure',bankruptcy:'Bankruptcy',payment_plan:'Payment plan',board_review:'Board review',certified_demand:'Certified demand',delinquent_reminder:'Delinquent reminder',late_notice:'Late notice',written_off:'Written off',none:'None'};
  const LEGAL_STAGES=['with_attorney','lien_filed','foreclosure','board_review','certified_demand'];
  const colls=d.collections||[];
  const hasBk=colls.some(x=>x.collection_status==='bankruptcy');
  const atLegal=colls.some(x=>LEGAL_STAGES.includes(x.collection_status));
  const legalChip = hasBk?`<span class="chip" style="background:#fee2e2;color:#991b1b;font-weight:700;">⚖️ Bankruptcy — hands off</span>`
    : atLegal?`<span class="chip" style="background:#fef3c7;color:#92400e;font-weight:700;">⚖️ At legal</span>`:'';
  // Deed-restriction (DRV) at attorney — the enforcement track, separate from the
  // account/collections legal status above. STAFF-ONLY; route through counsel.
  const drvAtty = d.at_attorney && d.at_attorney.drv;
  const drvAttyChip = drvAtty?`<span class="chip" style="background:#7f1d1d;color:#fff;font-weight:700;" title="A deed-restriction violation is with the association's attorney${d.at_attorney.drv_categories&&d.at_attorney.drv_categories.length?' — '+esc(d.at_attorney.drv_categories.join(', ')):''}. Do not contact the homeowner directly on these.">⚖️ At attorney · deed restriction${d.at_attorney.drv_count>1?' ('+d.at_attorney.drv_count+')':''}</span>`:'';

  // merged correspondence timeline — every channel in one consistent view:
  // letters/notes (interactions) + emails (hub) + phone calls (voice log).
  const tl=[
    // Stage-change audit logs (Stage advanced/corrected/recalculated) are
    // enforcement activity, not correspondence — they clutter this view on
    // every account that ever changes stage. Keep them out; the actual letters
    // still show. (Ed 2026-07-14.)
    ...(d.interactions||[]).filter(i=>!(i.type==='observation_note' && /^Stage (advanced|corrected|recalculated|reset|recomputed)/i.test(i.subject||''))).map(i=>({t:i.sent_at||i.created_at, dir:i.direction, kind:(i.type||'').replace(/_/g,' '), label:i.type==='internal_note'?(i.content||i.subject):(i.subject||i.type), id:i.id, note:i.type==='internal_note', author:i.author_name||null, letterPath:(i.letter_available && i.content)?i.content:null})),
    ...(d.emails||[]).map(e=>({t:e.received_at, dir:e.direction, kind:'email', label:e.ai_summary||e.subject||'email'})),
    ...(d.calls||[]).map(c=>({t:c.started_at, dir:'inbound', kind:'call', label:(c.brief||('phone call'+(c.status?' · '+c.status:'')))+(c.duration_seconds?' ('+Math.round(c.duration_seconds/60)+'m)':'')})),
  ].filter(x=>x.t).sort((a,b)=>String(b.t).localeCompare(String(a.t))).slice(0,30);

  document.getElementById('profile').innerHTML=`
    <div class="card"><div class="hdr">
      <div style="flex:1;">
        <div class="nm">${esc(c.full_name)} <a href="#" onclick="event.preventDefault();hoToggleEdit()" style="font-size:12.5px;color:#1E2761;font-weight:600;text-decoration:none;white-space:nowrap;">✏️ Edit</a></div>
        <div id="ho-ctline"><div class="ct">${esc(c.primary_email||c.secondary_email||'no email')} · ${esc(c.primary_phone||'no phone')}</div></div>
        <div id="ho-ctedit" style="display:none;margin:6px 0;">
          <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">

  window.deleteNote=async function(id,cid){
    if(!confirm('Delete this note? This can’t be undone.'))return;
    const r=await fetch(API+'/note/'+id,{method:'DELETE'});
    if(r.ok){ openProfile(cid); } else { const j=await r.json().catch(()=>({})); alert(j.detail||'Could not delete'); }
  };
  window.editNote=async function(id,cid){
    const el=document.getElementById('note-txt-'+id);
    const cur=el?el.textContent:'';
    const next=prompt('Edit note:',cur);
    if(next===null) return;              // cancelled
    if(!next.trim()){ alert('A note can’t be blank — use ✕ to delete it.'); return; }
    if(next.trim()===cur.trim()) return; // unchanged
    const r=await fetch(API+'/note/'+id,{method:'PATCH',headers:{'Content-Type':'application/json',...(await hoAuthHeader())},body:JSON.stringify({content:next.trim()})});
    if(r.ok){ openProfile(cid); } else { const j=await r.json().catch(()=>({})); alert(j.detail||j.error||'Could not save'); }
  };
  // Upload a photo/PDF to the account. On a phone the file input opens the camera
  // (capture=environment). Grabs GPS for field photos (best-effort). (Ed 2026-07-14.)
  window.uploadAttachment=async function(cid, file){
    if(!file) return;
    const caption=prompt('Note for this file (e.g. "Attorney requested — current condition, at legal"):','');
    if(caption===null){ const el=document.getElementById('attFile'); if(el) el.value=''; return; }
    const send=async(lat,lng)=>{
      const fd=new FormData(); fd.append('file',file);
      if(caption) fd.append('caption',caption);
      if(lat!=null){ fd.append('gps_lat',lat); fd.append('gps_lng',lng); }
      let r; try{ r=await fetch(API+'/'+cid+'/attachment',{method:'POST',body:fd}); }catch(e){ alert('Upload failed — check your connection.'); return; }
      const j=await r.json().catch(()=>({}));
      const el=document.getElementById('attFile'); if(el) el.value='';
      if(r.ok){ openProfile(cid); } else { alert(j.detail||j.error||'Could not upload'); }
    };
    if(navigator.geolocation && (file.type||'').startsWith('image/')){
      navigator.geolocation.getCurrentPosition(p=>send(p.coords.latitude,p.coords.longitude), ()=>send(null,null), {timeout:4000,enableHighAccuracy:true});
    } else send(null,null);
  };
  window.deleteAttachment=async function(id,cid){
    if(!confirm('Remove this file from the account?'))return;
    const r=await fetch(API+'/attachment/'+id,{method:'DELETE'});
    if(r.ok){ openProfile(cid); } else alert('Could not remove');
  };

  let _slotResults={};
  function slotHtml(label,role,slot){
    const picked=slot&&(slot.contact_id||slot.property_id);
    const nameHtml=picked?esc((slot.name||'(owner unknown)')+(slot.address?' · '+slot.address:'')):'<span style="color:#94a3b8">not identified</span>';
    return `<div class="slot" data-role="${role}">
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;"><input type="checkbox" ${picked?'checked':''} class="slot-cb" data-contact="${slot&&slot.contact_id||''}" data-property="${slot&&slot.property_id||''}"> <strong>${esc(label)}:</strong> <span class="slot-name">${nameHtml}</span></label>
      <div style="margin-left:24px;margin-top:3px;"><input class="slot-search" placeholder="🔍 ${picked?'change':'search'} homeowner…" oninput="slotSearch(this,'${role}')" style="font-size:12px;padding:4px 8px;border:1px solid var(--line);border-radius:5px;width:240px;"><div class="slot-results" style="margin-top:2px;"></div></div>
    </div>`;
  }
  window.slotSearch=async function(inp,role){
    const q=inp.value.trim(); const box=inp.parentElement.querySelector('.slot-results'); if(q.length<2){box.innerHTML='';return;}
    const r=await fetch(API+'/search?q='+encodeURIComponent(q)); const j=await r.json(); _slotResults[role]=j.results||[];
    box.innerHTML=_slotResults[role].slice(0,6).map((x,i)=>`<div style="padding:4px 7px;cursor:pointer;font-size:12px;border:1px solid var(--line);border-radius:4px;margin-bottom:2px;background:#fff;" onclick="pickSlot('${role}',${i})">${esc(x.name)} <span style="color:#94a3b8">${esc((x.properties||[]).join(', '))}</span></div>`).join('')||'<div style="font-size:11px;color:#94a3b8;">no match</div>';
  };
  window.pickSlot=function(role,i){
    const x=(_slotResults[role]||[])[i]; if(!x)return;
    const slot=[...document.querySelectorAll('#reviewModal .slot')].find(s=>s.dataset.role===role); if(!slot)return;
    const cb=slot.querySelector('.slot-cb'); cb.checked=true; cb.dataset.contact=x.contact_id; cb.dataset.property='';
    slot.querySelector('.slot-name').textContent=x.name+((x.properties||[]).length?' · '+x.properties[0]:'');
    slot.querySelector('.slot-results').innerHTML=''; slot.querySelector('.slot-search').value='';
  };

    </div>`;
  }
  window.fileReview=async function(){
    const boxes=[...document.querySelectorAll('#reviewModal .slot-cb:checked')];
    const links=boxes.map(b=>{ const slot=b.closest('.slot'); return {role:slot?slot.dataset.role:'from',contact_id:b.dataset.contact||null,property_id:b.dataset.property||null}; });
    if(!links.length){ alert('Check at least one homeowner to file to.'); return; }
    const r=await fetch(API+'/import-file',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:_reviewEmail.email,classification:_reviewEmail.classification,links})});
    const j=await r.json();
    if(r.ok){ document.getElementById('reviewModal').innerHTML=`<div class="card" style="margin-top:14px;"><div style="font-size:13px;color:#166534;">✅ Filed to ${j.filed} homeowner${j.filed===1?'':'s'}’ history.</div></div>`; }
    else alert(j.error||'File failed');
  };
  window.addNote=async function(id){
    const inp=document.getElementById('noteInput'); const content=inp.value.trim(); if(!content)return;
    inp.disabled=true;
    const r=await fetch(API+'/'+id+'/note',{method:'POST',headers:{'Content-Type':'application/json',...(await hoAuthHeader())},body:JSON.stringify({content})});
    if(r.ok){ openProfile(id); } else { inp.disabled=false; alert('Could not save note'); }
  };
  // Draft an email to the homeowner with a letter attached (queued for review).
  window.emailLetter=function(pathEnc, label){
    const ho=window._ho||{}; window._letterEmail={ path:decodeURIComponent(pathEnc), label };
    const first=((ho.name||'').trim().split(/\s+/)[0])||'there';
    const defNote='Hi '+first+',\n\nPlease see the attached letter. If you have any questions or would like to discuss it, just reply to this email and we\'ll be glad to help.';
    const old=document.getElementById('letterEmailOverlay'); if(old) old.remove();
    const ov=document.createElement('div'); ov.id='letterEmailOverlay';
    ov.style.cssText='position:fixed;inset:0;background:rgba(11,29,52,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;';
    ov.innerHTML='<div style="background:#fff;border-radius:12px;max-width:560px;width:100%;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.3);">'
      +'<div style="font-weight:800;color:#0B1D34;font-size:16px;">✉️ Email letter to homeowner</div>'
      +'<div style="font-size:12px;color:#5a7390;margin:2px 0 14px;">'+esc(label)+' · sent from Claire with the PDF attached. Queued in the Draft Queue for your review — nothing sends until you release it.</div>'
      +'<label style="font-size:12px;color:#5a7390;font-weight:600;">To</label>'
      +'<input id="leTo" type="email" value="'+esc(ho.email||'')+'" placeholder="homeowner@email.com" style="width:100%;padding:8px 10px;border:1px solid #d7dee7;border-radius:7px;font-size:13px;margin:3px 0 10px;box-sizing:border-box;">'
      +'<label style="font-size:12px;color:#5a7390;font-weight:600;">Message</label>'
      +'<textarea id="leNote" style="width:100%;min-height:110px;padding:8px 10px;border:1px solid #d7dee7;border-radius:7px;font-size:13px;margin:3px 0 6px;box-sizing:border-box;">'+esc(defNote)+'</textarea>'
      +'<div id="leMsg" style="font-size:12.5px;min-height:18px;"></div>'
      +'<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px;">'
      +'<button onclick="document.getElementById(\'letterEmailOverlay\').remove()" style="padding:8px 14px;border:1px solid #d7dee7;background:#fff;border-radius:7px;cursor:pointer;font-size:13px;">Cancel</button>'
      +'<button id="leSend" onclick="submitLetterEmail()" style="padding:8px 16px;border:none;background:#0B1D34;color:#fff;border-radius:7px;cursor:pointer;font-size:13px;font-weight:700;">Queue draft</button>'
      +'</div></div>';
    ov.addEventListener('click',e=>{ if(e.target===ov) ov.remove(); });
    document.body.appendChild(ov);
  };
  window.submitLetterEmail=async function(){
    const ho=window._ho||{}, le=window._letterEmail||{};
    const to=(document.getElementById('leTo').value||'').trim();
    const note=(document.getElementById('leNote').value||'').trim();
    const msg=document.getElementById('leMsg'), btn=document.getElementById('leSend');
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(to)){ msg.style.color='#b91c1c'; msg.textContent='Enter a valid email address.'; return; }
    btn.disabled=true; btn.textContent='Queuing…'; msg.style.color='#5a7390'; msg.textContent='';
    try{
      const r=await fetch(API+'/email-letter',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ contact_id:ho.cid||null, property_id:ho.propertyId||null, letter_path:le.path, letter_label:le.label, to_email:to, note })});
      const j=await r.json().catch(()=>({}));
      if(!r.ok||!j.ok){ msg.style.color='#b91c1c'; msg.textContent=j.detail||j.error||'Could not draft the email.'; btn.disabled=false; btn.textContent='Queue draft'; return; }
      msg.style.color='#166534'; msg.innerHTML=(j.already?'Already drafted for '+esc(j.to)+'. ':'✓ Drafted to '+esc(j.to)+'. ')+'Review &amp; send it in the <b>Draft Queue</b>.';
      btn.textContent='Done'; setTimeout(()=>{ const ov=document.getElementById('letterEmailOverlay'); if(ov) ov.remove(); },2400);
    }catch(e){ msg.style.color='#b91c1c'; msg.textContent='Failed to draft.'; btn.disabled=false; btn.textContent='Queue draft'; }
  };

  // AI recap loads async so the profile is instant
  fetch(API+'/recap/'+cid).then(r=>r.json()).then(j=>{
    const el=document.querySelector('#recap .body');
    if(el) el.textContent = j.recap || 'No recap available.';
    if(el) el.classList.remove('spin');
  }).catch(()=>{ const el=document.querySelector('#recap .body'); if(el){el.textContent='Recap unavailable.';el.classList.remove('spin');} });
}

// Generate + copy a secure, emailable "pay my balance" link for this homeowner.
// Staff-only; the link resolves the live balance at click time and charges
// nothing until Stripe is live. (Ed 2026-08-08.)
async function copyPaymentLink(btn){
  const ho = window._ho || {};
  if(!ho.communityId || !ho.propertyId){ if(btn){ btn.textContent='No property/community on file'; } return; }
  const orig = btn ? btn.textContent : '';
  if(btn){ btn.disabled=true; btn.textContent='Generating…'; }
  try{
    const r = await fetch('/api/payments/payment-link', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ community_id: ho.communityId, property_id: ho.propertyId }) });
    const j = await r.json().catch(()=>({}));
    if(!r.ok || !j.url){ if(btn){ btn.textContent = (j.error==='property_not_in_community') ? 'Property/community mismatch' : (j.error||'Could not generate'); setTimeout(()=>{ btn.disabled=false; btn.textContent=orig; },2400);} return; }
    try{ await navigator.clipboard.writeText(j.url); }catch(_){ window.prompt('Copy the payment link:', j.url); }
    if(btn){ btn.textContent = j.stripe_ready ? '✓ Link copied' : '✓ Copied (Stripe not live yet)'; setTimeout(()=>{ btn.disabled=false; btn.textContent=orig; },2800); }
  }catch(e){ if(btn){ btn.textContent='Failed'; setTimeout(()=>{ btn.disabled=false; btn.textContent=orig; },2400);} }
}

// Deep link: /admin/homeowner?contact=<id> opens a profile directly (roster
// links from Payment Plans / other tools), ?q=<text> runs a search.
(function bootDeepLink(){
  try{
    const p=new URLSearchParams(location.search);
    const contact=p.get('contact');
    const property=p.get('property');
    const q=p.get('q');
    if(contact){ openProfile(contact); }
    else if(property){
      // Deep link by trustEd property id: resolve current owner → open profile.
      fetch(API+'/by-property/'+encodeURIComponent(property))
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(j){
          if(j && j.contact_id){ openProfile(j.contact_id); }
          else { const el=document.getElementById('q'); if(el){ el.value=''; el.placeholder='No current owner on file for that property — search by name or address.'; } }
        })
        .catch(function(){});
    }
    else if(q){ const el=document.getElementById('q'); if(el){ el.value=q; } doSearch(); }
  }catch(_){}
})();
</script>
