<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Talk to Amanda · Trusted</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/brand.css">
<link rel="stylesheet" href="/app/tx.css">
<style>
  .am-wrap { padding: 22px 28px 48px; max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .am-kicker { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--tx-muted); }
  .am-wrap h1 { margin: 4px 0 2px; font-family: var(--font-serif); font-weight: 600; font-size: clamp(28px, 6vw, 40px); color: var(--navy); line-height: 1.1; }
  .am-sub { color: var(--tx-text-2); font-size: 14px; max-width: 460px; }
  .am-face { position: relative; width: 168px; height: 168px; margin: 26px auto 14px; }
  .am-face img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; object-position: center 20%; border: 3px solid var(--tx-ivory, #fff); box-shadow: 0 6px 24px rgba(11, 29, 52, .18); position: relative; z-index: 1; }
  .am-ring { position: absolute; inset: -10px; border-radius: 50%; border: 3px solid transparent; transition: border-color .2s; }
  .am-face.is-listening .am-ring { border-color: var(--tx-rule); }
  .am-face.is-speaking .am-ring { border-color: var(--gold); animation: am-pulse 1.4s ease-in-out infinite; }
  @keyframes am-pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.06); opacity: .65; } }
  @media (prefers-reduced-motion: reduce) { .am-face.is-speaking .am-ring { animation: none; } }
  .am-state { font: 600 15px var(--font-sans); color: var(--navy); min-height: 22px; }
  .am-btns { display: flex; gap: 12px; margin: 18px 0 6px; flex-wrap: wrap; justify-content: center; }
  .am-go { min-width: 220px; min-height: 60px; border-radius: 999px; border: 0; background: var(--gold); color: var(--navy); font: 700 18px var(--font-sans); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 4px 14px rgba(11, 29, 52, .2); }
  .am-go.is-end { background: var(--tx-bad, #b42318); color: #fff; }
  .am-go[disabled] { opacity: .6; cursor: default; }
  .am-mute { min-height: 60px; min-width: 60px; border-radius: 999px; border: 1px solid var(--tx-rule); background: var(--tx-surface, #fff); color: var(--navy); font: 600 14px var(--font-sans); cursor: pointer; padding: 0 18px; }
  .am-mute.is-on { background: var(--navy); color: #fff; }
  .am-captions { width: 100%; margin-top: 18px; text-align: left; display: flex; flex-direction: column; gap: 8px; }
  .am-line { padding: 10px 14px; border-radius: 14px; font-size: 15px; line-height: 1.45; max-width: 88%; }
  .am-line.ed { align-self: flex-end; background: var(--tx-subtle, #eef1f5); color: var(--tx-text); }
  .am-line.amanda { align-self: flex-start; background: #fff; border: 1px solid var(--tx-rule-soft, #e6e9ee); color: var(--navy); }
  .am-cards { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-top: 16px; text-align: left; }
  .am-card { padding: 14px 16px; border-radius: 14px; border: 1px solid var(--tx-rule); background: #fff; }
  .am-card.decision { border-color: var(--gold); box-shadow: inset 4px 0 0 var(--gold); }
  .am-card b { display: block; font: 600 14.5px var(--font-sans); color: var(--navy); }
  .am-card p { margin: 4px 0 8px; font-size: 13.5px; color: var(--tx-text-2); white-space: pre-line; }
  .am-card a { font: 600 13.5px var(--font-sans); color: var(--tx-info); }
  .am-note { margin-top: 14px; font-size: 13.5px; line-height: 1.5; border-radius: 10px; padding: 10px 12px; text-align: left; width: 100%; }
  .am-note.bad { background: var(--tx-bad-bg); color: var(--tx-bad); } .am-note.info { background: var(--tx-info-bg); color: var(--tx-info); }
  .am-quality { margin-top: 22px; width: 100%; text-align: left; font-size: 13px; color: var(--tx-text-2); }
  .am-quality summary { cursor: pointer; font-weight: 600; color: var(--tx-muted); }
  .am-quality table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  .am-quality td { padding: 5px 4px; border-top: 1px solid var(--tx-rule-soft); }
  .am-quality td.n { text-align: right; font-variant-numeric: tabular-nums; }
  @media (max-width: 640px) { .am-wrap { padding: 12px 16px 40px; } .am-face { width: 140px; height: 140px; margin-top: 18px; } .am-go { min-width: 0; flex: 1; } }
</style>
</head>
<body class="tx-body">
<div class="tx-shell" id="tx-shell">
  <main class="tx-main" id="tx-main">
    <div class="tx-top"><button class="tx-menu-btn" id="tx-menu-btn" aria-label="Open navigation"></button></div>
    <div class="am-wrap">
      <div class="am-kicker">Bedrock AI team</div>
      <h1>Talk to Amanda</h1>
      <div class="am-sub">Amanda is Bedrock's AI senior community manager. Talk naturally, interrupt her any time. She remembers your conversations and can start work with the team. Approvals stay in trustEd.</div>
      <div class="am-face" id="am-face"><div class="am-ring"></div><img src="/assets/presentations/team/amanda.jpg" alt="Amanda Albright, Bedrock AI"></div>
      <div class="am-state" id="am-state" aria-live="polite">Ready when you are.</div>
      <div class="am-btns">
        <button class="am-go" id="am-go" type="button">Start talking</button>
        <button class="am-mute" id="am-mute" type="button" hidden>Mute</button>
      </div>
      <div id="am-audition"></div>
      <div id="am-alert"></div>
      <div class="am-cards" id="am-cards"></div>
      <div class="am-captions" id="am-captions" aria-live="polite"></div>
      <details class="am-quality" id="am-quality"><summary>Conversation quality (measured)</summary><div id="am-quality-body">Loading…</div></details>
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="/app/tx-icons.js"></script>
<script src="/app/tx.js"></script>
<script>
(async function () {
  'use strict';
  var CLIENT_URL = 'https://cdn.jsdelivr.net/npm/@elevenlabs/client@1.38.0/+esm';
  var $ = function (id) { return document.getElementById(id); };
  var esc = TX.esc;
  var user = await TX.boot({ active: 'amanda' });
  if (!user) return;
  if (!user.is_owner) { $('am-go').disabled = true; alert_('info', 'Talk to Amanda is available to the owner only for now.'); return; }

  var conv = null, session = null, muted = false, ending = false;
  var m = null; // client-side measurements for this conversation
  var seenCards = {};

  function alert_(kind, text) { $('am-alert').innerHTML = text ? '<div class="am-note ' + kind + '">' + esc(text) + '</div>' : ''; }
  // Owner voice audition (?audition=harper): this session only, never Amanda's approved voice.
  var AUDITION = (new URLSearchParams(location.search).get('audition') || '').trim().toLowerCase();
  // The notice shows only when the server confirms an audition session. An adopted audition (harper,
  // Amanda's Canon voice since 2026-11-27) opens the normal session with no notice.
  function showAudition(a) {
    $('am-audition').innerHTML = (AUDITION && a && a.name) ? '<div class="am-note info">' + esc(
      'Voice audition: ' + a.name + ' (' + a.tts_model + '). This session only; Amanda\'s approved voice is unchanged. Open this page without ?audition to go back.') + '</div>' : '';
  }
  showAudition(null);
  function state(text, mode) {
    $('am-state').textContent = text;
    $('am-face').className = 'am-face' + (mode ? ' is-' + mode : '');
  }
  function caption(who, text) {
    var box = $('am-captions');
    var d = document.createElement('div');
    d.className = 'am-line ' + who; d.textContent = text;
    box.appendChild(d);
    while (box.children.length > 8) box.removeChild(box.firstChild);
    d.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  function setButton(live) {
    var b = $('am-go');
    b.textContent = live ? 'End conversation' : 'Start talking';
    b.className = 'am-go' + (live ? ' is-end' : '');
    b.disabled = false;
    $('am-mute').hidden = !live;
  }

  async function refreshCards() {
    if (!session) return;
    var r = await TX.get('/api/amanda/voice/session/' + session.session_id + '/cards');
    if (!r.ok) return;
    (r.data.cards || []).forEach(function (c) {
      var key = c.kind + '|' + c.title + '|' + c.at;
      if (seenCards[key]) return; seenCards[key] = 1;
      var d = document.createElement('div');
      d.className = 'am-card ' + (c.kind === 'decision' ? 'decision' : '');
      var href = c.destination && (c.destination.href || c.destination.url);
      var link = href && /^\//.test(href) ? '<a href="' + esc(href) + '" target="_blank" rel="noopener">Open ' + esc(c.destination.where || 'in trustEd') + '</a>' : (c.destination && c.destination.where ? '<span class="tx-muted">' + esc(c.destination.where) + '</span>' : '');
      d.innerHTML = '<b>' + esc(c.title || '') + '</b>' + (c.detail ? '<p>' + esc(c.detail) + '</p>' : '') + link;
      $('am-cards').insertBefore(d, $('am-cards').firstChild);
    });
  }

  async function start() {
    alert_(); ending = false; seenCards = {}; $('am-cards').innerHTML = ''; $('am-captions').innerHTML = '';
    $('am-go').disabled = true;
    m = { t0: performance.now(), session_api_ms: null, connect_ms: null, response_gap_ms: [], interruptions: 0, errors: [], lastUserAt: null, mobile: /Mobi|Android|iPhone/i.test(navigator.userAgent) };
    state('Getting the microphone…');
    try { var s = await navigator.mediaDevices.getUserMedia({ audio: true }); s.getTracks().forEach(function (t) { t.stop(); }); }
    catch (e) { state('Ready when you are.'); setButton(false); alert_('bad', 'trustEd needs microphone access to talk with Amanda. Allow the microphone for this site in your browser settings, then try again.'); return; }
    state('Connecting to Amanda…');
    var t1 = performance.now();
    var lib = import(CLIENT_URL);
    var r = await TX.post('/api/amanda/voice/session', AUDITION ? { audition: AUDITION } : {});
    m.session_api_ms = Math.round(performance.now() - t1);
    if (!r.ok) { state('Ready when you are.'); setButton(false); alert_('bad', (r.body && r.body.error) || r.error || 'Amanda could not start.'); return; }
    session = r.data;
    showAudition(session.audition);
    if (session.briefing_incomplete && session.briefing_incomplete.length) alert_('info', 'Some of Amanda\'s sources did not load (' + session.briefing_incomplete.join(', ') + '). She will say so if you ask about them.');
    var Conversation;
    try { Conversation = (await lib).Conversation; }
    catch (e) { fail('The voice component did not load (' + e.message + '). Check the connection and try again.'); return; }
    try {
      conv = await Conversation.startSession({
        conversationToken: session.conversation_token,
        connectionType: 'webrtc',
        overrides: { agent: { firstMessage: session.first_message } },
        customLlmExtraBody: { session_token: session.session_token },
        onConnect: function (x) {
          m.connect_ms = Math.round(performance.now() - m.t0);
          setButton(true); state('Listening', 'listening');
          var cid = (x && x.conversationId) || (conv && conv.getId && conv.getId());
          if (cid) TX.post('/api/amanda/voice/session/' + session.session_id + '/connected', { conversation_id: cid });
        },
        onModeChange: function (x) {
          if (x.mode === 'speaking') {
            if (m.lastUserAt) { m.response_gap_ms.push(Math.round(performance.now() - m.lastUserAt)); m.lastUserAt = null; }
            state('Amanda is speaking', 'speaking');
          } else state(muted ? 'Muted' : 'Listening', 'listening');
        },
        onMessage: function (x) {
          var who = (x.role || x.source) === 'user' ? 'ed' : 'amanda';
          if (!x.message) return;
          // Expressive cues like [laughs] are performance notes for the voice, never shown.
          var said = who === 'amanda' ? String(x.message).replace(/\[[^\]\n]{0,40}\]\s*/g, '').replace(/ {2,}/g, ' ').trim() : x.message;
          if (!said) return;
          caption(who, said);
          if (who === 'ed') m.lastUserAt = performance.now();
          else refreshCards();
        },
        onInterruption: function () { m.interruptions++; },
        onError: function (msg) { m.errors.push(String(msg).slice(0, 200)); console.warn('[amanda] voice error', msg); },
        onDisconnect: function (d) { finish((d && d.reason) || 'ended'); },
      });
    } catch (e) { fail('Amanda could not connect (' + (e && e.message || e) + ').', 'connect_failed'); }
  }

  function fail(text, reason) {
    alert_('bad', text); state('Ready when you are.'); setButton(false);
    if (session && !ending) finish(reason || 'connect_failed');
  }

  async function finish(reason) {
    if (ending || !session) return; ending = true;
    var sid = session.session_id; var cid = conv && conv.getId ? conv.getId() : null;
    setButton(false); state('Saving the conversation…');
    var cm = m ? { connect_ms: m.connect_ms, session_api_ms: m.session_api_ms, response_gap_ms: m.response_gap_ms, interruptions: m.interruptions, errors: m.errors, disconnect_reason: reason, mobile: m.mobile } : null;
    await TX.post('/api/amanda/voice/session/' + sid + '/end', { client_metrics: cm, conversation_id: cid, reason: reason });
    await refreshCards();
    session = null; conv = null;
    state('Done. Amanda will remember this conversation.');
    loadQuality();
  }

  $('am-go').addEventListener('click', async function () {
    if (conv) { $('am-go').disabled = true; try { await conv.endSession(); } catch (_) { finish('user'); } return; }
    start();
  });
  $('am-mute').addEventListener('click', function () {
    if (!conv) return; muted = !muted; conv.setMicMuted(muted);
    $('am-mute').textContent = muted ? 'Unmute' : 'Mute'; $('am-mute').className = 'am-mute' + (muted ? ' is-on' : '');
    state(muted ? 'Muted' : 'Listening', 'listening');
  });
  window.addEventListener('pagehide', function () { if (conv) { try { conv.endSession(); } catch (_) {} } });

  async function loadQuality() {
    var r = await TX.get('/api/amanda/voice/metrics?days=30');
    var b = $('am-quality-body');
    if (!r.ok) { b.textContent = r.error || 'Not available yet.'; return; }
    var d = r.data; var L = d.latency_ms || {}; var c = d.cost_usd || {};
    var ms = function (x) { return x ? (x.p50 / 1000).toFixed(1) + 's typical, ' + (x.p90 / 1000).toFixed(1) + 's slow (' + x.n + ')' : 'not measured yet'; };
    var rows = [
      ['Conversations (30 days)', d.conversations + (d.abandoned ? ', ' + d.abandoned + ' left open' : '') + (d.failed_to_connect ? ', ' + d.failed_to_connect + ' failed to connect' : '')],
      ['Minutes', d.minutes],
      ['You stop talking to Amanda speaking', ms(L.heard_to_amanda_speaking)],
      ['Her first words (brain only)', ms(L.brain_first_words)],
      ['Looking things up', ms(L.tool_round)],
      ['Connecting', ms(L.connect)],
      ['Turns that failed', d.turns ? d.failed_turns + ' of ' + d.turns + ' (' + d.turn_failure_rate + '%)' : 'none yet'],
      ['Interruptions handled', d.interruptions],
      ['Cost', c.total != null ? '$' + c.total.toFixed(2) + (c.per_minute ? ' ($' + c.per_minute.toFixed(3) + ' a minute)' : '') : 'none yet'],
    ];
    b.innerHTML = '<table>' + rows.map(function (x) { return '<tr><td>' + esc(x[0]) + '</td><td class="n">' + esc(String(x[1])) + '</td></tr>'; }).join('') + '</table>';
  }
  loadQuality();
})();
</script>
</body>
</html>
