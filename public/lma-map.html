<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Visual Operating Map — Sterling Ridge</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="/brand.css" />
<style>
  :root { --navy:#0B1D34; --gold:#D4AF37; --line:#d0d7de;
    --st-problem:#c0392b; --st-progress:#e0873a; --st-upcoming:#2b6cb0; --st-completed:#2e7d5b; --st-ok:#7a8798; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; font-family:-apple-system,Segoe UI,Roboto,sans-serif; color:var(--navy); }
  #app { display:flex; height:100vh; }
  #map { flex:1; }
  #side { width:0; overflow:hidden; transition:width .18s; border-left:1px solid var(--line); background:#fff; }
  #side.open { width:380px; }
  #sideInner { width:380px; padding:16px; height:100%; overflow-y:auto; }
  .topbar { position:absolute; z-index:600; top:10px; left:10px; right:10px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; pointer-events:none; }
  .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:6px 8px; box-shadow:0 1px 4px rgba(0,0,0,.08); pointer-events:auto; }
  .title { font-weight:700; font-size:14px; }
  .sub { font-size:11px; color:#5b6672; }
  .seg button, .time button, .base button { border:1px solid var(--line); background:#fff; color:var(--navy); font-size:12px; padding:4px 9px; border-radius:6px; cursor:pointer; font-weight:600; }
  .seg button.on, .time button.on, .base button.on { background:var(--navy); color:#fff; border-color:var(--navy); }
  .legend { display:flex; gap:10px; font-size:11px; align-items:center; }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:3px; vertical-align:middle; }
  /* Attention markers — same exception-dot concept as the residential map: a
     strong red/amber fill with a white halo so it reads on satellite imagery.
     Static (no animation). Only issues get one; normal assets stay dot-free. */
  .attn-dot { width:16px; height:16px; border-radius:50%; border:2.5px solid #fff;
    box-shadow:0 1px 4px rgba(0,0,0,.55); cursor:pointer; box-sizing:border-box; }
  .attn-dot.red   { background:#c0392b; }
  .attn-dot.amber { background:#e0873a; }
  .attn-dot.dim   { opacity:.4; box-shadow:none; }
  h2 { font-size:16px; margin:2px 0 2px; }
  h3 { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:#5b6672; margin:16px 0 6px; border-bottom:1px solid var(--line); padding-bottom:3px; }
  .pill { display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px; color:#fff; }
  .kv { display:flex; justify-content:space-between; font-size:13px; padding:3px 0; }
  .kv b { font-weight:600; }
  .muted { color:#5b6672; font-size:12px; }
  .proj { border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:8px; }
  .bar { height:7px; background:#eef1f4; border-radius:5px; overflow:hidden; margin-top:5px; }
  .bar > i { display:block; height:100%; background:var(--gold); }
  .btn { background:var(--navy); color:#fff; border:none; border-radius:7px; padding:8px 12px; font-weight:700; font-size:13px; cursor:pointer; }
  .btn.ghost { background:#fff; color:var(--navy); border:1px solid var(--line); }
  .child { font-size:13px; padding:5px 0; border-bottom:1px dashed var(--line); cursor:pointer; }
  .child:hover { color:var(--gold); }
  textarea { width:100%; border:1px solid var(--line); border-radius:7px; padding:8px; font-family:inherit; font-size:13px; }
  .close { float:right; cursor:pointer; font-size:18px; color:#5b6672; }
  .hint { background:#fffbeb; border:1px solid #fde68a; color:#92400e; font-size:12px; padding:6px 9px; border-radius:6px; margin-top:6px; }
  .assetlabel { background:rgba(11,29,52,.92); color:#eaf1fb; border:none; border-radius:8px; padding:6px 9px; font-size:11.5px; line-height:1.35; box-shadow:0 2px 8px rgba(0,0,0,.3); white-space:nowrap; }
  .assetlabel b { color:#fff; } .assetlabel::before { display:none; }
  .photocard { margin:4px 0 8px; }
  .photocard .photo { width:100%; max-height:180px; object-fit:cover; border-radius:10px; display:block; cursor:pointer; background:#0b1d34; }
  .pmeta { font-size:12px; color:#5a6b83; margin-top:5px; line-height:1.4; }
  .ptype { display:inline-block; background:#0B1D34; color:#fff; font-size:9.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; padding:2px 6px; border-radius:20px; margin-right:6px; }
  #gallery { display:none; position:fixed; inset:0; z-index:2000; background:rgba(6,14,26,.82); align-items:center; justify-content:center; }
  #gallery .gwrap { background:#fff; color:#1c2635; width:min(920px,94vw); max-height:88vh; overflow:auto; border-radius:14px; padding:14px 16px; }
  #gallery .ghead { display:flex; align-items:center; font-size:15px; margin-bottom:10px; }
  #gallery .gclose { margin-left:auto; cursor:pointer; font-size:18px; color:#5a6b83; }
  #gallery .ggrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; }
  #gallery .gitem img { width:100%; height:150px; object-fit:cover; border-radius:8px; background:#0b1d34; }
  #gallery .gcap { font-size:11.5px; color:#5a6b83; margin-top:5px; line-height:1.4; }
</style>
</head>
<body>
<div id="app">
  <div id="map">
    <div class="topbar">
      <div class="card"><div class="title">Sterling Ridge Landscape District</div><div class="sub" id="sub">Visual Operating Map</div></div>
      <div class="card seg" id="lensSeg">
        <button data-lens="condition" class="on">Condition</button><button data-lens="spending">Spending</button>
        <button data-lens="budget">Budget</button><button data-lens="projects">Projects</button>
      </div>
      <div class="card time" id="spendCtl" style="display:none">
        <button data-w="ytd">YTD</button><button data-w="prior_year">Prior year</button><button data-w="three_year" class="on">3 years</button>
        <span style="opacity:.4;padding:0 2px">·</span>
        <button data-m="amount" class="on">Amount</button><button data-m="last_spend">Last spend</button>
      </div>
      <div class="card legend" id="legend"></div>
      <div class="card base" id="baseSeg">
        <button data-b="hybrid" class="on">🛰️</button><button data-b="street">🗺️</button>
      </div>
      <div class="card" id="editCard" style="display:none">
        <button class="btn ghost" id="editToggle">✏️ Edit geometry</button>
        <div id="editTools" style="display:none; margin-top:6px;">
          <button class="btn ghost" data-g="point">Point</button>
          <button class="btn ghost" data-g="line">Line</button>
          <button class="btn ghost" data-g="polygon">Polygon</button>
          <button class="btn" id="editSave" style="display:none">Save</button>
          <button class="btn ghost" id="editCancel">Cancel</button>
          <div class="hint" id="editHint">Select an asset, choose a shape, click on the map to place/draw.</div>
        </div>
      </div>
    </div>
  </div>
  <div id="side"><div id="sideInner"></div></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const params = new URLSearchParams(location.search);
const COMMUNITY_ID = params.get('community_id') || 'e0100000-0000-4000-a000-000000000000'; // Sterling Ridge LMA
const STAFF = params.get('staff') === '1';
const VIEW_AS = params.get('view_as') || '';   // staff view-as-board (same mechanism as community-map)
// Attach the staff Supabase Bearer to API calls, exactly like community-map.html /
// board-portal.html, so the viewer is resolved deterministically (staff -> all;
// staff+view_as -> that board member's scope). No new auth, no demo bypass.
let _supa = null;
async function initAuth() {
  try {
    const cfg = await (await fetch('/api/auth/config')).json();
    if (cfg && cfg.enabled && window.supabase) _supa = window.supabase.createClient(cfg.supabase_url, cfg.supabase_anon_key);
  } catch (_) {}
}
async function cmFetch(path, opts) {
  opts = opts || {}; const h = Object.assign({}, opts.headers || {});
  try { if (_supa) { const s = (await _supa.auth.getSession()).data.session; if (s && s.access_token) h.Authorization = 'Bearer ' + s.access_token; } } catch (_) {}
  const sep = path.indexOf('?') >= 0 ? '&' : '?';
  const url = VIEW_AS ? path + sep + 'view_as=' + encodeURIComponent(VIEW_AS) : path;
  return fetch(url, Object.assign({ credentials: 'include' }, opts, { headers: h }));
}
const STATUS_COLOR = { problem:'#c0392b', in_progress:'#e0873a', upcoming:'#2b6cb0', completed:'#2e7d5b', ok:'#7a8798' };
const money = (c) => c == null ? '—' : '$' + (c/100).toLocaleString(undefined,{maximumFractionDigits:0});
const esc = (s) => String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

const map = L.map('map', { zoomControl:true }).setView([30.0585,-95.5535], 16);
const esriSat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,attribution:'Esri'});
const esriLabels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:20});
const street = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'});
const hybrid = L.layerGroup([esriSat, esriLabels]);
hybrid.addTo(map);
const LABELS = L.layerGroup().addTo(map); // compact callouts anchored to asset centroids
const ATTN = L.layerGroup().addTo(map);   // red/amber attention dots (drawn above everything)
let _lastDetail = null; // cached asset detail for the photo gallery
document.getElementById('baseSeg').addEventListener('click', e => { const b=e.target.dataset.b; if(!b) return;
  document.querySelectorAll('#baseSeg button').forEach(x=>x.classList.toggle('on', x.dataset.b===b));
  map.removeLayer(hybrid); map.removeLayer(street); (b==='street'?street:hybrid).addTo(map); });

let ASSETS = [], LAYERS = {}, BOUNDARY_LAYER=null, activeLens='condition', spendWindow='three_year', spendMode='amount', selectedId=null;
const WINDOW_LABEL = { ytd:'YTD', prior_year:'Prior year', three_year:'3-year' };
function ageLabel(b){ return ({lt_1y:'under 1 year','1_2y':'1–2 years','2_4y':'2–4 years','4y_plus':'4+ years',none:'no recorded spend'})[b]||b; }
function budgetLabel(s){ return ({under:'Under approved',on_track:'On track',watch:'Watch — approaching approved',over:'Over approved',none:'No approved amount'})[s]||s; }
if (STAFF) document.getElementById('editCard').style.display='';

// Child/system assets (irrigation, beds, uplighting under a median) are drawn
// subordinate so at the opening scale you read ~a handful of clear physical
// areas — the medians, entrance monuments, detention — not 16 competing shapes.
// Click a median and its systems are right there. Nothing is hidden or deleted.
const isChild = (a) => !!a.parent_asset_id;
// ---- LENS ARCHITECTURE ------------------------------------------------------
// The SAME physical asset model + operational/financial metrics + the selected
// lens -> a visualization. Adding a lens is adding a registry entry; the map,
// legend, tooltips and restyle loop are generic. Metrics come from the server
// (asset.metrics) computed once, so switching lens/window is instant + offline.
function spendVal(a){ return (a.metrics && a.metrics.spend && a.metrics.spend.location && a.metrics.spend.location[spendWindow]) || 0; }
function spendThresh(){ const v=ASSETS.map(spendVal).filter(x=>x>0); const max=v.length?Math.max.apply(null,v):0; return { t1:max/3, t2:2*max/3, max }; }
function spendBucket(a){ const v=spendVal(a); if(!v) return 'none'; const {t1,t2}=spendThresh(); return v<=t1?'low':v<=t2?'med':'high'; }
const COND_BUCKET = { excellent:'good', good:'good', fair:'fair', poor:'poor', failing:'poor' };
const LENSES = {
  condition: {
    label:'Condition',
    bucket:a=> COND_BUCKET[(a.metrics&&a.metrics.condition)||a.condition]||'unknown',
    color:{ good:'#2e7d5b', fair:'#e0873a', poor:'#c0392b', unknown:'#9aa7b8' },
    legend:()=>[['#2e7d5b','Good'],['#e0873a','Fair / attention'],['#c0392b','Poor'],['#9aa7b8','Not rated']],
    metric:a=> 'condition: '+((a.metrics&&a.metrics.condition)||a.condition||'—'),
  },
  spending: {
    label:'Spending',
    bucket:a=> spendMode==='last_spend' ? ((a.metrics&&a.metrics.age_bucket)||'none') : spendBucket(a),
    color:()=> spendMode==='last_spend'
      ? { lt_1y:'#2e7d5b', '1_2y':'#86a94e', '2_4y':'#e0873a', '4y_plus':'#c0392b', none:'#9aa7b8' }
      : { none:'#cdd7e1', low:'#93b4d6', med:'#3f79ad', high:'#123a66' },
    legend:()=> spendMode==='last_spend'
      ? [['#2e7d5b','< 1 year'],['#86a94e','1–2 years'],['#e0873a','2–4 years'],['#c0392b','4+ years'],['#9aa7b8','No recorded spend']]
      : [['#123a66','Highest spend'],['#3f79ad','Higher'],['#93b4d6','Some'],['#cdd7e1','Little / none']],
    metric:a=> spendMode==='last_spend'
      ? ('last spend: '+((a.metrics&&a.metrics.last_spend&&a.metrics.last_spend.location_date)||'none'))
      : (WINDOW_LABEL[spendWindow]+' spend: '+money(spendVal(a))),
  },
  budget: {
    label:'Budget',
    bucket:a=> (a.metrics&&a.metrics.budget&&a.metrics.budget.status)||'none',
    color:{ under:'#2e7d5b', on_track:'#2b6cb0', watch:'#e0873a', over:'#c0392b', none:'#9aa7b8' },
    legend:()=>[['#2e7d5b','Under approved'],['#2b6cb0','On track'],['#e0873a','Watch'],['#c0392b','Over approved'],['#9aa7b8','No approved amount']],
    metric:a=>{ const b=a.metrics&&a.metrics.budget; return (b&&b.approved_cents)?('approved '+money(b.approved_cents)+' / actual '+money(b.actual_cents)):'no approved amount'; },
  },
  projects: {
    label:'Projects',
    bucket:a=> (a.metrics&&a.metrics.project_status)||'none',
    color:{ planned:'#6b7b92', awaiting_approval:'#2b6cb0', active:'#e0873a', completed:'#2e7d5b', none:'#9aa7b8' },
    legend:()=>[['#e0873a','Active'],['#2b6cb0','Awaiting approval'],['#6b7b92','Planned'],['#2e7d5b','Completed'],['#9aa7b8','No projects']],
    metric:a=> 'projects: '+(((a.metrics&&a.metrics.project_status)||'none').replace(/_/g,' ')),
  },
};
function lensColor(a){ const L=LENSES[activeLens]; const col=(typeof L.color==='function')?L.color():L.color; return col[L.bucket(a)]||'#9aa7b8'; }
// ---- ATTENTION MARKERS ------------------------------------------------------
// Colored "there is an issue here" dots on top of the existing outlines — the
// same exception-marker idea the residential (Drama Creek) map uses. Only lenses
// where an asset can NEED attention get dots (Condition / Projects / Budget);
// Spending + Spend-age keep their existing graduated visualization. A dot is
// PURELY a navigator: clicking it opens the existing asset record (select parent
// -> reveal child systems -> fit -> open detail panel). No new detail system.
const _cond = a => COND_BUCKET[(a.metrics&&a.metrics.condition)||a.condition]||'unknown';
const _proj = a => (a.metrics&&a.metrics.project_status)||'none';
const _bud  = a => (a.metrics&&a.metrics.budget&&a.metrics.budget.status)||'none';
// Attention level for a PRIMARY asset under the active lens: 'red' | 'amber' | null.
function attnLevel(a){
  if (activeLens==='condition'){ const b=_cond(a); return b==='poor'?'red':b==='fair'?'amber':null; }
  if (activeLens==='budget'){ const s=_bud(a);  return s==='over'?'red':s==='watch'?'amber':null; }
  if (activeLens==='projects'){ const s=_proj(a); return s==='awaiting_approval'?'red':s==='active'?'amber':null; }
  return null; // spending / spend-age retain their existing visualization
}
function attnReason(a){
  if (activeLens==='condition') return (_cond(a)==='poor'?'poor':'fair')+' condition';
  if (activeLens==='budget')    return _bud(a)==='over'?'over approved':'approaching approved';
  if (activeLens==='projects')  return _proj(a)==='awaiting_approval'?'project awaiting approval':'active project';
  return '';
}
// The dot sits over the CHILD SYSTEM that drives the issue when one exists
// (e.g. Median 7 -> Median 7 Irrigation centroid), else the parent centroid.
function driverChild(a){
  const kids = ASSETS.filter(x=>x.parent_asset_id===a.id); if(!kids.length) return null;
  if (activeLens==='condition'){ const pb=_cond(a); return kids.find(k=>_cond(k)===pb)||null; }
  if (activeLens==='projects'){ const ps=_proj(a);  return kids.find(k=>_proj(k)===ps)||null; }
  if (activeLens==='budget'){ const bs=_bud(a);   return kids.find(k=>_bud(k)===bs)||null; }
  return null;
}
function attnLatLng(a){ const c=driverChild(a); const cen=(c&&c.centroid)||a.centroid; return cen?[cen.lat,cen.lng]:null; }
// Rebuild the attention layer for the current lens. Primaries only — a child's
// issue surfaces as its parent's dot at the child's location.
function drawAttention(){
  if(!ATTN) return; ATTN.clearLayers();
  ASSETS.filter(a=>!a.parent_asset_id).forEach(a=>{
    const lvl=attnLevel(a); if(!lvl) return;
    const ll=attnLatLng(a); if(!ll) return;
    const dim = selectedId && a.id!==selectedId && a.parent_asset_id!==selectedId;
    const m=L.marker(ll,{ icon:L.divIcon({ className:'', html:`<div class="attn-dot ${lvl}${dim?' dim':''}"></div>`, iconSize:[16,16], iconAnchor:[8,8] }), interactive:true, keyboard:false, zIndexOffset:1000 });
    m.on('click', e=>{ L.DomEvent.stop(e); openDetail(a.id); });
    m.bindTooltip(esc(a.name)+' — '+esc(attnReason(a)), { direction:'top', offset:[0,-6] });
    ATTN.addLayer(m);
  });
}
// Default map shows PRIMARY (top-level) assets. A selected asset also reveals its
// child systems. Unrelated assets de-emphasise so the selected place stands out.
function visibleAssets(){ return ASSETS.filter(a => !a.parent_asset_id || a.id===selectedId || (selectedId && a.parent_asset_id===selectedId)); }
function selState(a){ if(a.id===selectedId) return 'sel'; if(selectedId && a.parent_asset_id===selectedId) return 'child'; if(selectedId) return 'dim'; return 'normal'; }
function isLine(a){ return a.geometry && (a.geometry.type==='LineString' || a.geometry.type==='MultiLineString'); }
function styleFor(a){ const c=lensColor(a); const line=isLine(a); const s=selState(a);
  if (s==='sel')  return { color:c, weight:line?7:3.5, fillColor:c, fillOpacity:0.45, opacity:1 };
  if (s==='child')return { color:c, weight:line?3:1.5, fillColor:c, fillOpacity:0.32, opacity:0.95, dashArray:'3,3' };
  if (s==='dim')  return { color:c, weight:line?3:1.5, fillColor:c, fillOpacity:0.12, opacity:0.45 };
  return { color:c, weight:line?4:2, fillColor:c, fillOpacity:0.38, opacity:0.95 };
}
function pointMarker(a, latlng){ const c=lensColor(a); const s=selState(a); let r=isChild(a)?5:8;
  if (activeLens==='spending' && spendMode==='amount' && s!=='dim'){ r=({none:5,low:7,med:10,high:14})[spendBucket(a)]; if(isChild(a)) r=Math.max(4,r-3); }
  if (s==='sel') r+=3;
  return L.circleMarker(latlng, { radius:r, color:'#fff', weight:s==='sel'?3:2, fillColor:c, fillOpacity:s==='dim'?0.4:1, opacity:s==='dim'?0.5:1 }); }
function tooltipFor(a){ return esc(a.name)+' — '+esc(LENSES[activeLens].metric(a)); }
function renderLegend(){ const rows=LENSES[activeLens].legend();
  document.getElementById('legend').innerHTML = rows.map(r=>`<span><i class="dot" style="background:${r[0]}"></i>${esc(r[1])}</span>`).join(''); }

// Compact project callouts anchored to the asset's interior point (centroid from
// ST_PointOnSurface). Shown for the SELECTED asset and, under the Projects lens,
// for assets with active work — never a wall of cards over the map.
function labelHTML(a){ const p=a.active_project;
  if (p) return `<b>${esc(a.name)}</b><br>${esc(p.title)}<br>${p.percent_complete!=null?p.percent_complete+'% · ':''}${money(p.actual_cents)} / ${money(p.approved_cents)}`;
  return `<b>${esc(a.name)}</b>`; }
function renderLabels(){ if(!LABELS) return; LABELS.clearLayers();
  const ACT=['approved','contract_signed','work_started'];
  ASSETS.forEach(a=>{ if(!a.centroid) return;
    const activeProj = a.active_project && ACT.includes(a.active_project.stage);
    const show = (a.id===selectedId) || (activeLens==='projects' && activeProj);
    if(!show) return;
    L.tooltip({permanent:true, direction:'top', className:'assetlabel', offset:[0,-2]})
      .setLatLng([a.centroid.lat, a.centroid.lng]).setContent(labelHTML(a)).addTo(LABELS);
  }); }

// Rebuild every asset layer under the current lens (client-side, instant — no
// fetch). Called on first load and on every lens/window/mode change.
function drawAssets(){
  Object.values(LAYERS).forEach(l=>map.removeLayer(l)); LAYERS={};
  visibleAssets().forEach(a => { if(!a.geometry) return;
    const lyr = L.geoJSON({type:'Feature', geometry:a.geometry, properties:{}}, {
      style:()=>styleFor(a), pointToLayer:(f,ll)=>pointMarker(a,ll),
      onEachFeature:(f,l)=>{ l.on('click', ()=>openDetail(a.id)); l.bindTooltip(tooltipFor(a),{sticky:true}); }
    });
    LAYERS[a.id]=lyr; lyr.addTo(map);
  });
  renderLegend(); renderLabels(); drawAttention();
}
// Center/zoom on the selected asset (and its child systems), so THIS physical
// place fills the view when its record opens.
function fitSelected(){ if(!selectedId) return; const ids=[selectedId, ...ASSETS.filter(a=>a.parent_asset_id===selectedId).map(a=>a.id)];
  let bb=null; ids.forEach(id=>{ const l=LAYERS[id]; if(!l) return; try{ const b=l.getBounds(); if(b.isValid()) bb = bb? bb.extend(b) : L.latLngBounds(b.getSouthWest(), b.getNorthEast()); }catch(_){} });
  if (bb && bb.isValid()) map.fitBounds(bb, { padding:[90,90], maxZoom:18 }); }
document.getElementById('lensSeg').addEventListener('click', e=>{ const L=e.target.dataset.lens; if(!L) return;
  activeLens=L; document.querySelectorAll('#lensSeg button').forEach(x=>x.classList.toggle('on',x.dataset.lens===L));
  document.getElementById('spendCtl').style.display = (L==='spending')?'':'none';
  drawAssets(); if(selectedId) openDetail(selectedId); });
document.getElementById('spendCtl').addEventListener('click', e=>{ const w=e.target.dataset.w, m=e.target.dataset.m;
  if(w){ spendWindow=w; document.querySelectorAll('#spendCtl [data-w]').forEach(x=>x.classList.toggle('on',x.dataset.w===w)); }
  if(m){ spendMode=m; document.querySelectorAll('#spendCtl [data-m]').forEach(x=>x.classList.toggle('on',x.dataset.m===m)); }
  if(w||m){ drawAssets(); if(selectedId) openDetail(selectedId); } });

function banner(msg) {
  let el=document.getElementById('mapBanner');
  if(!el){ el=document.createElement('div'); el.id='mapBanner';
    el.setAttribute('style','position:absolute;z-index:700;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border:1px solid #c0392b;color:#0B1D34;border-radius:10px;padding:16px 22px;max-width:420px;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.2);font-size:14px;');
    document.getElementById('map').appendChild(el); }
  el.innerHTML=msg;
}
async function loadAssets() {
  let r;
  try { r = await cmFetch('/api/community-map/assets?community_id='+encodeURIComponent(COMMUNITY_ID)); }
  catch(e){ banner('<b>Map data could not be reached.</b><br>'+e.message); return; }
  if (!r.ok) {
    const hint = r.status===401 ? 'Your demo session is not authorized for this community. Re-enter from the Demo launcher.'
      : r.status===404 ? 'The asset service is not deployed yet. Deploy the latest build, then reload.'
      : 'HTTP '+r.status+'. Reload, or redeploy the latest build.';
    document.getElementById('sub').textContent='Failed to load ('+r.status+')';
    banner('<b>Sterling Ridge map data unavailable ('+r.status+').</b><br>'+hint);
    console.error('[lma-map] /assets failed', r.status);
    return;
  }
  const j = await r.json(); ASSETS = j.assets||[];
  if (!ASSETS.length) { banner('<b>No managed assets found for this community.</b><br>The Sterling Ridge dataset may not be seeded on this environment.'); }
  else { const b=document.getElementById('mapBanner'); if(b) b.remove(); }
  const bounds=[];
  // District perimeter (from the canonical boundary RPC) — a quiet frame so the
  // assets read as "the area they manage," drawn under the assets.
  if (BOUNDARY_LAYER) { map.removeLayer(BOUNDARY_LAYER); BOUNDARY_LAYER=null; }
  // District boundary removed from the default view (Ed 2026-09-21): the traced
  // physical assets, on real satellite features, define the operating area — no
  // dashed rectangle floating over the imagery.
  drawAssets(); // builds LAYERS under the current lens (client-side)
  Object.values(LAYERS).forEach(l=>{ try { const b=l.getBounds(); if(b.isValid()) bounds.push(b); } catch(_) {} });
  document.getElementById('sub').textContent = ASSETS.length+' managed assets';
  if (bounds.length) { let bb=bounds[0]; bounds.forEach(b=>bb=bb.extend(b)); map.fitBounds(bb,{padding:[60,60]}); }
}

async function openDetail(id) {
  selectedId=id; drawAssets(); fitSelected();
  const r = await cmFetch('/api/community-map/asset/'+id+'/detail');
  if (!r.ok) return;
  const d = await r.json(); _lastDetail = d; const a=d.asset;
  const st = (ASSETS.find(x=>x.id===id)||{}).map_status || 'ok';
  const proj = d.projects||[];
  let html = `<span class="close" onclick="closeSide()">✕</span>`;
  html += `<div class="pill" style="background:${STATUS_COLOR[st]}">${esc(st.replace('_',' '))}</div>`;
  html += `<h2>${esc(a.name)}</h2><div class="muted">${esc(a.asset_type)} · condition: ${esc(a.condition||'unknown')}</div>`;
  if (a.location_description) html+=`<div class="muted">${esc(a.location_description)}</div>`;
  if (d.parent) html+=`<div class="muted">Part of <a href="#" onclick="openDetail('${d.parent.id}');return false">${esc(d.parent.name)}</a></div>`;

  // Asset Intelligence — deterministic, grounded, lens-aware. Explains what the
  // board should understand about this asset under the currently selected lens.
  const intel = (d.intelligence && d.intelligence.narratives && d.intelligence.narratives[activeLens]) || '';
  if (intel) html += `<div style="background:#0B1D34;color:#eaf1fb;border-radius:10px;padding:11px 13px;margin:10px 0 4px;font-size:13px;line-height:1.55">`
    + `<div style="font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:#D4AF37;margin-bottom:4px">Asset intelligence · ${esc(LENSES[activeLens].label)}</div>${esc(intel)}</div>`;

  // Financials: windowed spend, last-invested age, budget approved-vs-actual.
  const f = d.financials;
  if (f && f.spend) { const sp=f.spend.location||{};
    html += `<h3>Spending</h3>`;
    html += `<div class="kv"><b>Year to date</b><span>${money(sp.ytd)}</span></div>`;
    html += `<div class="kv"><b>Prior year</b><span>${money(sp.prior_year)}</span></div>`;
    html += `<div class="kv"><b>Last 3 years</b><span>${money(sp.three_year)}</span></div>`;
    const ls = f.last_spend && f.last_spend.location_date;
    html += `<div class="kv"><b>Last invested</b><span>${ls?esc(ls)+' · '+esc(ageLabel(f.age_bucket)):'no recorded spend'}</span></div>`;
    if (f.budget && f.budget.approved_cents) {
      html += `<h3>Budget · approved vs actual</h3>`;
      html += `<div class="kv"><b>Approved by board</b><span>${money(f.budget.approved_cents)}</span></div>`;
      html += `<div class="kv"><b>Actual invoiced</b><span>${money(f.budget.actual_cents)}</span></div>`;
      html += `<div class="kv"><b>Remaining approved</b><span>${money(f.budget.remaining_cents)}</span></div>`;
      html += `<div class="kv"><b>Status</b><span>${esc(budgetLabel(f.budget.status))}</span></div>`;
    }
  }

  if (d.children && d.children.length) { html+=`<h3>Systems / child assets</h3>`;
    d.children.forEach(c=> html+=`<div class="child" onclick="openDetail('${c.id}')">${esc(c.name)} <span class="muted">· ${esc(c.asset_type)} · ${esc(c.condition||'')}</span></div>`); }

  if (proj.length) { html+=`<h3>Projects &amp; work</h3>`;
    proj.forEach(p=>{ html+=`<div class="proj"><b>${esc(p.title)}</b><div class="muted">${esc(p.stage.replace(/_/g,' '))} · ${esc(p.vendor_name||'—')}</div>`;
      html+=`<div class="kv"><b>Approved</b><span>${money(p.approved_cents)}</span></div>`;
      html+=`<div class="kv"><b>Actual (invoiced)</b><span>${money(p.actual_cents)}</span></div>`;
      html+=`<div class="kv"><b>Remaining</b><span>${money(p.remaining_cents)}</span></div>`;
      if (p.started_at) html+=`<div class="kv"><b>Started</b><span>${esc(p.started_at)}</span></div>`;
      if (p.target_date) html+=`<div class="kv"><b>Target</b><span>${esc(p.target_date)}</span></div>`;
      if (p.completed_at) html+=`<div class="kv"><b>Completed</b><span>${esc(p.completed_at)}</span></div>`;
      if (p.percent_complete!=null) html+=`<div class="bar"><i style="width:${p.percent_complete}%"></i></div><div class="muted">${p.percent_complete}% complete</div>`;
      html+=`</div>`; });
  }
  if (d.spend_breakdown && d.spend_breakdown.by_gl && Object.keys(d.spend_breakdown.by_gl).length) { html+=`<h3>Where it hit the GL</h3>`;
    Object.entries(d.spend_breakdown.by_gl).sort((x,y)=>y[1]-x[1]).forEach(([gid,amt])=>{ const lab=(d.spend_breakdown.gl_labels||{})[gid]||{};
      html+=`<div class="kv"><b>${esc(((lab.number||'')+' '+(lab.name||'GL account')).trim())}</b><span>${money(amt)}</span></div>`; }); }
  if (d.board_motions && d.board_motions.length) { html+=`<h3>Board decisions</h3>`;
    d.board_motions.forEach(m=> html+=`<div class="kv"><b>${esc(m.title)}</b><span>${esc(m.status)}</span></div>`); }
  if (d.project_events && d.project_events.length) { html+=`<h3>History</h3>`;
    d.project_events.slice(0,8).forEach(e=> html+=`<div class="muted">${esc((e.created_at||'').slice(0,10))} — ${esc(e.note||e.event_type)}</div>`); }
  // Field photos — visual evidence history for this physical asset (newest first).
  const photos = (d.reports||[]).filter(r=>r.has_photo && r.photo_url);
  if (photos.length) { const latest=photos[0];
    html += `<h3>Field photos</h3>`;
    html += `<div class="photocard"><img class="photo" src="${esc(latest.photo_url)}" onclick="openGallery()" alt="Latest field photo">`;
    html += `<div class="pmeta">${latest.photo_type?`<span class="ptype">${esc(latest.photo_type.replace(/_/g,' '))}</span>`:''}${esc((latest.created_at||'').slice(0,10))} · ${esc(latest.reported_by_name||'')}${latest.caption?`<br>${esc(latest.caption)}`:''}${latest.project_title?`<br><i>${esc(latest.project_title)}</i>`:''}</div></div>`;
    if (photos.length>1) html += `<button class="btn ghost" onclick="openGallery()">View ${photos.length} photos</button>`;
  }
  // Add a photo — reuses the existing asset report/upload endpoint. Camera on
  // mobile (capture=environment), file upload on desktop.
  const activeProj = (d.projects||[]).find(p=>['approved','contract_signed','work_started'].includes(p.stage));
  html += `<h3>Add a photo</h3>
    <div class="muted" style="margin-bottom:6px">Tied to ${esc(a.name)}${activeProj?` · ${esc(activeProj.title)}`:''}.</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
      <select id="phType"><option value="field_update">Field update</option><option value="before">Before</option><option value="progress">Progress</option><option value="after">After</option><option value="inspection">Inspection</option><option value="issue">Issue</option></select>
      <input type="text" id="phCap" placeholder="Optional note" style="flex:1;min-width:120px">
    </div>
    <div style="display:flex;gap:8px;margin-top:6px;align-items:center">
      <input type="file" id="phFile" accept="image/*" capture="environment">
      <button class="btn" onclick="addPhoto('${id}','${activeProj?activeProj.id:''}')">📷 Add Photo</button>
    </div><div id="phMsg" class="muted"></div>`;

  html+=`<h3>Message management</h3>
    <div class="muted" style="margin-bottom:6px">This message is tied to ${esc(a.name)} — no need to describe which one.</div>
    <textarea id="rptText" rows="3" placeholder="e.g. The landscaping on the west side looked thin this morning. Can someone inspect it?"></textarea>
    <div style="margin-top:6px;display:flex;gap:8px;align-items:center;">
      <input type="file" id="rptPhoto" accept="image/*" />
      <button class="btn" onclick="submitReport('${id}')">Send to management</button>
    </div><div id="rptMsg" class="muted"></div>`;
  document.getElementById('sideInner').innerHTML=html;
  document.getElementById('side').classList.add('open');
}
function closeSide(){ document.getElementById('side').classList.remove('open'); selectedId=null; drawAssets(); }
async function submitReport(id){
  const text=document.getElementById('rptText').value.trim();
  const file=document.getElementById('rptPhoto').files[0];
  if(!text && !file){ document.getElementById('rptMsg').textContent='Add a note or photo.'; return; }
  const fd=new FormData(); fd.append('description',text); if(file) fd.append('photo',file);
  const r=await cmFetch('/api/community-map/asset/'+id+'/report',{method:'POST',body:fd});
  document.getElementById('rptMsg').textContent = r.ok ? 'Sent to management. It is now part of this asset’s record.' : 'Failed ('+r.status+').';
  if(r.ok){ document.getElementById('rptText').value=''; }
}
// Add a field photo — reuses the existing asset report/upload endpoint (multer ->
// 'documents' bucket -> board_map_reports). Photo type rides the caption tag
// convention ("PROGRESS · note"); project association uses related_project_id.
async function addPhoto(id, projectId){
  const msg=document.getElementById('phMsg');
  const file=document.getElementById('phFile').files[0];
  if(!file){ msg.textContent='Choose or take a photo first.'; return; }
  const type=document.getElementById('phType').value;
  const cap=(document.getElementById('phCap').value||'').trim();
  const label=({field_update:'FIELD_UPDATE',before:'BEFORE',progress:'PROGRESS',after:'AFTER',inspection:'INSPECTION',issue:'ISSUE'})[type]||'FIELD_UPDATE';
  const fd=new FormData(); fd.append('photo',file); fd.append('description', label+' · '+(cap||label.toLowerCase().replace(/_/g,' '))); if(projectId) fd.append('related_project_id', projectId);
  msg.textContent='Uploading…';
  const r=await cmFetch('/api/community-map/asset/'+id+'/report',{method:'POST',body:fd});
  msg.textContent = r.ok ? 'Photo added to this asset.' : 'Failed ('+r.status+').';
  if(r.ok) openDetail(id);
}
function openGallery(){ const d=_lastDetail; if(!d) return; const a=d.asset||{};
  const photos=(d.reports||[]).filter(r=>r.has_photo && r.photo_url);
  let g=document.getElementById('gallery'); if(!g){ g=document.createElement('div'); g.id='gallery'; document.body.appendChild(g); }
  g.innerHTML=`<div class="gwrap"><div class="ghead"><b>${esc(a.name||'Asset')}</b> · field photo history<span class="gclose" onclick="closeGallery()">✕</span></div><div class="ggrid">`
    + photos.map(p=>`<div class="gitem"><img src="${esc(p.photo_url)}" alt=""><div class="gcap">${p.photo_type?`<span class="ptype">${esc(p.photo_type.replace(/_/g,' '))}</span>`:''}${esc((p.created_at||'').slice(0,10))}${p.project_title?` · ${esc(p.project_title)}`:''}${p.caption?`<br>${esc(p.caption)}`:''}<br><span class="muted">${esc(p.reported_by_name||'')}</span></div></div>`).join('')
    + `</div></div>`;
  g.style.display='flex';
}
function closeGallery(){ const g=document.getElementById('gallery'); if(g) g.style.display='none'; }

// ---- staff geometry editor: click to place point / draw line / draw polygon ----
let editMode=null, editPts=[], editLayer=null;
if (STAFF) {
  document.getElementById('editToggle').onclick=()=>{ const t=document.getElementById('editTools'); t.style.display = t.style.display==='none'?'':'none'; };
  document.getElementById('editCancel').onclick=cancelEdit;
  document.querySelectorAll('#editTools button[data-g]').forEach(b=> b.onclick=()=>startEdit(b.dataset.g));
  document.getElementById('editSave').onclick=saveEdit;
  map.on('click', e=>{ if(!editMode) return; editPts.push([e.latlng.lng, e.latlng.lat]); redrawEdit(); });
}
function startEdit(kind){ if(!selectedId){ document.getElementById('editHint').textContent='Select an asset first (click it).'; return; }
  editMode=kind; editPts=[]; document.getElementById('editSave').style.display=''; document.getElementById('editHint').textContent='Click on the map to '+(kind==='point'?'place the point.':'add vertices; Save when done.'); redrawEdit(); }
function redrawEdit(){ if(editLayer) map.removeLayer(editLayer); if(!editPts.length) return;
  const ll=editPts.map(p=>[p[1],p[0]]);
  editLayer = editMode==='point' ? L.circleMarker(ll[ll.length-1],{radius:8,color:'#D4AF37',fillColor:'#D4AF37',fillOpacity:1})
    : editMode==='line' ? L.polyline(ll,{color:'#D4AF37',weight:4})
    : L.polygon(ll,{color:'#D4AF37',weight:2,fillOpacity:.25});
  editLayer.addTo(map); }
function cancelEdit(){ editMode=null; editPts=[]; if(editLayer){map.removeLayer(editLayer);editLayer=null;} document.getElementById('editSave').style.display='none'; document.getElementById('editHint').textContent='Select an asset, choose a shape, click on the map.'; }
async function saveEdit(){ if(!selectedId||!editPts.length) return;
  let wkt;
  if(editMode==='point'){ const p=editPts[editPts.length-1]; wkt=`POINT(${p[0]} ${p[1]})`; }
  else if(editMode==='line'){ wkt=`LINESTRING(${editPts.map(p=>p[0]+' '+p[1]).join(',')})`; }
  else { const r=editPts.slice(); if(r.length&&(r[0][0]!==r[r.length-1][0]||r[0][1]!==r[r.length-1][1])) r.push(r[0]); wkt=`POLYGON((${r.map(p=>p[0]+' '+p[1]).join(',')}))`; }
  const res=await cmFetch('/api/community-map/asset/'+selectedId+'/geometry',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({wkt})});
  document.getElementById('editHint').textContent = res.ok ? 'Saved. Reloading…' : 'Save failed ('+res.status+').';
  if(res.ok){ cancelEdit(); await loadAssets(); }   // reload from DB → prove round-trip render
}
initAuth().then(loadAssets);
</script>
