<!DOCTYPE html>
<html lang="en">

<!-- Installable app: "Add to Home Screen" gives Tessa her own icon + full-screen app. (Ed 2026-08-01) -->
<link rel="manifest" href="/tessa.webmanifest">
<meta name="theme-color" content="#0B1D34">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
  :root { --navy:#0B1D34; --gold:#D4AF37; --ink:#1a2230; --muted:#5a7390; --line:#e2e8f0; --bg:#f5f7fa; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; color:var(--ink); background:var(--bg); }
  .wrap { max-width:1080px; margin:0 auto; padding:20px 18px 70px; }
  a.back { display:inline-flex; gap:6px; color:#5a7390; text-decoration:none; font-size:13px; font-weight:600; margin-bottom:12px; }
  h1 { margin:0; color:var(--navy); font-size:22px; }
  .sub { color:var(--muted); font-size:12.5px; margin:4px 0 16px; }
  .grid { display:grid; grid-template-columns:1.3fr 1fr; gap:18px; align-items:start; }
  @media (max-width:820px){ .grid { grid-template-columns:1fr; } }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  h2 { color:var(--navy); font-size:15px; margin:0 0 10px; }
  label { display:block; font-size:12px; color:var(--muted); font-weight:600; margin:10px 0 4px; }
  textarea, input, select { width:100%; padding:8px 10px; font-size:13.5px; border:1px solid var(--line); border-radius:7px; font-family:inherit; }
  textarea { resize:vertical; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .btn { border:none; border-radius:7px; padding:9px 16px; font-size:13.5px; font-weight:600; cursor:pointer; background:var(--navy); color:#fff; }
  .btn.gold { background:var(--gold); color:var(--navy); }
  .btn.ghost { background:#fff; color:var(--navy); border:1px solid var(--line); }
  .btn.sm { padding:4px 10px; font-size:12px; }
  .btn:disabled { opacity:.5; cursor:default; }
  .modewrap { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .modewrap button { border:none; background:#fff; padding:7px 14px; font-size:12.5px; cursor:pointer; color:var(--muted); }
  .modewrap button.on { background:var(--navy); color:#fff; }
  .note { font-size:11.5px; color:var(--muted); margin-top:6px; }
  .fu { border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:8px; }
  .fu .t { font-weight:600; font-size:13.5px; color:var(--ink); }
  .pill { display:inline-block; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; padding:2px 7px; border-radius:20px; background:#eef2f7; color:#475569; }
  .p-waiting{background:#fef3c7;color:#92400e;} .p-open{background:#dbeafe;color:#1e40af;}
  .result { font-size:13px; margin-top:8px; }
  .ok { color:#166534; } .err { color:#991b1b; }
  .soon { text-align:center; padding:70px 20px; color:var(--muted); } .soon b { display:block; color:var(--navy); font-size:18px; margin-bottom:6px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
let _supa=null, af=null, _mode='tessa';  // default: send as Tessa, on Ed's behalf
let _draftMode=null;                      // the voice the current draft was written in
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
function showComingSoon(){ $('body').innerHTML='<div class="soon"><b>Owner only</b>Tessa is Ed’s assistant.</div>'; }
function goSignIn(){ try{ sessionStorage.setItem('postLoginRedirect','/admin/tessa'); }catch(_){}; location.href='/login.html'; }

function render(){
  $('body').innerHTML = `<div class="grid">
    <div>
      <!-- Ask Tessa: one box. Ed says what he wants in his own words and she
           works out who it goes to, reads the thread in his mailbox, and

      <div class="card" style="border:2px solid var(--gold,#D4AF37);">
        <h2 style="margin-top:0;">Ask Tessa</h2>
        <div class="note" style="margin-bottom:8px;">Say it the way you'd say it out loud. She'll work out who it goes to and pull up the thread.</div>
        <textarea id="ask" rows="3" placeholder="e.g. Tessa please email the Canyon Gate board and ask if they want a follow-up virtual meeting with the security company, the one with Grant"></textarea>
        <div class="row" style="margin-top:10px;">
          <button class="btn gold" id="askBtn" onclick="askTessa()">Do it</button>
          <button class="btn ghost" id="askMicBtn" onclick="toggleMic('ask')">🎙 Dictate</button>
          <span id="askMsg" class="note"></span>
        </div>
        <div id="askOut"></div>
      </div>
      <div class="card">
        <h2>Draft an email</h2>
        <!-- No "send as me" switch. Tessa always writes as herself and says Ed
             asked her to, per his 2026-08-20 rule. The toggle used to sit here
             offering a mode the server refuses. -->
        <div class="note" style="margin-bottom:6px;">Goes out from Tessa, on your behalf.</div>
        <label>Pick a recipient <span class="note" style="font-weight:400;">(pick several to build the list — each pick adds to the field you choose)</span></label>
        <div class="row" style="gap:8px; align-items:center;">
          <select id="rpick" onchange="pickRecipient()" style="flex:1;"><option value="">— loading directory&hellip; —</option></select>
          <div class="modewrap" style="white-space:nowrap;"><button type="button" id="tgt-to" class="on" onclick="setPickTarget('to')">To</button><button type="button" id="tgt-cc" onclick="setPickTarget('cc')">Cc</button></div>
        </div>
        <label>Search my contacts <span class="note" style="font-weight:400;">(bank, attorney, insurance, vendor reps &mdash; e.g. &ldquo;Melody&rdquo; or &ldquo;New First&rdquo;)</span></label>
        <div style="position:relative;">
          <input id="csearch" placeholder="Type a name or company…" autocomplete="off" oninput="contactSearch()">
          <div id="cresults" style="display:none; position:absolute; z-index:30; left:0; right:0; background:#fff; border:1px solid #cbd5e1; border-radius:0 0 8px 8px; max-height:250px; overflow:auto; box-shadow:0 10px 28px rgba(11,29,52,.15);"></div>
        </div>
        <label>To</label><input id="to" placeholder="name@example.com">
        <label>Cc <span class="note" style="font-weight:400;">(optional)</span></label><input id="cc" placeholder="name@example.com, another@example.com">
        <label>Recipient name (optional, helps the greeting)</label><input id="rname" placeholder="e.g. Karla at DRB">
        <label>Your thought <span class="note" style="font-weight:400;">(type it, or tap the mic and talk)</span></label>
        <textarea id="thought" rows="4" placeholder="e.g. Ask the bank for the June statement for the Waterview operating account, we need it for the rec"></textarea>
        <div class="row" style="margin-top:10px;">
          <button class="btn" id="draftBtn" onclick="doDraft()">Draft it</button>
          <button class="btn ghost" id="micBtn" onclick="toggleMic()">🎙 Dictate</button>
          <span id="draftMsg" class="note"></span>
        </div>
        <div id="voiceMsg" class="result"></div>
        <div id="voiceTasks"></div>
        <div id="draftArea"></div>
      </div>
      <div class="card">
        <div class="row" style="justify-content:space-between;">
          <h2 style="margin:0;">Forwarded to Tessa</h2>
          <div class="row" style="gap:6px;">
            <div class="modewrap"><button id="ibtab-review" class="on" onclick="ibSetStatus('needs_review')">Needs review</button><button id="ibtab-all" onclick="ibSetStatus('all')">All</button></div>
            <button class="btn ghost sm" id="pollBtn" onclick="pollInbox()">Check for new</button>
          </div>
        </div>
        <div class="note">Forward or BCC any email to <b>tessa@bedrocktx.com</b>. She drafts a reply here for you to review, edit, and send, as you or as Tessa.</div>
        <div id="pollMsg" class="result"></div>
        <div id="inboxList" style="margin-top:10px;"><div class="note">Loading&hellip;</div></div>
      </div>
      <div class="card">
        <div class="row" style="justify-content:space-between;">
          <h2 style="margin:0;">Sent by Tessa</h2>
          <button class="btn ghost sm" onclick="loadSent()">Refresh</button>
        </div>
        <div class="note">Emails Tessa has sent — as you, or on your behalf.</div>
        <div id="sentList" style="margin-top:10px;"><div class="note">Loading&hellip;</div></div>
      </div>
    </div>
    <div>
      <div class="card">
        <div class="row" style="justify-content:space-between;"><h2 style="margin:0;">Follow-ups</h2><button class="btn ghost sm" onclick="toggleAddFu()">+ Add</button></div>
        <div id="fuAdd" style="display:none; margin-top:10px;">

          <div class="row" style="margin-top:6px;">
            <select id="fu-cat" style="flex:1;"><option value="admin">Admin</option><option value="banking">Banking</option><option value="vendor">Vendor</option><option value="personal">Personal</option><option value="other">Other</option></select>
            <input id="fu-due" type="date" style="flex:1;">
          </div>

          <button class="btn gold sm" style="margin-top:8px;" onclick="addFu()">Add follow-up</button>

        <div id="fuList" style="margin-top:10px;"><div class="note">Loading&hellip;</div></div>
      </div>
      <div class="card" style="margin-top:14px;">
        <div class="row" style="justify-content:space-between;"><h2 style="margin:0;">My contacts</h2><button class="btn ghost sm" onclick="cbToggleAdd()">+ Add</button></div>
        <div class="note">Names, orgs, titles &amp; emails Tessa uses to send for you.</div>
        <input id="cb-search" placeholder="Search contacts…" oninput="cbLoad()" style="margin-top:8px;">
        <div id="cbAdd" style="display:none; margin-top:10px; padding:10px; background:#f6f9ff; border:1px solid #d7e3f4; border-radius:8px;"></div>
        <div id="cbList" style="margin-top:10px;"><div class="note">Loading&hellip;</div></div>
      </div>
      <div class="card" style="margin-top:14px;">
        <div class="row" style="justify-content:space-between;"><h2 style="margin:0;">Standing instructions</h2><button class="btn ghost sm" onclick="stToggleAdd()">+ Add</button></div>
        <div class="note">Recurring emails Tessa sends on schedule, without being re-asked.</div>
        <div id="stAdd" style="display:none; margin-top:10px; padding:10px; background:#f6f9ff; border:1px solid #d7e3f4; border-radius:8px;"></div>
        <div id="stList" style="margin-top:10px;"><div class="note">Loading&hellip;</div></div>
      </div>
    </div>
  </div>`;
  loadFu();
  loadInbox();
  loadSent();
  loadRecipients();
  cbLoad();
  stLoad();
}

// Recipient directory for the compose picker: board members (by community),
// Bedrock staff, and the AI team. One pick fills To + the greeting name. All
// groups sorted A–Z by label (house rule). Best-effort — a failed source just
// leaves that group out; the free-text To always works.
let _rpickName = {}; // email -> display name, so a pick fills the greeting
let _allStaffEmails = []; // for the company-wide "All Bedrock team" pick
let _boardGroups = {};    // community -> [emails], for the per-community "whole board" pick
async function loadRecipients(){
  const sel = $('rpick'); if(!sel) return;
  // AI team mirrors lib/email/graph_send.js persona mailboxes.
  const AI = [
    ['Amanda Albright','amanda@bedrocktx.com','senior community manager'],
    ['Annie Reeves','annie@bedrocktx.com','ACC / ARC'],
    ['Claire','claire@bedrocktx.com','front office'],
    ['Emma Brooks','emma@bedrocktx.com','accounts payable'],
    ['Kat Reed','kat@bedrocktx.com','accounting'],
    ['Miranda Pierce','miranda@bedrocktx.com','compliance / DRV'],
    ['Paige Chandler','paige@bedrocktx.com','board operations'],
    ['Reese Calloway','reese@bedrocktx.com','resale / estoppels'],
  ];
  let staff=[], board=[];
  try { const r=await af('/api/users'); const j=await r.json(); const l=Array.isArray(j)?j:(j.users||[]); staff=l.filter(u=>u&&u.email&&(u.is_active===undefined||u.is_active)); } catch(_){}
  try { const r=await af('/api/board-members'); const j=await r.json(); board=(j.members||[]).filter(m=>m&&m.email); } catch(_){}
  const opt=(v,label)=>`<option value="${esc(v)}">${esc(label)}</option>`;
  _rpickName = {};
  _boardGroups = {};
  _allStaffEmails = staff.map(u=>u.email).filter(Boolean);
  let html = '<option value="">— pick a board member, staff, or AI teammate —</option>';
  // Company-wide: one pick to email the whole Bedrock team (Tessa sends on Ed's
  // behalf). Real staff only — not the AI mailboxes (those route into queues).
  if(_allStaffEmails.length){
    html += `<optgroup label="Company-wide"><option value="__all_staff__">👥 All Bedrock team (${_allStaffEmails.length})</option></optgroup>`;
  }
  // Board, grouped by community, each group A–Z.
  if(board.length){
    const byC={};
    for(const m of board){ const c=m.community_name||'Board'; (byC[c]=byC[c]||[]).push(m); }
    for(const [comm, mem] of Object.entries(byC).sort((a,b)=>a[0].localeCompare(b[0]))){
      html += `<optgroup label="Board — ${esc(comm)}">`;
      // One pick to email the whole board of this community (fans out below).
      const bEmails = mem.map(m=>m.email).filter(Boolean);
      _boardGroups[comm] = bEmails;
      if(bEmails.length > 1){
        html += `<option value="__board__::${esc(comm)}">👥 All ${esc(comm)} board (${bEmails.length})</option>`;
      }
      for(const m of mem.sort((a,b)=>String(a.name||a.full_name||a.email).localeCompare(String(b.name||b.full_name||b.email)))){
        const nm = m.name || m.full_name || m.email;
        const title = m.position || m.role || '';
        _rpickName[m.email]=nm;
        html += opt(m.email, `${nm}${title?' ('+title+')':''}`);
      }
      html += '</optgroup>';
    }
  }
  if(staff.length){
    html += '<optgroup label="Bedrock staff">';
    for(const u of staff.slice().sort((a,b)=>String(a.full_name||a.email).localeCompare(String(b.full_name||b.email)))){
      _rpickName[u.email]=u.full_name||u.email;
      html += opt(u.email, `${u.full_name||u.email}${u.role?' ('+u.role+')':''}`);
    }
    html += '</optgroup>';
  }
  html += '<optgroup label="AI team">';
  for(const [nm,em,role] of AI){ _rpickName[em]=nm; html += opt(em, `${nm} — ${role}`); }
  html += '</optgroup>';
  sel.innerHTML = html;
}
// Which field a pick lands in — To or Cc. Lets Ed build a To list AND a Cc
// list from the same directory without retyping addresses. (Ed 2026-08-25.)
let _pickTarget='to';
function setPickTarget(t){
  _pickTarget = (t==='cc') ? 'cc' : 'to';
  const to=$('tgt-to'), cc=$('tgt-cc');
  if(to) to.classList.toggle('on', _pickTarget==='to');
  if(cc) cc.classList.toggle('on', _pickTarget==='cc');
}
// Append addresses to a field, de-duping against what's already there (case-
// insensitive) so picking the same person or an overlapping board twice can't
// double them up. Picks ADD; they never wipe what you've already built.
function _addAddrs(field, emails){
  const el=$(field); if(!el) return;
  const have=new Set(String(el.value||'').split(/[,;]/).map(s=>s.trim().toLowerCase()).filter(Boolean));
  const add=[];
  for(const e of (emails||[])){ const raw=String(e||'').trim(); const k=raw.toLowerCase(); if(raw && !have.has(k)){ have.add(k); add.push(raw); } }
  if(!add.length) return;
  const cur=String(el.value||'').replace(/[,;\s]+$/,'').trim();
  el.value = cur ? cur+', '+add.join(', ') : add.join(', ');
}
function pickRecipient(){
  const v=$('rpick').value; if(!v) return;
  let emails, greet;
  if(v==='__all_staff__'){ emails=_allStaffEmails; greet='team'; }
  else if(v.startsWith('__board__::')){ emails=_boardGroups[v.slice('__board__::'.length)]||[]; greet='everyone'; }
  else { emails=[v]; greet=_rpickName[v]||''; }
  _addAddrs(_pickTarget, emails);
  // Greeting only tracks the To line, and only if it's still blank.
  if(_pickTarget==='to' && greet && $('rname') && !$('rname').value.trim()) $('rname').value=greet;
  // Reset the dropdown so the same entry can be picked again and it reads as an
  // additive control, not a one-shot selection.
  $('rpick').value='';
}

// ---- Contact loop: search Tessa's address book (bank / attorney / vendors),
// resolve one into To, "read it back", or save a new one. (Ed 2026-08-01.) ----
let _cTimer=null, _contacts=[];
function contactSearch(){
  clearTimeout(_cTimer);
  _cTimer=setTimeout(async()=>{
    const q=($('csearch').value||'').trim(); const box=$('cresults'); if(!box) return;
    if(q.length<2){ box.style.display='none'; box.innerHTML=''; return; }
    box.style.display='block'; box.innerHTML='<div class="note" style="padding:8px 10px;">Searching…</div>';
    try{
      const r=await af('/api/tessa/contacts?q='+encodeURIComponent(q)); const j=await r.json();
      _contacts=j.contacts||[];
      let h=_contacts.map((c,i)=>`<div onclick="pickContact(${i})" style="padding:8px 10px; border-bottom:1px solid #eef2f7; cursor:pointer;" onmouseover="this.style.background='#f5f8fc'" onmouseout="this.style.background='#fff'">
        <div style="font-weight:600; color:#0B1D34; font-size:13.5px;">${esc(c.name)}${c.org?` <span style="color:#64748b; font-weight:400;">· ${esc(c.org)}</span>`:''}</div>
        <div style="font-size:11.5px; color:#64748b;">${esc(c.email||'no email')}${c.role?' · '+esc(c.role):''}</div></div>`).join('');
      h+=`<div onclick="addContactPrompt()" style="padding:8px 10px; cursor:pointer; color:#0B1D34; font-weight:600; font-size:12.5px; background:#fbfcfe;">➕ Add &ldquo;${esc(q)}&rdquo; as a new contact</div>`;
      box.innerHTML=h;
    }catch(e){ box.innerHTML='<div class="note" style="padding:8px 10px;">Search failed.</div>'; }
  }, 220);
}
function pickContact(i){
  const c=_contacts[i]; if(!c) return;
  if(c.email) _addAddrs(_pickTarget, [c.email]);
  if(_pickTarget==='to' && $('rname') && !$('rname').value.trim()) $('rname').value=c.name+(c.org?(' at '+c.org):'');
  $('csearch').value='';   // clear so the next person can be searched
  $('cresults').style.display='none';
  const where=_pickTarget==='cc'?'Cc':'To';
  const dm=$('draftMsg'); if(dm){ dm.style.color='#166534'; dm.innerHTML='✓ Added to '+where+': <b>'+esc(c.email||c.name)+'</b> — search another, or write your thought and draft it.'; }
}
async function addContactPrompt(){
  const q=($('csearch').value||'').trim();
  const name=prompt('Contact name:', q); if(!name) return;
  const organization=prompt('Company / organization (optional):', '')||'';
  const email=prompt('Email:', ''); if(email===null) return;
  try{
    const r=await af('/api/tessa/contacts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name, organization, email:(email||'').trim()})});
    const j=await r.json();
    if(!r.ok||!j.ok){ alert('Could not save: '+(j.detail||j.error||'error')); return; }
    if(j.contact.email) _addAddrs(_pickTarget, [j.contact.email]);
    if(_pickTarget==='to' && $('rname') && !$('rname').value.trim()) $('rname').value=name+(organization?(' at '+organization):'');
    $('csearch').value=''; $('cresults').style.display='none';
    const where=_pickTarget==='cc'?'Cc':'To';
    const dm=$('draftMsg'); if(dm){ dm.style.color='#166534'; dm.textContent='✓ Saved'+(j.contact.email?' & added to '+where+': '+j.contact.email:'')+'. She’ll resolve this name next time.'; }
  }catch(e){ alert('Could not save the contact.'); }
}
document.addEventListener('click',(e)=>{ const b=$('cresults'); if(b && b.style.display!=='none' && e.target.id!=='csearch' && !e.target.closest('#cresults')) b.style.display='none'; });

// ---- My contacts: a real managed address book Tessa sends from. (Ed 2026-08-01)
let _cbList=[];
async function cbLoad(){
  const q=(($('cb-search')||{}).value||'').trim(); const el=$('cbList'); if(!el) return;
  try{
    const r=await af('/api/tessa/contacts/book'+(q?'?q='+encodeURIComponent(q):'')); const j=await r.json();
    _cbList=j.contacts||[];
    if(!_cbList.length){ el.innerHTML='<div class="note">'+(q?'No contacts match.':'No contacts yet — add one above, or use “➕ Add” from the compose search.')+'</div>'; return; }
    el.innerHTML=_cbList.map(c=>`<div style="padding:8px 0; border-bottom:1px solid #eef2f7;">
      <div class="row" style="justify-content:space-between; gap:8px; align-items:flex-start;">

function ibMode(id){ _ibmode[id]='tessa'; }   // voice is no longer switchable
// Who this reply reaches, said out loud.
//
// Ed 2026-08-21: "how do i know tessa is replying to all or just sender?" He
// could not. The old markup was one unlabelled address box with the sender's
// address prefilled, no Cc field, and nothing about who was being left off.
// Underneath, the send was ALWAYS sender-only.
//
// On the Canyon Gate thread that means four directors and the manager never see
// the answer. The board uses role aliases specifically so the association keeps
// a continuous record of its own correspondence; a reply that reaches one alias
// puts a hole in exactly the record those aliases exist to protect.
//
// Server-side truth: /inbox computes both options so the label and the actual
// send cannot drift apart.
function ibRecipientPicker(it){
  const all = it.reply_to_all;
  const known = it.reply_recipients_known !== false;
  _ibreply[it.id] = 'sender';

  // Rows polled before the recipient lists were stored. Unknown is not the same
  // as "nobody else", and saying "sender only" without that caveat would be a
  // confident lie.
  if(!known){
    return `<label>Reply goes to</label>
      <input id="ib-to-${it.id}" value="${esc(it.from_email||'')}">
      <div class="note" style="font-size:11.5px;margin-top:3px;color:#92400e;">
        Sender only. This message came in before Tessa started recording who else
        was on the thread, so she cannot offer reply-all here. Add addresses above
        if others need it.
      </div>
      <input type="hidden" id="ib-cc-${it.id}" value="">`;
  }

  if(!all){
    return `<label>Reply goes to</label>
      <input id="ib-to-${it.id}" value="${esc(it.from_email||'')}">
      <div class="note" style="font-size:11.5px;margin-top:3px;">${esc(it.reply_sender_label||'Goes to the sender')}</div>
      <input type="hidden" id="ib-cc-${it.id}" value="">`;
  }

  return `<label>Reply goes to</label>
    <div class="modewrap" style="margin:2px 0 6px;">
      <button type="button" id="ibr-sender-${it.id}" class="on" onclick="ibSetReply('${it.id}','sender')">Sender only</button>
      <button type="button" id="ibr-all-${it.id}" onclick="ibSetReply('${it.id}','all')">Reply all (${all.to.length + all.cc.length})</button>
    </div>
    <input id="ib-to-${it.id}" value="${esc(it.from_email||'')}">
    <input id="ib-cc-${it.id}" placeholder="Cc" value="" style="margin-top:5px;">
    <div class="note" id="ib-rlabel-${it.id}" style="font-size:11.5px;margin-top:3px;">${esc(it.reply_sender_label||'')}</div>`;
}

const _ibreply = {};
const _ibitems = {};
function ibSetReply(id, mode){
  const it = _ibitems[id]; if(!it) return;
  _ibreply[id] = mode;
  const s = document.getElementById('ibr-sender-'+id), a = document.getElementById('ibr-all-'+id);
  if(s) s.className = mode==='sender' ? 'on' : '';
  if(a) a.className = mode==='all' ? 'on' : '';
  const to = document.getElementById('ib-to-'+id), cc = document.getElementById('ib-cc-'+id);
  const lbl = document.getElementById('ib-rlabel-'+id);
  if(mode==='all' && it.reply_to_all){
    if(to) to.value = it.reply_to_all.to.join(', ');
    if(cc) cc.value = it.reply_to_all.cc.join(', ');
    if(lbl) lbl.textContent = it.reply_all_label || '';
  } else {
    if(to) to.value = it.from_email || '';
    if(cc) cc.value = '';
    if(lbl) lbl.textContent = it.reply_sender_label || '';
  }
}

// "Write it": Ed's rough thoughts -> Tessa's send-ready reply or forward.
async function ibHandle(id){
  const instruction=(($('ib-instr-'+id)||{}).value||'').trim();
  const msg=$('ibmsg-'+id); const hb=document.querySelector('#ib-'+id+' .btn.sm');
  if(hb){ hb.disabled=true; }
  msg.innerHTML='<span class="note">Tessa’s working on it…</span>';
  try{
    const r=await af('/api/tessa/inbox/'+id+'/handle',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({instruction, mode:_ibmode[id]})});
    const j=await r.json(); if(!r.ok||!j.ok) throw new Error(j.detail||j.error||'could not handle');
    if(j.mode) ibMode(id, j.mode);
    $('ib-subj-'+id).value=j.subject||$('ib-subj-'+id).value;
    $('ib-body-'+id).value=j.body||'';
    const sendBtn=$('ibsend-'+id);
    if(j.action==='forward'){
      if(sendBtn) sendBtn.textContent='Send forward';
      if(j.to){ $('ib-to-'+id).value=j.to; msg.innerHTML='<span class="ok">↪ Drafted a forward to <b>'+esc(j.to)+'</b>. Review and send.</span>'; }
      else { msg.innerHTML='<span class="err">Drafted a forward, but I couldn’t find “'+esc(j.recipient_hint||'')+'” in your contacts — type their email above in “Reply / forward to”.</span>'; }
    } else {
      if(sendBtn) sendBtn.textContent='Send reply';
      msg.innerHTML='<span class="ok">✉️ Drafted a reply. Review and send.</span>';
    }

    // "reply to all board" — she looked the board up and re-addressed it.
    //
    // Ed 2026-08-21: "i want to be able to give tessa command to reply to all
    // board." Works whether or not this thread's recipients were recorded,
    // because it comes from the roster, not from who happened to be copied.
    if(j.group && j.group.kind==='board'){
      if(j.group.resolved){
        $('ib-to-'+id).value=j.group.to.join(', ');
        const ccEl=document.getElementById('ib-cc-'+id); if(ccEl) ccEl.value='';
        const lbl=document.getElementById('ib-rlabel-'+id);
        const who=j.group.people.map(p=>esc(p.email)).join(', ');
        const note='Addressed to the <b>'+esc(j.group.community)+'</b> board ('
          +j.group.to.length+'), found from '+esc(j.group.how||'this thread')+'.'
          +(j.group.confident===false?' Worth a check — that was a passing mention, not the sender\'s address.':'');
        if(lbl) lbl.innerHTML=note;
        msg.innerHTML='<span class="ok">✉️ Drafted, addressed to the '+esc(j.group.community)+' board.</span>'
          +'<div class="note" style="font-size:11.5px;margin-top:3px;">'+who+'</div>';
      } else {
        // She could not tell which board. Ask rather than guess: mail at the
        // wrong association is worse than one more question.
        msg.innerHTML='<span class="err">'+esc(j.group.ask||'I could not work out which board you meant.')+'</span>';
      }
    }
  }catch(e){ msg.innerHTML='<span class="err">'+esc(e.message)+'</span>'; }
  finally{ if(hb) hb.disabled=false; }
}
async function ibSend(id){
  const to=$('ib-to-'+id).value.trim(); const msg=$('ibmsg-'+id);
  // The Cc box only exists when reply-all is available, so read it defensively.
  const ccEl=document.getElementById('ib-cc-'+id);
  const cc=ccEl?ccEl.value.trim():'';
  if(!to){ msg.innerHTML='<span class="err">Add a recipient to reply to.</span>'; return; }
  const btn=$('ibsend-'+id); btn.disabled=true; msg.innerHTML='<span class="note">Sending…</span>';
  try{
    // cc was never sent. The field did not exist and the server defaulted it to
    // empty, so every reply went to the sender alone whatever the thread looked
    // like. (Ed 2026-08-21: "how do i know tessa is replying to all or just
    // sender?")
    const r=await af('/api/tessa/inbox/'+id+'/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to, cc, subject:$('ib-subj-'+id).value, body:$('ib-body-'+id).value, mode:_ibmode[id]})});
    const j=await r.json(); if(!r.ok) throw new Error(j.error||'send failed');
    // Name every address it actually reached. "Sent" on its own is what let a
    // sender-only reply pass for a reply-all in the first place.
    const went=[...(j.to||[]),...(j.cc||[])];
    const el=$('ib-'+id);
    if(el){ el.style.opacity='.5';
      el.innerHTML='<div class="ok">✅ Sent to '+esc(went.join(', '))+'</div>';
      setTimeout(loadInbox,2200); }
  }catch(e){ msg.innerHTML='<span class="err">'+esc(e.message)+'</span>'; btn.disabled=false; }
}
async function ibDismiss(id){
  await af('/api/tessa/inbox/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'dismissed'})});
  loadInbox();
}
// setMode() lived here. It flipped between "send as Ed" and "send as Tessa"
// and set className on #m-ed / #m-tessa. Both the buttons and the server-side
// mode are gone (Ed 2026-08-20: she never signs as him), so the function was
// left calling .className on null — the removing-a-DOM-element-without-
// grepping-for-its-id scar. Deleted rather than guarded: a guarded no-op is
// something a future caller re-enables by accident.

async function doDraft(){
  const thought=$('thought').value.trim(); if(!thought) return;
  const btn=$('draftBtn'); btn.disabled=true; $('draftMsg').textContent='Drafting…';
  try{
    const r=await af('/api/tessa/draft',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({thought, mode:_mode, recipient_name:$('rname').value.trim()||null})});
    const j=await r.json(); if(!r.ok) throw new Error(j.error||'draft failed');
    $('draftMsg').textContent='';
    _draftMode = j.mode || _mode;   // the voice this draft was written in
    showEmailDraft(j.subject, j.body);
  }catch(e){ $('draftMsg').innerHTML='<span class="err">'+esc(e.message)+'</span>'; }
  finally{ btn.disabled=false; }
}
function showEmailDraft(subject, body){
  $('draftArea').innerHTML=`<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px;">
    <label>Subject</label><input id="d-subj" value="${esc(subject)}">
    <label>Body</label><textarea id="d-body" rows="10">${esc(body)}</textarea>
    <label style="display:flex;gap:7px;align-items:center;font-weight:400;color:var(--ink);margin-top:10px;"><input type="checkbox" id="d-fu"> Track a follow-up on this</label>
    <div class="row" style="margin-top:10px;"><button class="btn gold" id="sendBtn" onclick="doSend()">Send as Tessa</button><span id="sendMsg" class="result"></span></div>
  </div>`;
}

// ---- Voice dictation --------------------------------------------------------
let _rec=null, _chunks=[], _recording=false;
let _micMode='draft';   // 'draft' fills the thought box, 'ask' fills Ask Tessa
async function toggleMic(mode){
  _micMode = mode === 'ask' ? 'ask' : 'draft';
  if(_recording) return stopRec();
  const btn=$(_micMode==='ask'?'askMicBtn':'micBtn');
  if(!navigator.mediaDevices || !window.MediaRecorder){ $(_micMode==='ask'?'askMsg':'voiceMsg').innerHTML='<span class="err">This browser can’t record audio. Try Chrome or Edge.</span>'; return; }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    _chunks=[]; _rec=new MediaRecorder(stream);
    _rec.ondataavailable=e=>{ if(e.data && e.data.size) _chunks.push(e.data); };
    _rec.onstop=async()=>{ stream.getTracks().forEach(t=>t.stop()); await sendVoice(); };
    _rec.start(); _recording=true;
    btn.textContent='⏹ Stop'; btn.classList.add('gold'); $(_micMode==='ask'?'askMsg':'voiceMsg').innerHTML='<span class="note">Listening… tap Stop when you’re done.</span>';
  }catch(e){ $(_micMode==='ask'?'askMsg':'voiceMsg').innerHTML='<span class="err">Microphone blocked. Allow mic access and try again.</span>'; }
}
function stopRec(){ if(_rec && _recording){ _recording=false; $(_micMode==='ask'?'askMicBtn':'micBtn').textContent='🎙 Dictate'; $(_micMode==='ask'?'askMicBtn':'micBtn').classList.remove('gold'); $(_micMode==='ask'?'askMsg':'voiceMsg').innerHTML='<span class="note">Transcribing…</span>'; try{_rec.stop();}catch(_){} } }
async function sendVoice(){
  try{
    const type=(_rec && _rec.mimeType)||'audio/webm';
    const blob=new Blob(_chunks,{type});
    const fd=new FormData(); fd.append('audio', blob, 'dictation.webm');
    const r=await af('/api/tessa/voice',{method:'POST',body:fd});
    const j=await r.json(); if(!r.ok) throw new Error(j.error||'voice failed');
    // Ask Tessa wants the words, not a drafted email. /voice also routes the
    // dictation into a draft; in ask mode that work is thrown away and the
    // request endpoint does the drafting instead, with recipients resolved.
    if(_micMode==='ask'){
      $('ask').value = j.transcript || '';
      $('askMsg').innerHTML = j.transcript ? '<span class="note">Got it. Tap <b>Do it</b>.</span>' : '<span class="err">Didn’t catch that.</span>';
      _micMode='draft';
      return;
    }
    if(j.transcript) $('thought').value=j.transcript;
    $(_micMode==='ask'?'askMsg':'voiceMsg').innerHTML = j.summary ? '<span class="ok">Heard: '+esc(j.summary)+'</span>' : (j.note?'<span class="note">'+esc(j.note)+'</span>':'');
    if(j.email){
      // Stash the transcript as the "thought" so a send-as switch can re-draft,
      // and record the voice this dictation was written in. (Ed 2026-08-01.)
      if($('thought') && j.transcript) $('thought').value = j.transcript;
      _draftMode = j.email.mode || _mode;
      showEmailDraft(j.email.subject, j.email.body);
      // Dictation written in a different voice than we're sending as? Re-draft to match.
      if(_draftMode!==_mode && $('thought') && $('thought').value.trim()){ doDraft(); }
      const rec=j.recipient;
      // "team" / "staff" / "everyone" is the whole-company list, not one contact.
      const hint=String(j.email.recipient_hint||'').toLowerCase();
      const saysTeam=/\b(the\s+)?(entire\s+|whole\s+|all\s+|bedrock\s+)?(team|staff|everyone|everybody|company)\b/.test(hint)
        || /\b(email|send|tell|let|reach)\b.{0,20}\b(the\s+)?(entire\s+|whole\s+|all\s+|bedrock\s+)?(team|staff|everyone)\b/.test(String(j.transcript||'').toLowerCase());
      if(saysTeam && _allStaffEmails.length){
        $('to').value=_allStaffEmails.join(', ');
        if($('rname')) $('rname').value='team';
        $('csearch').value='All Bedrock team';
        $('voiceMsg').innerHTML+=' <span class="ok">&rarr; To the <b>whole Bedrock team</b> ('+_allStaffEmails.length+'). Review the draft below and send if it&rsquo;s right.</span>';
      } else if(rec && rec.best && rec.best.email){
        // Resolved — fill To and read it back for confirmation.
        $('to').value=rec.best.email;
        $('rname').value=rec.best.name+(rec.best.org?(' at '+rec.best.org):'');
        $('csearch').value=rec.best.name+(rec.best.org?(' · '+rec.best.org):'');
        $('voiceMsg').innerHTML+=' <span class="ok">&rarr; To <b>'+esc(rec.best.name)+(rec.best.org?' at '+esc(rec.best.org):'')+'</b> ('+esc(rec.best.email)+'). Review the draft below and send if it&rsquo;s right.</span>';
      } else if(rec && rec.matches && rec.matches.length){
        // Ambiguous — show the options to pick from.
        _contacts=rec.matches; $('csearch').value=rec.hint||'';
        const box=$('cresults'); box.style.display='block';
        box.innerHTML=rec.matches.map((c,i)=>`<div onclick="pickContact(${i})" style="padding:8px 10px;border-bottom:1px solid #eef2f7;cursor:pointer;"><div style="font-weight:600;color:#0B1D34;font-size:13.5px;">${esc(c.name)}${c.org?` · ${esc(c.org)}`:''}</div><div style="font-size:11.5px;color:#64748b;">${esc(c.email||'')}</div></div>`).join('')+`<div onclick="addContactPrompt()" style="padding:8px 10px;cursor:pointer;color:#0B1D34;font-weight:600;font-size:12.5px;background:#fbfcfe;">➕ Add &ldquo;${esc(rec.hint||'')}&rdquo;</div>`;
        $('voiceMsg').innerHTML+=' <span class="note">Who did you mean by &ldquo;'+esc(rec.hint||'')+'&rdquo;? Pick below to set the address.</span>';
      } else if(j.email.recipient_hint){
        $('rname').value=j.email.recipient_hint; $('csearch').value=j.email.recipient_hint;
        $('voiceMsg').innerHTML+=' <span class="note">I heard &ldquo;'+esc(j.email.recipient_hint)+'&rdquo; &mdash; search or add them below to set the address.</span>';
      }
    }
    renderVoiceTasks(j.tasks||[]);
  }catch(e){ $('voiceMsg').innerHTML='<span class="err">'+esc(e.message)+'</span>'; }
}
function renderVoiceTasks(tasks){
  if(!tasks.length){ $('voiceTasks').innerHTML=''; return; }
  window._voiceTasks=tasks;
  $('voiceTasks').innerHTML=`<div style="margin-top:12px;border-top:1px solid var(--line);padding-top:10px;">
    <div class="note" style="margin-bottom:6px;">Follow-ups she pulled out:</div>
    ${tasks.map((t,i)=>`<label class="fu" style="display:flex;gap:8px;align-items:flex-start;font-weight:400;">
      <input type="checkbox" class="vt-chk" data-i="${i}" checked style="width:auto;margin-top:3px;">
      <span><span class="t">${esc(t.title)}</span><br><span class="note">${esc(t.category)}${t.waiting_on?' · waiting on '+esc(t.waiting_on):''}${t.due_hint?' · '+esc(t.due_hint):''}</span></span>
    </label>`).join('')}
    <button class="btn gold sm" style="margin-top:6px;" id="vtAdd" onclick="addVoiceTasks()">Add checked to follow-ups</button>
    <span id="vtMsg" class="result"></span>
  </div>`;
}
async function addVoiceTasks(){
  const picked=[...document.querySelectorAll('.vt-chk')].filter(c=>c.checked).map(c=>window._voiceTasks[+c.dataset.i]).filter(Boolean);
  if(!picked.length){ $('vtMsg').innerHTML='<span class="note">Nothing checked.</span>'; return; }
  const btn=$('vtAdd'); btn.disabled=true; $('vtMsg').innerHTML='<span class="note">Adding…</span>';
  try{
    const r=await af('/api/tessa/followups/bulk',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tasks:picked})});
    const j=await r.json(); if(!r.ok) throw new Error(j.error||'add failed');
    $('vtMsg').innerHTML='<span class="ok">✅ Added '+j.added+'.</span>'; $('voiceTasks').innerHTML=''; loadFu();
  }catch(e){ $('vtMsg').innerHTML='<span class="err">'+esc(e.message)+'</span>'; btn.disabled=false; }
}
async function doSend(){
  const to=$('to').value.trim(); if(!to){ $('sendMsg').innerHTML='<span class="err">Add a recipient (To) above.</span>'; return; }
  const cc=($('cc')?$('cc').value.trim():'');
  const btn=$('sendBtn'); btn.disabled=true; $('sendMsg').textContent='Sending…';
  try{
    const r=await af('/api/tessa/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to, cc, subject:$('d-subj').value, body:$('d-body').value, mode:_mode, create_followup:$('d-fu').checked, followup_title:'Follow up: '+$('d-subj').value})});
    const j=await r.json(); if(!r.ok) throw new Error(j.error||'send failed');
    const went=[...(j.to||to.split(/[,;]/)),...(j.cc||[])].map(s=>String(s).trim()).filter(Boolean);
    $('sendMsg').innerHTML='<span class="ok">✅ Sent as Tessa to '+esc(went.join(', '))+'.</span>';
    $('thought').value=''; $('to').value=''; if($('cc')) $('cc').value=''; $('rname').value=''; if($('rpick')) $('rpick').value=''; $('draftArea').innerHTML=''; if(j.followup_id) loadFu();
  }catch(e){ $('sendMsg').innerHTML='<span class="err">'+esc(e.message)+'</span>'; btn.disabled=false; }
}


// ---- Ask Tessa --------------------------------------------------------------
// One box. Ed says what he wants; the server resolves who it goes to, reads the
// thread in his mailbox, and drafts. Nothing sends until he clicks Send.
let _ask = null;   // the last response, so Send knows the resolved addresses

async function askTessa(extra){
  const base = $('ask').value.trim();
  if(!base) return;
  const text = extra ? (base + '. ' + extra) : base;
  const btn = $('askBtn'); btn.disabled = true;
  $('askMsg').innerHTML = '<span class="note">Working out who this goes to and pulling up the thread\u2026</span>';
  try{
    const r = await af('/api/tessa/request', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({request: text})});
    const j = await r.json();
    if(!r.ok) throw new Error(j.detail || j.error || 'request failed');
    _ask = j; $('askMsg').textContent = '';
    renderAsk(j);
  }catch(e){ $('askMsg').innerHTML = '<span class="err">'+esc(e.message)+'</span>'; }
  finally{ btn.disabled = false; }
}

function renderAsk(j){
  const to = j.to || [], cc = j.cc || [], q = j.questions || [];
  let h = '<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px;">';

  // Who it's going to. Named, always \u2014 a hidden recipient list is how the
  // wrong people get emailed.
  if(to.length){
    h += '<div style="margin-bottom:10px;"><div class="note" style="font-weight:600;color:var(--ink);">Sending to</div>'
       + to.map(function(p){ return '<div style="font-size:13px;">'+esc(p.name||'')+' <span class="note">&lt;'+esc(p.email||'')+'&gt;</span></div>'; }).join('')
       + '</div>';
  }
  if(cc.length){
    h += '<div style="margin-bottom:10px;"><div class="note" style="font-weight:600;color:var(--ink);">Copying</div>'
       + cc.map(function(p){ return '<div style="font-size:13px;">'+esc(p.name||'')+' <span class="note">&lt;'+esc(p.email||'')+'&gt;</span></div>'; }).join('')
       + '</div>';
  }

  // Who the email is ABOUT, and why she picked them. Ed 2026-08-21: she works
  // this out from correspondence, so she shows her evidence and offers the
  // alternative rather than quietly choosing.
  (j.mentions||[]).forEach(function(m){
    h += '<div style="margin-bottom:10px;padding:8px 10px;background:#fbfcfe;border:1px solid var(--line);border-radius:8px;">'
       + '<div style="font-size:13px;font-weight:600;color:var(--ink);">About: '+esc(m.name||'')+'</div>';
    if(m.evidence) h += '<div class="note">'+esc(m.evidence)+'</div>';
    (m.alternates||[]).forEach(function(a){
      var first = String(a.name||'').split(' ')[0];
      h += '<div class="note" style="margin-top:4px;">Also there: '+esc(a.name)+' &middot; '+esc(a.note)
         + ' <a href="#" onclick="askTessa(\'Use '+esc(a.name)+' at that company, not '+esc(m.name||'')+'\');return false;" style="color:var(--navy);font-weight:600;">use '+esc(first)+' instead</a></div>';
    });
    h += '</div>';
  });

  // What she read. Shows the work, and makes a bad context obvious at a glance.
  if((j.context||[]).length){
    h += '<details style="margin-bottom:10px;"><summary class="note" style="cursor:pointer;">She read '+j.context.length+' thread'+(j.context.length>1?'s':'')+' in your mail</summary>'
       + j.context.map(function(c){ return '<div class="note" style="margin-top:4px;">'+esc(String(c.received||'').slice(0,10))+' &middot; '+esc(c.subject||'')+(c.from?' &middot; '+esc(c.from):'')+'</div>'; }).join('')
       + '</details>';
  }
  if((j.context_errors||[]).length){
    var boxes = j.context_errors.map(function(e){ return e.mailbox; }).filter(function(v,i,a){ return a.indexOf(v)===i; });
    h += '<div class="note" style="color:#b91c1c;">Couldn\u2019t search: '+esc(boxes.join(', '))+'</div>';
  }

  // Anything she couldn't work out. She asks instead of guessing an address.
  if(q.length){
    h += '<div style="margin-bottom:10px;padding:9px 11px;background:#fff8e6;border:1px solid #e6d08a;border-radius:8px;">'
       + q.map(function(x){ return '<div style="font-size:13px;color:var(--ink);">'+esc(x.ask)+'</div>'
         + (x.options&&x.options.length ? '<div class="note">'+x.options.map(esc).join('<br>')+'</div>' : ''); }).join('')
       + '<div class="note" style="margin-top:6px;">Add the answer to your request above and tap Do it again.</div></div>';
  }

  if(j.draft){
    h += '<label>Subject</label><input id="a-subj" value="'+esc(j.draft.subject||'')+'">'
       + '<label>Body</label><textarea id="a-body" rows="10">'+esc(j.draft.body||'')+'</textarea>'
       + '<label style="display:flex;gap:7px;align-items:center;font-weight:400;color:var(--ink);margin-top:10px;"><input type="checkbox" id="a-fu" checked> Track a follow-up on this</label>'
       + '<div class="row" style="margin-top:10px;">'
       + '<button class="btn gold" id="aSendBtn" onclick="askSend()"'+(to.length?'':' disabled')+'>Send from Tessa</button>'
       + '<span id="aSendMsg" class="result"></span></div>';
    if(j.wants_meeting){
      h += '<div class="note" style="margin-top:8px;">You mentioned a meeting. Send this first, then book it once they say yes \u2014 she won\u2019t put an invite in a board member\u2019s calendar before they have agreed.</div>';
    }
  } else if(!q.length){
    h += '<div class="note">No draft \u2014 she couldn\u2019t work out who this goes to.</div>';
  }
  h += '</div>';
  $('askOut').innerHTML = h;
}

async function askSend(){
  if(!_ask || !(_ask.to||[]).length) return;
  const btn = $('aSendBtn'); btn.disabled = true; $('aSendMsg').textContent = 'Sending\u2026';
  try{
    const r = await af('/api/tessa/send', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({
      to: _ask.to.map(function(p){ return p.email; }).join(', '),
      cc: (_ask.cc||[]).map(function(p){ return p.email; }).join(', '),
      subject: $('a-subj').value,
      body: $('a-body').value,
      create_followup: $('a-fu').checked,
      followup_title: 'Follow up: ' + $('a-subj').value,
      followup_detail: _ask.request || null,
    })});
    const j = await r.json();
    if(!r.ok) throw new Error(j.error || 'send failed');
    $('aSendMsg').innerHTML = '<span class="ok">\u2705 Sent to '+_ask.to.length+' recipient'+(_ask.to.length>1?'s':'')+'.</span>';
    $('ask').value = ''; _ask = null;
    setTimeout(function(){ $('askOut').innerHTML=''; }, 4000);
    if(j.followup_id) loadFu();
  }catch(e){ $('aSendMsg').innerHTML = '<span class="err">'+esc(e.message)+'</span>'; btn.disabled = false; }
}

function toggleAddFu(){ const a=$('fuAdd'); a.style.display=a.style.display==='none'?'block':'none'; }
async function addFu(){
  const title=$('fu-title').value.trim(); if(!title) return;
  await af('/api/tessa/followups',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title, category:$('fu-cat').value, due_date:$('fu-due').value||null, waiting_on:$('fu-wait').value.trim()||null})});
  $('fu-title').value=''; $('fu-wait').value=''; $('fu-due').value=''; toggleAddFu(); loadFu();
}
async function loadFu(){
  try{
    const r=await af('/api/tessa/followups?status=active'); const j=await r.json();
    const list=j.followups||[];
    $('fuList').innerHTML = list.length ? list.map(f=>`<div class="fu">
      <div class="row" style="justify-content:space-between;"><span class="t">${esc(f.title)}</span><span class="pill p-${f.status}">${esc(f.status)}</span></div>
      <div class="note">${esc(f.category)}${f.waiting_on?' · waiting on '+esc(f.waiting_on):''}${f.due_date?' · due '+esc(f.due_date):''}</div>
      <div class="row" style="margin-top:6px;"><button class="btn ghost sm" onclick="setFu('${f.id}','waiting')">Waiting</button><button class="btn ghost sm" onclick="setFu('${f.id}','done')">Done</button></div>
    </div>`).join('') : '<div class="note">Nothing open. Add one, or send an email and track a follow-up.</div>';
  }catch(e){ $('fuList').innerHTML='<div class="err note">Could not load follow-ups.</div>'; }
}
async function setFu(id,status){ await af('/api/tessa/followups/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})}); loadFu(); }

(async function boot(){
  try{
    const cfg=await (await fetch('/api/auth/config')).json();
    if(!cfg||!cfg.enabled||!window.supabase) return showComingSoon();
    _supa=window.supabase.createClient(cfg.supabase_url,cfg.supabase_anon_key);
    const {data:{session}}=await _supa.auth.getSession();
    if(!session||!session.access_token) return showSignIn();  // not logged in on this device -> offer sign-in, not a dead end
    af=async(u,o)=>{ o=o||{}; const h=Object.assign({},o.headers||{}); try{const s=(await _supa.auth.getSession()).data.session; if(s&&s.access_token)h.Authorization='Bearer '+s.access_token;}catch(_){} return fetch(u,Object.assign({},o,{headers:h})); };
    // Owner-only: gate the UI on the owner-gated API itself, so the shell never
    // renders for anyone but Ed (not even another admin).
    const probe = await af('/api/tessa/followups?status=active');
    if(!probe.ok) return showComingSoon();
    render();
  }catch(e){ showComingSoon(); }
})();
