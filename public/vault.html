<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Private Books</title>
<style>
  :root{ --navy:#0B1D34; --gold:#D4AF37; --ink:#334155; --faint:#94a3b8; --rule:#e6e9ee; --bg:#f4f5f7; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,Segoe UI,Arial,sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:860px;margin:0 auto;padding:32px 20px 80px;}
  .brand{font-family:Georgia,serif;color:var(--navy);font-size:15px;font-weight:700;letter-spacing:.2px;}
  h1{font-family:Georgia,serif;color:var(--navy);font-size:26px;font-weight:700;margin:6px 0 2px;}
  .sub{color:var(--faint);font-size:13px;margin-bottom:26px;}
  .card{background:#fff;border:1px solid var(--rule);border-radius:14px;padding:22px;margin-bottom:18px;}
  .card h2{font-size:14px;color:var(--navy);margin:0 0 14px;text-transform:uppercase;letter-spacing:.06em;}
  .locked{max-width:440px;margin:12vh auto;text-align:center;background:#fff;border:1px solid var(--rule);border-radius:16px;padding:40px 30px;}
  .locked .k{font-size:34px;}
  label{display:block;font-size:11.5px;font-weight:600;color:#475569;margin:10px 0 4px;}
  input,select,textarea{width:100%;padding:9px 11px;border:1px solid #d0d7de;border-radius:8px;font-size:13.5px;background:#fff;}
  .btn{background:var(--gold);color:var(--navy);border:none;border-radius:9px;padding:10px 20px;font-weight:700;font-size:13.5px;cursor:pointer;}
  .ghost{background:#fff;border:1px solid #cbd5e1;color:var(--navy);border-radius:8px;padding:8px 14px;font-weight:600;font-size:12.5px;cursor:pointer;}
  .ent{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #f1f5f9;cursor:pointer;}
  .ent:last-child{border-bottom:none}
  .ent .n{font-weight:700;color:var(--navy);font-size:14.5px;}
  .ent .t{font-size:11.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;}
  .pill{display:inline-block;background:#eef2f7;color:#475569;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:600;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .muted{color:var(--faint);font-size:12.5px;}
  .soon{opacity:.6;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:7px 6px;border-bottom:1px solid #f1f5f9;}
  th{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;font-weight:600;}
  .row-actions{display:flex;gap:8px;margin-top:14px;}
  a.back{color:var(--faint);text-decoration:none;font-size:12.5px;}
</style>

<div id="app"><div class="wrap"><div class="muted" style="padding:40px;text-align:center;">Unlocking…</div></div></div>

<script>
const V='/api/vault';
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
// Signed dollars from cents. Money out reads negative, the way a statement does.
const money=c=>{ const n=Number(c); if(!isFinite(n)) return '—';
  return (n<0?'-':'')+'$'+Math.abs(n/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); };
const $=id=>document.getElementById(id);
let SUPA=null, ENTITIES=[], CUR=null;

async function boot(){
  try{
    const cfg=await fetch('/api/auth/config').then(r=>r.json());
    if(cfg.supabase_url&&cfg.supabase_anon_key){   // create the client whenever keys exist (identity works even if the enforce flag is off)
      if(!window.supabase){ await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=res;s.onerror=rej;document.head.appendChild(s);}); }
      SUPA=window.supabase.createClient(cfg.supabase_url,cfg.supabase_anon_key);
    }
  }catch(_){}
  // Prove the lock.
  const r=await api('GET','/whoami');
  if(!r||!r.ok){ renderLocked(); return; }
  window._owner=r.owner;
  await loadEntities();
  renderVault();
}
async function authHeader(){ try{ if(SUPA){ const {data:{session}}=await SUPA.auth.getSession(); if(session&&session.access_token) return {Authorization:'Bearer '+session.access_token}; } }catch(_){}; return {}; }
async function api(method,path,body){
  const opts={method,headers:{...(await authHeader())}};
  if(body){ opts.headers['Content-Type']='application/json'; opts.body=JSON.stringify(body); }
  try{ const res=await fetch(V+path,opts); if(res.status===403) return null; return await res.json(); }catch(_){ return null; }
}

function renderLocked(){
  $('app').innerHTML=`<div class="locked"><div class="k">🔒</div>
    <h1 style="font-size:20px;">This workspace is private</h1>
    <p class="muted">These are the owner's books. Access is limited to the account owner. If that's you, sign in with your owner account and reload.</p></div>`;
}

async function loadEntities(){ const r=await api('GET','/entities'); ENTITIES=(r&&r.entities)||[]; }

const ETYPE={s_corp:'S-Corp',c_corp:'C-Corp',llc:'LLC',partnership:'Partnership',sole_prop:'Sole Proprietor',individual:'Individual'};

function renderVault(){
  $('app').innerHTML=`<div class="wrap">
    <div class="brand">Bedrock — Private Books</div>
    <h1>The Vault</h1>
    <div class="sub">Owner-only accounting workspace · sealed to ${esc((window._owner&&window._owner.email)||'you')}</div>

    <div class="card">
      <h2>Companies</h2>
      <div id="entList">${ENTITIES.length?ENTITIES.map(e=>`
        <div class="ent" onclick="openEntity('${e.id}')">
          <div><div class="n">${esc(e.name)}</div><div class="t">${ETYPE[e.entity_type]||e.entity_type}${e.ein?' · EIN '+esc(e.ein):''}</div></div>
          <div class="pill">Open →</div>
        </div>`).join(''):'<div class="muted">No companies yet. Add your first below (Bedrock is an S-Corp).</div>'}</div>
      <div class="row-actions"><button class="ghost" onclick="toggleAdd()">＋ Add company</button></div>
      <div id="addBox" style="display:none;margin-top:14px;border-top:1px solid var(--rule);padding-top:14px;">
        <div class="grid2">
          <div><label>Company name</label><input id="e-name" placeholder="Bedrock Association Management, Inc."></div>
          <div><label>Type</label><select id="e-type">${Object.entries(ETYPE).map(([k,v])=>`<option value="${k}"${k==='s_corp'?' selected':''}>${v}</option>`).join('')}</select></div>
          <div><label>EIN (optional)</label><input id="e-ein" placeholder="XX-XXXXXXX"></div>
          <div><label>Fiscal year end</label><input id="e-fye" value="12-31" placeholder="MM-DD"></div>
        </div>
        <div class="row-actions"><button class="btn" onclick="addEntity()">Create company</button><span id="e-status" class="muted"></span></div>
      </div>
    </div>

    <div class="card soon">
      <h2>Reconstruction · coming next</h2>
      <p class="muted">Statement import (bank + credit-card PDFs → extracted, categorized transactions), the ledger, bank reconciliation, and financial statements (P&L, balance sheet, trial balance) build on top of this. Payroll stays in QuickBooks Payroll and flows in as summary entries.</p>
    </div>
  </div>`;
}

window.toggleAdd=function(){ const b=$('addBox'); b.style.display=b.style.display==='none'?'block':'none'; };
window.addEntity=async function(){
  const name=$('e-name').value.trim(); if(!name){ $('e-status').textContent='Name is required.'; return; }
  $('e-status').textContent='Creating…';
  const r=await api('POST','/entities',{name,entity_type:$('e-type').value,ein:$('e-ein').value.trim(),fiscal_year_end:$('e-fye').value.trim()});
  if(r&&r.entity){ await loadEntities(); renderVault(); } else { $('e-status').textContent='Could not create.'; }
};

let ACCTS=[], BANKS=[];
window.openEntity=async function(id){
  CUR=ENTITIES.find(e=>e.id===id); if(!CUR) return;
  const [ra,rb]=await Promise.all([api('GET','/entities/'+id+'/accounts'),api('GET','/entities/'+id+'/bank-accounts')]);
  ACCTS=(ra&&ra.accounts)||[]; BANKS=(rb&&rb.bank_accounts)||[];
  renderEntity(); loadLedger();
};
function acctOptions(sel){ return '<option value="">— uncategorized —</option>'+ACCTS.map(a=>`<option value="${a.id}"${a.id===sel?' selected':''}>${esc(a.account_number)} · ${esc(a.account_name)}</option>`).join(''); }
function renderEntity(){
  const id=CUR.id;
  $('app').innerHTML=`<div class="wrap">
    <a class="back" href="#" onclick="event.preventDefault();renderVault()">← All companies</a>
    <h1 style="margin-top:8px;">${esc(CUR.name)}</h1>
    <div class="sub">${ETYPE[CUR.entity_type]||CUR.entity_type}${CUR.ein?' · EIN '+esc(CUR.ein):''} · FYE ${esc(CUR.fiscal_year_end)}</div>

    <div class="card">
      <h2>Import a statement</h2>
      <p class="muted" style="margin-top:-8px;">Drop a bank or credit-card statement PDF. It extracts every transaction and lands them in the ledger below to categorize.</p>
      <div class="grid2">
        <div><label>Account (optional)</label><select id="imp-bank"><option value="">— unassigned —</option>${BANKS.map(b=>`<option value="${b.id}">${esc(b.name)}${b.last4?' ····'+esc(b.last4):''}</option>`).join('')}</select></div>
        <div><label>Statement PDF</label><input type="file" id="imp-file" accept="application/pdf"></div>
      </div>
      <div class="row-actions"><button class="btn" onclick="importStmt('${id}')">Extract transactions</button><span id="imp-status" class="muted"></span></div>
    </div>

    <div class="card"><h2>Ledger</h2><div id="ledger"><div class="muted">Loading…</div></div></div>

    <div class="card">
      <h2>Bank &amp; card accounts</h2>
      <div id="bankList">${BANKS.length?BANKS.map(b=>`<div class="ent" style="cursor:default;"><div><div class="n">${esc(b.name)}</div><div class="t">${esc(b.kind)}${b.institution?' · '+esc(b.institution):''}${b.last4?' · ····'+esc(b.last4):''}</div></div></div>`).join(''):'<div class="muted">None yet.</div>'}</div>
      <div class="grid2" style="margin-top:12px;">
        <div><label>Name</label><input id="b-name" placeholder="Operating Checking"></div>
        <div><label>Type</label><select id="b-kind"><option value="checking">Checking</option><option value="savings">Savings</option><option value="credit_card">Credit card</option><option value="loan">Loan</option><option value="other">Other</option></select></div>
        <div><label>Institution</label><input id="b-inst" placeholder="Bank name"></div>
        <div><label>Last 4</label><input id="b-l4" placeholder="1234"></div>
      </div>
      <div class="row-actions"><button class="ghost" onclick="addBank('${id}')">＋ Add account</button><span id="b-status" class="muted"></span></div>
    </div>

    <div class="card">
      <h2>Chart of accounts (${ACCTS.length})</h2>
      ${ACCTS.length?`<table><thead><tr><th>#</th><th>Account</th><th>Type</th></tr></thead><tbody>${ACCTS.map(a=>`<tr><td style="font-family:ui-monospace,monospace;">${esc(a.account_number)}</td><td>${esc(a.account_name)}</td><td><span class="pill">${esc(a.account_type)}</span></td></tr>`).join('')}</tbody></table>`:'<div class="muted">No accounts yet — seed a standard chart to get categorization targets.</div>'}
      <div class="row-actions">${ACCTS.length?'':`<button class="btn" onclick="seedCoA('${id}')">Seed standard chart</button>`}<button class="ghost" onclick="document.getElementById('acctAddBox').style.display=document.getElementById('acctAddBox').style.display==='none'?'block':'none'">＋ Add account</button><span id="a-status" class="muted"></span></div>
      <div id="acctAddBox" style="display:none;margin-top:12px;"><div class="grid2"><div><label>Account #</label><input id="a-num"></div><div><label>Name</label><input id="a-name"></div><div><label>Type</label><select id="a-type"><option value="asset">Asset</option><option value="liability">Liability</option><option value="equity">Equity</option><option value="revenue">Revenue</option><option value="expense">Expense</option></select></div></div><div class="row-actions"><button class="btn" onclick="addAccount('${id}')">Add</button></div></div>
    </div>
  </div>`;
}
async function loadLedger(){
  const r=await api('GET','/entities/'+CUR.id+'/transactions'); const txns=(r&&r.transactions)||[];
  const box=$('ledger'); if(!box) return;
  if(!txns.length){ box.innerHTML='<div class="muted">No transactions yet. Import a statement above.</div>'; return; }
  const nReview=txns.filter(t=>t.needs_review).length;
  box.innerHTML=`<div class="muted" style="margin-bottom:8px;">${txns.length} transactions${nReview?` · <b style="color:#b45309;">${nReview} to categorize</b>`:' · all categorized ✓'}</div>
    <table><thead><tr><th>Date</th><th>Description</th><th class="num" style="text-align:right;">Amount</th><th>Category</th></tr></thead><tbody>
    ${txns.slice(0,400).map(t=>`<tr${t.needs_review?' style="background:#fffbeb;"':''}>
      <td style="white-space:nowrap;">${esc(t.txn_date)}</td>
      <td style="max-width:300px;">${esc((t.description||'').slice(0,90))}</td>
      <td class="num" style="text-align:right;font-family:ui-monospace,monospace;color:${t.amount_cents<0?'#b91c1c':'#166534'};">${money(t.amount_cents)}</td>
      <td><select onchange="categorize('${t.id}',this.value)" style="font-size:12px;padding:5px;max-width:220px;">${acctOptions(t.category_account_id)}</select></td>
    </tr>`).join('')}</tbody></table>${txns.length>400?`<div class="muted" style="margin-top:6px;">Showing first 400 of ${txns.length}.</div>`:''}`;
}
window.categorize=async function(txnId,acctId){ await api('PATCH','/transactions/'+txnId,{category_account_id:acctId||null}); loadLedger(); };
window.importStmt=async function(id){
  const f=$('imp-file').files[0]; if(!f){ $('imp-status').textContent='Pick a PDF.'; return; }
  $('imp-status').textContent='Extracting… (can take a moment)';
  const fd=new FormData(); fd.append('file',f); const bank=$('imp-bank').value; if(bank) fd.append('bank_account_id',bank);
  const r=await fetch(V+'/entities/'+id+'/import-statement',{method:'POST',headers:{...(await authHeader())},body:fd});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){ $('imp-status').textContent=(j.error||'Extraction failed'); return; }
  const rec=j.reconciles===true?' · ✓ balances':(j.reconciles===false?` · ⚠ off by ${money(j.off_by_cents)} — review`:'');
  $('imp-status').innerHTML=`✓ ${j.count} transactions${j.period&&j.period[0]?' ('+j.period[0]+' → '+j.period[1]+')':''}${rec}`;
  $('imp-file').value=''; loadLedger();
};
window.seedCoA=async function(id){ const r=await api('POST','/entities/'+id+'/seed-accounts'); if(r&&r.ok){ const ra=await api('GET','/entities/'+id+'/accounts'); ACCTS=(ra&&ra.accounts)||[]; renderEntity(); loadLedger(); } };
window.addBank=async function(id){
  const name=$('b-name').value.trim(); if(!name){ $('b-status').textContent='Name required.'; return; }
  const r=await api('POST','/entities/'+id+'/bank-accounts',{name,kind:$('b-kind').value,institution:$('b-inst').value.trim(),last4:$('b-l4').value.trim()});
  if(r&&r.bank_account){ const rb=await api('GET','/entities/'+id+'/bank-accounts'); BANKS=(rb&&rb.bank_accounts)||[]; renderEntity(); loadLedger(); } else { $('b-status').textContent='Could not add.'; }
};
window.addAccount=async function(id){
  const account_number=$('a-num').value.trim(), account_name=$('a-name').value.trim();
  if(!account_number||!account_name){ $('a-status').textContent='Number and name required.'; return; }
  const r=await api('POST','/entities/'+id+'/accounts',{account_number,account_name,account_type:$('a-type').value});
  if(r&&r.account){ const ra=await api('GET','/entities/'+id+'/accounts'); ACCTS=(ra&&ra.accounts)||[]; renderEntity(); loadLedger(); } else { $('a-status').textContent=(r&&r.error)==='account_number_exists'?'That # exists.':'Could not add.'; }
};

boot();
</script>
