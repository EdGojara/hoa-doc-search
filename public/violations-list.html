<!-- Violations register by property. Ed 2026-08-25: "build a list in violations
     ... community drop down and sortable list of homes and violation status and
     when last one was ... right now there is nowhere I can see this." -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Violations by Property</title>
<style>
  :root { --navy:#0B1D34; --gold:#C6A15B; --line:#e2e8f0; --muted:#64748b; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; background:#f6f8fb; color:#0f172a; }
  .wrap { max-width:1200px; margin:0 auto; padding:22px 20px 60px; }
  a.back { color:var(--muted); text-decoration:none; font-size:13px; font-weight:600; }
  h1 { font-size:24px; color:var(--navy); margin:8px 0 3px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:16px; max-width:760px; }
  .toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  select, input, button { font-size:13px; font-family:inherit; }
  select, input { padding:9px 11px; border:1px solid #cbd5e1; border-radius:8px; background:#fff; }
  .toggle { display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:#334155; cursor:pointer; user-select:none; }
  .counts { margin-left:auto; display:flex; gap:8px; }
  .cnt { background:#fff; border:1px solid var(--line); border-radius:20px; padding:6px 12px; font-size:12px; color:#475569; }
  .cnt b { color:var(--navy); }
  table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; font-size:13px; }
  thead th { text-align:left; padding:10px 12px; background:#f1f5f9; color:#475569; font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; cursor:pointer; white-space:nowrap; }
  thead th .arr { color:var(--gold); font-size:10px; }
  tbody td { padding:9px 12px; border-top:1px solid #f1f5f9; vertical-align:middle; }
  tbody tr:hover { background:#f8fafc; }
  .addr { font-weight:600; color:var(--navy); }
  .owner { color:#334155; }
  .num { text-align:center; font-variant-numeric:tabular-nums; }
  .pill { display:inline-block; padding:1px 9px; border-radius:20px; font-size:10.5px; font-weight:700; text-transform:capitalize; }
  .s-clean { background:#f1f5f9; color:#64748b; }
  .s-courtesy_1 { background:#dcfce7; color:#166534; }
  .s-courtesy_2 { background:#fef3c7; color:#92400e; }
  .s-certified_209 { background:#fee2e2; color:#991b1b; }
  .s-fine_assessed { background:#ede9fe; color:#5b21b6; }
  .legal { background:#7f1d1d; color:#fff; font-size:9.5px; font-weight:700; padding:1px 6px; border-radius:5px; margin-left:5px; }
  .rel { color:#94a3b8; }
  .empty { text-align:center; color:#94a3b8; padding:40px 0; }
  .link { color:var(--navy); text-decoration:none; }
  .link:hover { text-decoration:underline; }
</style>

<div class="wrap">
  <a class="back" href="/">&larr; Back to trustEd</a>
  <h1>⚠️ Violations by Property</h1>
  <div class="sub">Every home in the community with its current violation status and when the last violation was recorded. Click a column to sort, search to jump to a home.</div>

  <div class="toolbar">
    <select id="community" onchange="loadList()"><option value="">Select a community…</option></select>
    <input id="q" placeholder="🔎 Search address or owner…" oninput="render()" style="flex:1; min-width:220px;">
    <label class="toggle"><input type="checkbox" id="openOnly" checked onchange="render()"> Only homes with an open violation</label>
    <button id="recBtn" onclick="reconcile()" style="background:#0B1D34; color:#C6A15B; border:none; padding:9px 13px; border-radius:8px; font-weight:700; cursor:pointer;" title="From the recent drives: what should escalate (still violating), what looks cured (re-inspected clean), and what's protected (certified/10-day — never auto-touched).">🔁 Reconcile</button>
    <div class="counts" id="counts"></div>
  </div>

  <div id="reconcilePanel"></div>
  <div id="list"><div class="empty">Pick a community to see its violations register.</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const API='/api/enforcement';
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const $=id=>document.getElementById(id);
const d10=s=>s?String(s).slice(0,10):'';

// Staff auth: attach the Supabase JWT to every /api call (same pattern as
// pool-access.html) so the staff-gated enforcement endpoints don't 403.
let _supa=null, _authReady=(async()=>{
  try{ const cfg=await (await fetch('/api/auth/config')).json();
    if(cfg.enabled && window.supabase){ _supa=window.supabase.createClient(cfg.supabase_url, cfg.supabase_anon_key); } }catch(_){}
})();
const _origFetch=window.fetch.bind(window);
window.fetch=async(url,opts)=>{
  opts=opts||{};
  try{ if(typeof url==='string' && url.startsWith('/api/') && _supa){ await _authReady;
    const s=(await _supa.auth.getSession()).data.session;
    if(s&&s.access_token){ opts.headers=Object.assign({},opts.headers||{},{Authorization:'Bearer '+s.access_token}); } } }catch(_){}
  if(opts.credentials===undefined) opts.credentials='same-origin';
  return _origFetch(url,opts);
};

let _rows=[], _sortKey='open_violations', _sortDir='desc';

async function loadCommunities(){
  try{
    const r=await fetch('/api/communities'); const j=await r.json();
    const list=(j.communities||j||[]).filter(Boolean).sort((a,b)=>String(a.name).localeCompare(b.name));
    $('community').innerHTML='<option value="">Select a community…</option>'+list.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
  }catch(e){ $('community').innerHTML='<option>Could not load communities</option>'; }
}

async function loadList(){
  const c=$('community').value; $('counts').innerHTML='';
  if(!c){ _rows=[]; $('list').innerHTML='<div class="empty">Pick a community to see its violations register.</div>'; return; }
  $('list').innerHTML='<div class="empty">Loading…</div>';
  try{
    const r=await fetch(`${API}/property-violations?community_id=${encodeURIComponent(c)}`);
    const j=await r.json();
    if(!j.ok){ $('list').innerHTML='<div class="empty">'+esc(j.error||'Could not load')+'</div>'; return; }
    _rows=j.properties||[];
    render();
  }catch(e){ $('list').innerHTML='<div class="empty">Error loading the register.</div>'; }
}

function setSort(key){
  if(_sortKey===key){ _sortDir=_sortDir==='asc'?'desc':'asc'; }
  else { _sortKey=key; _sortDir=(key==='street_address'||key==='owner_name')?'asc':'desc'; }
  render();
}
function stagePill(stage, open){
  if(!open){ return '<span class="pill s-clean">clean</span>'; }
  const s=stage||'courtesy_1';
  return `<span class="pill s-${esc(s)}">${esc(String(s).replace(/_/g,' '))}</span>`;
}

function render(){
  if(!_rows.length){ return; }
  const q=($('q').value||'').trim().toLowerCase();
  const openOnly=$('openOnly').checked;
  let rows=_rows.slice();
  if(openOnly) rows=rows.filter(r=>(r.open_violations||0)>0);
  if(q) rows=rows.filter(r=>`${r.street_address||''} ${r.owner_name||''} ${r.resident_name||''}`.toLowerCase().includes(q));

  const dir=_sortDir==='asc'?1:-1;
  const val=(r)=>{
    switch(_sortKey){
      case 'street_address': return String(r.street_address||'').toLowerCase();
      case 'owner_name': return String(r.owner_name||'').toLowerCase();
      case 'open_violations': return r.open_violations||0;
      case 'worst_open_stage': return ({courtesy_1:1,courtesy_2:2,certified_209:3,fine_assessed:4})[r.worst_open_stage]||0;
      case 'violations_last_12mo': return r.violations_last_12mo||0;
      case 'lifetime_violations': return r.lifetime_violations||0;
      case 'last_violation_at': return r.last_violation_at? new Date(r.last_violation_at).getTime():0;
      case 'last_inspected_at': return r.last_inspected_at? new Date(r.last_inspected_at).getTime():0;
      default: return 0;
    }
  };
  rows.sort((a,b)=>{ const av=val(a),bv=val(b); if(av<bv)return -1*dir; if(av>bv)return 1*dir; return String(a.street_address||'').localeCompare(String(b.street_address||'')); });

  const openTotal=_rows.filter(r=>(r.open_violations||0)>0).length;
  $('counts').innerHTML=`<div class="cnt"><b>${_rows.length}</b> homes</div><div class="cnt"><b>${openTotal}</b> with open violations</div><div class="cnt">showing <b>${rows.length}</b></div>`;

  const arrow=(k)=> _sortKey===k? `<span class="arr">${_sortDir==='asc'?'▲':'▼'}</span>`:'';
  const th=(k,label,cls='')=>`<th class="${cls}" onclick="setSort('${k}')">${label} ${arrow(k)}</th>`;
  const body=rows.map(r=>{
    const legal=(r.ar_at_legal||r.ar_enforcement_stage==='at_legal')?'<span class="legal">LEGAL</span>':'';
    const who=r.owner_name?esc(r.owner_name):'<span class="rel">—</span>';
    const homeLink=r.owner_contact_id?`/admin/homeowner?contact_id=${encodeURIComponent(r.owner_contact_id)}`:null;
    const addr=`${esc(r.street_address||'—')}${r.unit?' #'+esc(r.unit):''}`;
    return `<tr id="prow-${r.property_id}">
      <td class="addr"><span onclick="toggleProp('${r.property_id}', this)" style="cursor:pointer; color:#94a3b8; margin-right:5px; user-select:none; font-size:11px;" title="Show this home's violations">▸</span>${homeLink?`<a class="link" href="${homeLink}" target="_blank" rel="noopener">${addr}</a>`:addr}${legal}</td>
      <td class="owner">${who}</td>
      <td class="num">${(r.open_violations||0)>0?`<b>${r.open_violations}</b>`:'<span class="rel">0</span>'}</td>
      <td>${stagePill(r.worst_open_stage, (r.open_violations||0)>0)}</td>
      <td class="num">${r.violations_last_12mo||'<span class="rel">0</span>'}</td>
      <td class="num">${r.lifetime_violations||'<span class="rel">0</span>'}</td>
      <td>${d10(r.last_violation_at)||'<span class="rel">—</span>'}</td>
      <td>${d10(r.last_inspected_at)||'<span class="rel">—</span>'}</td>
    </tr>`;
  }).join('');

  $('list').innerHTML=`<table><thead><tr>
    ${th('street_address','Property')}
    ${th('owner_name','Owner')}
    ${th('open_violations','Open','num')}
    ${th('worst_open_stage','Stage')}
    ${th('violations_last_12mo','12 mo','num')}
    ${th('lifetime_violations','Lifetime','num')}
    ${th('last_violation_at','Last violation')}
    ${th('last_inspected_at','Last inspected')}
  </tr></thead><tbody>${body}</tbody></table>`;
}

// Expand a home to see its actual violations inline — category, stage, source
// (ours vs Vantaca-inherited), dates, and the latest letter status — so you can
// tell what the count is made of without leaving for the 360. (Ed 2026-08-25.)
async function toggleProp(pid, caret){
  const open=document.getElementById('pdet-'+pid);
  if(open){ open.remove(); if(caret)caret.textContent='▸'; return; }
  if(caret)caret.textContent='▾';
  const row=document.getElementById('prow-'+pid); if(!row) return;
  const tr=document.createElement('tr'); tr.id='pdet-'+pid;
  const td=document.createElement('td'); td.colSpan=8;
  td.style.cssText='background:#f8fafc; padding:8px 14px 14px 36px; border-top:1px solid #eef2f7;';
  td.innerHTML='<div class="rel">Loading violations…</div>';
  tr.appendChild(td); row.after(tr);
  try{
    const r=await fetch(`${API}/properties/${encodeURIComponent(pid)}/violations`); const j=await r.json();
    if(!j.ok){ td.innerHTML='<div class="rel">Could not load.</div>'; return; }
    const vs=j.violations||[]; const openV=vs.filter(v=>v.open); const closedV=vs.filter(v=>!v.open);
    const src=v=> (v.source==='vantaca_import')?'<span style="font-size:9.5px; font-weight:700; color:#7c3aed; background:#ede9fe; padding:1px 6px; border-radius:5px;">Vantaca</span>'
                : (v.source==='manual_entry')?'<span style="font-size:9.5px; font-weight:700; color:#475569; background:#f1f5f9; padding:1px 6px; border-radius:5px;">manual</span>'
                : '<span style="font-size:9.5px; font-weight:700; color:#166534; background:#dcfce7; padding:1px 6px; border-radius:5px;">ours</span>';
    const letter=v=> v.letter_status? `${esc(v.letter_status)} ${v.letter_date?d10(v.letter_date):''}` : '<span class="rel">no letter</span>';
    const line=v=>`<div style="display:flex; gap:10px; align-items:center; padding:5px 0; border-bottom:1px solid #eef2f7; font-size:12.5px; flex-wrap:wrap;">
      <span style="min-width:190px; font-weight:600; color:#0f172a;">${esc(v.category)}</span>
      ${stagePill(v.stage, v.open)} ${src(v)}
      <span class="rel">opened ${d10(v.opened_at)}</span>
      ${v.open && v.cure_period_ends_at?`<span class="rel">· cure by ${d10(v.cure_period_ends_at)}</span>`:''}
      ${!v.open?`<span class="rel">· ${esc(v.resolved_via||'closed')} ${d10(v.resolved_at)}</span>`:''}
      <span class="rel">· letter: ${letter(v)}</span>
    </div>`;
    const ohref=(row.querySelector('a.link')||{}).href;
    td.innerHTML=`
      <div style="font-weight:700; color:var(--navy); font-size:12.5px; margin-bottom:4px;">Open (${openV.length})${ohref?` &nbsp;·&nbsp; <a class="link" href="${ohref}" target="_blank" rel="noopener" style="font-weight:600; font-size:11.5px;">Open full Homeowner 360 →</a>`:''}</div>
      ${openV.length?openV.map(line).join(''):'<div class="rel">No open violations.</div>'}
      ${closedV.length?`<div style="font-weight:700; color:#64748b; font-size:11.5px; margin:10px 0 2px;">Resolved history (${closedV.length})</div>${closedV.slice(0,15).map(line).join('')}${closedV.length>15?`<div class="rel" style="padding-top:4px;">+${closedV.length-15} more…</div>`:''}`:''}`;
  }catch(e){ td.innerHTML='<div class="rel">Error loading violations.</div>'; }
}

// Re-inspection reconciliation PREVIEW (read-only). Shows what the drives imply
// should happen — escalate (still violating), cure (re-inspected clean), and the
// protected certified/10-day set that automation never touches. No stage changes
// here; this is the review step before any apply. (Ed 2026-08-25.)
async function reconcile(){
  const c=$('community').value; const panel=$('reconcilePanel');
  if(!c){ alert('Pick a community first.'); return; }
  const btn=$('recBtn'); btn.disabled=true; const label=btn.textContent; btn.textContent='Working…';
  panel.innerHTML='<div class="empty">Reconciling from the recent drives…</div>';
  try{
    const r=await fetch(`${API}/reconcile?community_id=${encodeURIComponent(c)}&window_days=60`);
    const j=await r.json();
    if(!j.ok){ panel.innerHTML='<div class="empty">'+esc(j.error||'Could not reconcile')+'</div>'; return; }
    const card=(color,bg,n,label,sub)=>`<div style="flex:1; min-width:150px; background:${bg}; border:1px solid ${color}33; border-radius:10px; padding:12px 14px;">
      <div style="font-size:26px; font-weight:800; color:${color};">${n}</div>
      <div style="font-weight:700; color:#0f172a; font-size:13px;">${label}</div>
      <div style="font-size:11.5px; color:#64748b; margin-top:2px;">${sub}</div></div>`;
    const tbl=(rows,extraCol,kind)=> rows.length? `<table style="margin-top:8px;"><thead><tr>
        <th style="cursor:default; width:28px;"><input type="checkbox" checked onchange="document.querySelectorAll('.rc-${kind}').forEach(c=>c.checked=this.checked)"></th>
        <th style="cursor:default;">Property</th><th style="cursor:default;">Owner</th><th style="cursor:default;">Category</th><th style="cursor:default;">Stage</th>${extraCol?`<th style="cursor:default;">${extraCol}</th>`:''}<th style="cursor:default;">Opened</th>
      </tr></thead><tbody>${rows.map(x=>`<tr>
        <td><input type="checkbox" class="rc-${kind}" value="${esc(x.violation_id)}" checked></td>
        <td class="addr">${esc(x.address)}</td><td class="owner">${esc(x.owner||'—')}</td>
        <td>${esc(x.category)}</td><td>${stagePill(x.stage,true)}</td>
        ${extraCol?`<td>${esc(x.next_stage||'')}</td>`:''}<td>${d10(x.opened_at)}</td>
      </tr>`).join('')}</tbody></table>` : '<div class="rel" style="padding:8px 2px;">None.</div>';
    const p=j.protected||{};
    panel.innerHTML=`<div style="background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px;">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
        <div style="font-weight:700; color:var(--navy); font-size:15px;">Reconciliation — last ${j.window_days} days <span class="rel" style="font-weight:400;">(preview only — nothing changes yet)</span></div>
        <button onclick="document.getElementById('reconcilePanel').innerHTML=''" style="background:none; border:1px solid var(--line); border-radius:6px; padding:4px 10px; cursor:pointer; color:#64748b;">Close</button>
      </div>
      <div style="display:flex; gap:10px; flex-wrap:wrap; margin:12px 0;">
        ${card('#166534','#f0fdf4',j.counts.escalate,'Escalate','Re-inspected, still violating, cure period lapsed → advance to next courtesy notice')}
        ${card('#0369a1','#f0f9ff',j.counts.cure,'Likely cured','Property re-inspected and this issue did NOT recur → close as cured (review first — a drive-by can miss)')}
        ${card('#991b1b','#fef2f2',j.counts.protected,'Protected','Certified §209 / fine / 10-day self-help — never auto-touched. Your manual call.')}
      </div>
      <div style="font-size:12px; color:#64748b; margin-bottom:2px;">Protected breakdown: ${p.certified_209||0} certified §209 · ${p.fine_assessed||0} fine · ${p.ten_day||0} 10-day self-help — these are shown so you know they exist; the tool will never change them.</div>
      <div style="display:flex; justify-content:space-between; align-items:center; margin:16px 0 0; flex-wrap:wrap; gap:8px;">
        <h3 style="font-size:13px; color:#166534; margin:0;">▲ Escalate candidates (${j.counts.escalate})</h3>
        ${j.counts.escalate?`<button onclick="applyReconcile('escalate')" style="background:#166534; color:#fff; border:none; padding:7px 13px; border-radius:7px; font-weight:700; cursor:pointer; font-size:12px;">Advance checked → 2nd notice</button>`:''}
      </div>
      ${tbl(j.escalate,'Next','esc')}
      <div style="display:flex; justify-content:space-between; align-items:center; margin:18px 0 0; flex-wrap:wrap; gap:8px;">
        <h3 style="font-size:13px; color:#0369a1; margin:0;">✓ Likely-cured candidates (${j.counts.cure})</h3>
        ${j.counts.cure?`<button onclick="applyReconcile('cure')" style="background:#0369a1; color:#fff; border:none; padding:7px 13px; border-radius:7px; font-weight:700; cursor:pointer; font-size:12px;">Mark checked cured</button>`:''}
      </div>
      ${tbl(j.cure,null,'cure')}
      <div style="margin-top:14px; padding:10px 12px; background:#fffbeb; border:1px solid #fde68a; border-radius:8px; font-size:12px; color:#92400e;">
        Uncheck any row you want to keep. <b>Advance</b> drafts a 2nd-notice letter (courtesy #1 → #2) — it does not mail. <b>Mark cured</b> closes the case. Certified §209 / 10-day are never in these lists and can't be reached here. Anything closed wrongly re-opens on the next drive.
      </div>
    </div>`;
  }catch(e){ panel.innerHTML='<div class="empty">Error: '+esc(e.message)+'</div>'; }
  finally{ btn.disabled=false; btn.textContent=label; }
}

// Apply the reviewed reconciliation for the CHECKED rows only. The server
// re-guards every id (courtesy-only, certified/10-day hard-blocked).
async function applyReconcile(action){
  const kind=action==='escalate'?'esc':'cure';
  const ids=[...document.querySelectorAll('.rc-'+kind+':checked')].map(c=>c.value);
  if(!ids.length){ alert('Nothing checked.'); return; }
  const verb=action==='escalate'?'advance to a 2nd notice (drafts a letter, does not mail)':'mark cured and close';
  if(!confirm(`${verb.charAt(0).toUpperCase()+verb.slice(1)} for ${ids.length} case${ids.length===1?'':'s'}?`)) return;
  try{
    const r=await fetch(`${API}/reconcile/apply`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action, violation_ids:ids})});
    const j=await r.json();
    if(!j.ok){ alert('Failed: '+(j.error||'unknown')); return; }
    let msg=`Done: ${j.applied_count} applied`;
    if(j.skipped_count){ msg+=`, ${j.skipped_count} skipped (protected or changed).`; }
    alert(msg);
    reconcile();      // refresh the preview
    loadList();       // refresh the register counts
  }catch(e){ alert('Error: '+e.message); }
}

_authReady.then(()=>{ loadCommunities(); });
</script>
