<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claire · Bedrock</title>
<link rel="stylesheet" href="/brand.css">
<style>
  :root{ --navy:#0B1D34; --gold:#D4AF37; --ink:#334155; --faint:#94a3b8; --rule:#1e3352; --bg:#071324; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:#e2e8f0;font-family:-apple-system,Segoe UI,Arial,sans-serif;-webkit-font-smoothing:antialiased;}
  .shell{max-width:960px;margin:0 auto;padding:20px 18px 28px;min-height:100%;display:flex;flex-direction:column;}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;}
  .brand{font-family:Georgia,serif;color:#fff;font-size:15px;font-weight:700;letter-spacing:.2px;}
  .brand small{display:block;color:var(--faint);font-family:-apple-system,Segoe UI,Arial,sans-serif;font-size:11.5px;font-weight:400;letter-spacing:.02em;}

  /* The honest-AI badge. Always on screen, never dismissible, never behind a
     hover. Someone joining late must still be told what they are talking to. */
  .ai-badge{display:inline-flex;align-items:center;gap:7px;background:rgba(212,175,55,.12);border:1px solid rgba(212,175,55,.45);
    color:var(--gold);border-radius:99px;padding:6px 13px;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;}
  .ai-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);}

  .stage{position:relative;background:#0a1a2f;border:1px solid var(--rule);border-radius:18px;overflow:hidden;aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;}
  .stage video{width:100%;height:100%;object-fit:cover;display:block;background:#0a1a2f;}
  .portrait{width:190px;height:190px;border-radius:50%;object-fit:cover;border:1px solid rgba(212,175,55,.45);}
  .stage .resting{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:26px;}
  .monogram{width:92px;height:92px;border-radius:50%;border:1px solid rgba(212,175,55,.5);display:flex;align-items:center;justify-content:center;
    font-family:Georgia,serif;font-size:34px;color:var(--gold);background:rgba(212,175,55,.07);}
  .stage .overlay-badge{position:absolute;top:14px;left:14px;z-index:3;}
  .stage .timer{position:absolute;top:16px;right:16px;z-index:3;font-size:11.5px;color:var(--faint);background:rgba(7,19,36,.72);border-radius:99px;padding:5px 11px;}
  .speaking{position:absolute;bottom:0;left:0;right:0;z-index:2;padding:26px 18px 16px;background:linear-gradient(transparent,rgba(7,19,36,.97) 30%);}
  /* Roomy + scrollable so a full answer is readable and captured, not clipped to
     a couple of lines. Auto-scrolls to the newest text as Claire streams. */
  .caption{font-size:15.5px;line-height:1.55;color:#f1f5f9;max-height:11em;overflow-y:auto;padding-right:6px;
    overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(203,213,225,.4) transparent;}
  .caption::-webkit-scrollbar{width:6px}
  .caption::-webkit-scrollbar-thumb{background:rgba(203,213,225,.35);border-radius:99px}
  .caption:empty{display:none}

  .bar{display:flex;flex-direction:column;gap:10px;align-items:stretch;margin-top:14px;}
  .ask{display:flex;gap:8px;}
  .ask input{flex:1 1 auto;}
  input[type=text],select{width:100%;padding:12px 14px;border:1px solid var(--rule);border-radius:11px;font-size:14.5px;background:#0d2038;color:#e2e8f0;}
  input[type=text]::placeholder{color:#5b708f}
  .btn{background:var(--gold);color:var(--navy);border:none;border-radius:11px;padding:12px 20px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;}
  .btn:disabled{opacity:.45;cursor:default}
  .ghost{background:transparent;border:1px solid var(--rule);color:#cbd5e1;border-radius:11px;padding:11px 16px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;}
  /* Primary call-to-action: start a spoken conversation with Claire. */
  .convo-btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;background:var(--gold);color:var(--navy);border:none;border-radius:13px;padding:15px 18px;font-weight:800;font-size:16px;cursor:pointer;letter-spacing:.01em;box-shadow:0 2px 10px rgba(212,175,55,.25);}
  .convo-btn:hover{filter:brightness(1.04);}
  .convo-btn.on{background:#3a2020;color:#f0b3a8;box-shadow:none;}
  @keyframes convoPulse{0%,100%{box-shadow:0 0 0 0 rgba(240,179,168,.0)}50%{box-shadow:0 0 0 5px rgba(240,179,168,.18)}}
  .convo-btn.on{animation:convoPulse 1.8s ease-in-out infinite;}
  .muted{color:var(--faint);font-size:12.5px;}
  .note{margin-top:12px;font-size:12.5px;color:var(--faint);line-height:1.55;}
  .warn{margin-top:12px;background:rgba(180,83,9,.16);border:1px solid rgba(217,119,6,.45);color:#fcd9a4;border-radius:11px;padding:11px 14px;font-size:13px;}
  .gate{max-width:430px;margin:14vh auto;text-align:center;background:#0a1a2f;border:1px solid var(--rule);border-radius:18px;padding:38px 30px;}
  .transcript{margin-top:16px;border-top:1px solid var(--rule);padding-top:14px;display:none;}
  .transcript.on{display:block}
  .t-row{margin-bottom:11px;font-size:13.5px;line-height:1.5;}
  .t-row .who{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);margin-bottom:2px;}
  .t-row.claire .who{color:var(--gold);}
  .t-row.blocked{border-left:2px solid rgba(217,119,6,.7);padding-left:10px;}
  /* Who is on screen. Named, always, because several teammates speak here. */
  /* Top-left, stacked under the AI badge, so it never sits on top of the
     caption text at the bottom of the stage. (Ed 2026-09-11: it was blocking
     the answer text.) */
  .whois{position:absolute;top:52px;left:14px;z-index:4;display:flex;align-items:center;gap:9px;
    background:rgba(7,19,36,.8);border:1px solid var(--rule);border-radius:99px;padding:6px 14px 6px 10px;}
  .whois .em{font-size:15px}
  .whois .nm{font-size:12.5px;font-weight:700;color:#fff;line-height:1.25}
  .whois .ti{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
  .swap{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;
    background:rgba(7,19,36,.9);text-align:center;padding:26px;}
  .swap .nm{font-family:Georgia,serif;font-size:19px;color:#fff;margin-top:12px}
  .team{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
  .who-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);border-radius:99px;
    padding:5px 11px;font-size:11.5px;color:#cbd5e1;background:#0d2038;}
  .who-chip.off{opacity:.45}
</style>

<div id="app"><div class="shell"><div class="muted" style="padding:48px;text-align:center;">Connecting…</div></div></div>

<script>
const A='/api/claire';
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const $=id=>document.getElementById(id);
let ME=null, SESSION=null, AVATAR=null, LISTENING=false, RECOG=null, ELAPSED=0, TICK=null, BEAT=null, BUSY=false;
// Conversation mode: hands-free loop (listen -> answer -> listen). CONVO stays
// true across turns so she reopens the mic after speaking; SIL_TIMER debounces
// end-of-speech so she waits through pauses instead of finalizing early.
let CONVO=false, SIL_TIMER=null, HEARD='', SPEAKING=false;
const SILENCE_MS=1300; // how long a pause must last before we treat you as done (browser-STT fallback)
// Who is on screen right now. The SERVER owns this; the page only reflects it.
let PERSONA=null;

// ---------------------------------------------------------------------------
// Boot: who is at the door decides what this page even is.
// ---------------------------------------------------------------------------
async function boot(){
  let r;
  try{ r=await fetch(A+'/me',{credentials:'same-origin'}); }catch(_){ return renderGate('offline'); }
  if(r.status===401) return renderGate('signin');
  if(!r.ok) return renderGate('error');
  ME=await r.json();
  // Selection lists are alphabetical by label, always.
  ME.communities=(ME.communities||[]).slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));
  // Pinned to one community (e.g. opened from the homeowner portal's Ask Claire
  // tile: /claire?community=<id>). Scope the lobby to just that community so a
  // portfolio-scoped viewer (a manager previewing a homeowner's portal) is never
  // shown, and can never pick, another community. The server independently
  // enforces access on /session/start via resolveVisitCommunity, so this is UX
  // scoping layered over a real server-side gate, not the gate itself.
  // (Ed 2026-09-11: the portal picker was showing every community.)
  try{
    const pin=new URLSearchParams(location.search).get('community');
    if(pin){ const match=ME.communities.find(c=>String(c.id)===String(pin)); if(match) ME.communities=[match]; }
  }catch(_){}
  renderLobby();
}

function renderGate(kind){
  const copy={
    signin:['Sign in to see Claire','Claire answers questions about your own community and your own account, so she needs to know who you are. Sign in through your portal and come back.'],
    offline:['Cannot reach Bedrock right now','Check your connection and reload. If it keeps happening, call the office and someone will pick up.'],
    error:['Something went wrong opening this','Reload the page. If it happens again, let the team know and we will look at it.'],
  }[kind]||['Unavailable',''];
  $('app').innerHTML=`<div class="shell"><div class="gate">
    <div class="monogram" style="margin:0 auto 18px;">C</div>
    <h1 style="font-family:Georgia,serif;color:#fff;font-size:21px;margin:0 0 10px;">${esc(copy[0])}</h1>
    <p class="muted" style="line-height:1.6;">${esc(copy[1])}</p></div></div>`;
}

// ---------------------------------------------------------------------------
// Lobby — pick the community (when the visitor holds more than one) and start.
// ---------------------------------------------------------------------------
function renderLobby(){
  const v=ME.visitor, many=ME.communities.length>1, one=ME.communities[0];
  const roleLine={homeowner:'your account and your community',board:'the communities you serve on',staff:'the whole portfolio'}[v.role]||'';
  $('app').innerHTML=`<div class="shell">
    <div class="top">
      <div class="brand">Bedrock<small>Claire, live</small></div>
      <span class="ai-badge"><span class="dot"></span>AI assistant</span>
    </div>
    <div class="stage">
      <div class="resting">
        <div class="monogram">C</div>
        <div style="font-family:Georgia,serif;font-size:20px;color:#fff;">Talk to Claire</div>
        <div class="muted" style="max-width:470px;line-height:1.6;">
          Claire is the front office of Bedrock's AI team. She answers questions about ${esc(roleLine)} and pulls up what the governing documents actually say. If your question belongs to a specialist she brings them in by name, and a real person is one click away the whole time.
        </div>
        ${(ME.team||[]).length?`<div class="team">${ME.team.map(t=>
          `<span class="who-chip${t.on_camera?'':' off'}" title="${esc(t.domain)}">${t.emoji} ${esc(t.name)}<span style="color:var(--faint)"> · ${esc(t.title)}</span></span>`).join('')}</div>`:''}
      </div>
    </div>
    <div class="bar">
      ${many?`<select id="c-pick" style="flex:1 1 240px;">${ME.communities.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>`
             :`<div class="muted" style="flex:1 1 auto;">${one?esc(one.name):'No community linked to your account yet.'}</div>`}
      <select id="lang" style="flex:0 0 130px;"><option value="en">English</option><option value="es">Español</option></select>
      <button class="btn" id="go" ${ME.communities.length?'':'disabled'}>Start a visit</button>
    </div>
    ${ME.video.available?'':`<div class="warn">Claire is on voice and text right now, the video presenter is switched off. Everything else works the same.</div>`}
    <div class="note">Visits are limited to ${Math.round(v.seconds_cap/60)} minutes and are recorded as part of your association's records. Claire does not decide violations, waive charges, approve requests, or give legal advice. For anything in that territory she brings in a person.</div>
  </div>`;
  $('go').onclick=startVisit;
}

// ---------------------------------------------------------------------------
// The visit.
// ---------------------------------------------------------------------------
async function startVisit(){
  const btn=$('go'); btn.disabled=true; btn.textContent='Connecting…';
  const community_id=$('c-pick')?$('c-pick').value:(ME.communities[0]||{}).id;
  const language=$('lang').value;
  let j;
  try{
    const r=await fetch(A+'/session/start',{method:'POST',credentials:'same-origin',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({community_id,language})});
    j=await r.json();
    if(!r.ok) throw new Error(j.detail||j.error||'could not start');
  }catch(e){ btn.disabled=false; btn.textContent='Start a visit'; alert('Could not start the visit: '+e.message); return; }

  SESSION=j.session; SESSION.language=language;
  PERSONA=SESSION.persona;
  renderRoom();
  say('claire', j.opener);
  await connectAvatar(j.opener);
  startMeter();
}

function renderRoom(){
  $('app').innerHTML=`<div class="shell">
    <div class="top">
      <div class="brand">Bedrock<small>${esc(SESSION.community.name)}</small></div>
      <button class="ghost" id="end">End visit</button>
    </div>
    <div class="stage">
      <video id="vid" autoplay playsinline></video>
      <div class="resting" id="resting">${SESSION.persona.portrait
        ? `<img class="portrait" id="mono" src="${esc(SESSION.persona.portrait)}" alt="${esc(SESSION.persona.name)}">`
        : `<div class="monogram" id="mono">${esc((SESSION.persona.name||'C')[0])}</div>`}<div class="muted" id="restText">${esc(SESSION.persona.name)} is listening</div></div>
      <span class="ai-badge overlay-badge"><span class="dot"></span>AI assistant</span>
      <div class="timer" id="timer"></div>
      <div class="whois" id="whois"><span class="em">${SESSION.persona.emoji||'💬'}</span><span><span class="nm">${esc(SESSION.persona.name)}</span><br><span class="ti">${esc(SESSION.persona.title)}</span></span></div>
      <div class="speaking"><div class="caption" id="cap"></div></div>
    </div>
    <div class="bar">
      <button class="convo-btn" id="mic">🎙 <span id="micLabel">Start conversation with Claire</span></button>
      <div class="ask">
        <input type="text" id="q" placeholder="…or type your question" autocomplete="off">
        <button class="btn" id="send">Ask</button>
      </div>
    </div>
    <div id="banner"></div>
    <div class="transcript" id="transcript"></div>
  </div>`;
  $('send').onclick=()=>ask($('q').value);
  $('q').addEventListener('keydown',e=>{ if(e.key==='Enter') ask($('q').value); });
  $('mic').onclick=toggleMic;
  $('end').onclick=()=>endVisit('visitor_ended');
  window.addEventListener('beforeunload',()=>{ try{ navigator.sendBeacon(A+'/session/'+SESSION.id+'/end'); }catch(_){} });
}

function banner(html){ const b=$('banner'); if(b) b.innerHTML=html?`<div class="warn">${html}</div>`:''; }

// ---------------------------------------------------------------------------
// Her voice. Requested per sentence as the answer streams, so she starts
// speaking on the first clause instead of after the whole paragraph. Queued
// rather than fired in parallel, because two overlapping clips is worse than a
// short silence. Voice is an enhancement: a 503 leaves the visit fully usable
// in text and says nothing to the visitor.
// ---------------------------------------------------------------------------
let AUDIO_Q=Promise.resolve(), AUDIO_EL=null, VOICE_OK=true;
function playLine(text){
  if(!VOICE_OK||!text||!SESSION) return;
  AUDIO_Q=AUDIO_Q.then(async()=>{
    try{
      const r=await fetch(A+'/session/'+SESSION.id+'/speak',{method:'POST',credentials:'same-origin',
        headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
      if(r.status===503){ VOICE_OK=false; return; }   // not configured: stop asking
      if(!r.ok) return;
      const url=URL.createObjectURL(await r.blob());
      await new Promise(res=>{
        AUDIO_EL=new Audio(url);
        AUDIO_EL.onended=AUDIO_EL.onerror=()=>{ URL.revokeObjectURL(url); res(); };
        const p=AUDIO_EL.play();
        // Autoplay can be blocked until the visitor interacts. Not an error,
        // and never a reason to break the turn.
        if(p&&p.catch) p.catch(()=>{ URL.revokeObjectURL(url); res(); });
      });
    }catch(_){ /* silence beats a broken visit */ }
  });
}
function stopSpeaking(){ try{ if(AUDIO_EL){ AUDIO_EL.pause(); AUDIO_EL=null; } }catch(_){} AUDIO_Q=Promise.resolve(); }

// ---------------------------------------------------------------------------
// The avatar. Deliberately isolated behind start/speak/stop so the rest of the
// page never talks to the vendor directly, and so a failure here degrades to
// voice and text instead of a dead screen. The resting card stays visible
// until a real video track arrives: never clear a working surface before its
// replacement is confirmed in hand.
// ---------------------------------------------------------------------------
async function connectAvatar(opener){
  const nm=(PERSONA&&PERSONA.name)||'Claire';
  if(!ME.video.available){ banner(`${nm} is on voice and text right now, the video presenter is switched off.`); return; }
  try{
    const r=await fetch(A+'/session/'+SESSION.id+'/avatar-token',{method:'POST',credentials:'same-origin'});
    const j=await r.json();
    if(!r.ok) throw new Error(j.detail||j.error||'no token');

    const mod=await import('https://cdn.jsdelivr.net/npm/@heygen/streaming-avatar@2/lib/index.mjs');
    const StreamingAvatar=mod.default||mod.StreamingAvatar;
    const av=new StreamingAvatar({token:j.token});
    const ready=new Promise((resolve,reject)=>{
      const evt=mod.StreamingEvents||{};
      av.on(evt.STREAM_READY||'stream_ready',e=>{
        const stream=e&&(e.detail||e.stream)||e;
        const vid=$('vid');
        if(vid&&stream){ vid.srcObject=stream.stream||stream; vid.onloadedmetadata=()=>vid.play().catch(()=>{}); }
        const rest=$('resting'); if(rest) rest.style.display='none';   // only now
        resolve();
      });
      av.on(evt.STREAM_DISCONNECTED||'stream_disconnected',()=>{
        const rest=$('resting'); if(rest) rest.style.display='';
        banner(`The video presenter dropped out. ${(PERSONA&&PERSONA.name)||'Claire'} is still here on voice and text, your visit did not end.`);
      });
      setTimeout(()=>reject(new Error('avatar timed out')),25000);
    });
    await av.createStartAvatar({quality:'medium',avatarName:j.avatar_id,voice:j.voice_id?{voiceId:j.voice_id}:undefined});
    await ready;
    AVATAR=av;
    if(opener) speakAvatar(opener);
  }catch(e){
    console.warn('[claire] avatar unavailable:',e.message);
    AVATAR=null;
    banner(`${nm} is on voice and text for this visit, the video would not connect. Everything else works the same.`);
  }
}
function speakAvatar(text){
  if(!text) return;
  if(AVATAR){
    try{ AVATAR.speak({text,task_type:'repeat'}); return; }
    catch(e){ console.warn('[claire] avatar speak failed, falling back to voice:',e.message); }
  }
  playLine(text);   // portrait + her real voice
}

// ---------------------------------------------------------------------------
// One exchange. Sentences stream back so Claire starts speaking on the first
// clause rather than after the whole answer.
// ---------------------------------------------------------------------------
async function ask(text){
  text=String(text||'').trim(); if(!text||BUSY) return;
  BUSY=true; SPEAKING=true; $('send').disabled=true; $('q').value=''; stopMic(); stopSpeaking();
  setRest('thinking');
  say('visitor',text);
  $('cap').textContent='';
  try{
    const r=await fetch(A+'/session/'+SESSION.id+'/turn',{method:'POST',credentials:'same-origin',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
    const ct=r.headers.get('content-type')||'';
    if(ct.includes('application/json')){                 // a blocked turn answers in one piece
      const j=await r.json();
      if(!r.ok) throw new Error(j.detail||j.error||'turn failed');
      $('cap').textContent=j.reply; say('claire',j.reply,j.reason); speakAvatar(j.reply);
    }else{
      let full='', pending=Promise.resolve();
      await readSSE(r,(evt,data)=>{
        // The swap is async and the answer streams right behind it, so each
        // sentence waits its turn rather than being spoken by the face that is
        // already on its way out.
        if(evt==='handoff'){ pending=pending.then(()=>swapPersona(data)).catch(()=>{}); }
        else if(evt==='sentence'){
          if(!full) setRest('speaking');
          full+=(full?' ':'')+data.text; const cap=$('cap'); cap.textContent=full; cap.scrollTop=cap.scrollHeight;
          const line=data.text; pending=pending.then(()=>speakAvatar(line)).catch(()=>{});
        }
      });
      await pending;
      if(full) say('claire',full);
    }
  }catch(e){
    const msg='Sorry, that did not go through. Want me to get someone from the team to follow up?';
    $('cap').textContent=msg; say('claire',msg);
  }finally{
    BUSY=false; $('send').disabled=false;
    if(CONVO){
      // Hands-free loop: wait for her audio to finish playing, THEN reopen the
      // mic. Waiting on the real playback queue (not `pending`) is what keeps
      // her from hearing her own tail and answering herself.
      setRest('speaking');
      try{ await AUDIO_Q; }catch(_){}
      SPEAKING=false; SEND_MUTE_UNTIL=Date.now()+350;   // reopen mic (Deepgram streams continuously; browser path re-arms below)
      if(CONVO){ setRest('listening'); if(STT_MODE==='browser') listenTurn(); }
    } else {
      SPEAKING=false; setRest(); $('q').focus();
    }
  }
}

async function readSSE(response,onEvent){
  const reader=response.body.getReader(), dec=new TextDecoder();
  let buf='';
  for(;;){
    const {done,value}=await reader.read(); if(done) break;
    buf+=dec.decode(value,{stream:true});
    let i;
    while((i=buf.indexOf('\n\n'))>=0){
      const block=buf.slice(0,i); buf=buf.slice(i+2);
      let evt='message', data='';
      for(const line of block.split('\n')){
        if(line.startsWith('event:')) evt=line.slice(6).trim();
        else if(line.startsWith('data:')) data+=line.slice(5).trim();
      }
      if(data){ try{ onEvent(evt,JSON.parse(data)); }catch(_){} }
    }
  }
}

// ---------------------------------------------------------------------------
// Transcript. Kept on screen because a visitor should be able to see what was
// said, including the moments Claire declined and why.
// ---------------------------------------------------------------------------
function say(who,text,blocked,nameOverride){
  const box=$('transcript'); if(!box||!text) return;
  const speaker = who==='claire' ? (nameOverride||(PERSONA&&PERSONA.name)||'Claire') : 'You';
  const row=document.createElement('div');
  row.className='t-row '+(who==='claire'?'claire':'you')+(blocked?' blocked':'');
  row.innerHTML=`<span class="who">${esc(speaker)}${blocked?' · brought to a person':''}</span>${esc(text)}`;
  box.appendChild(row); box.scrollTop=box.scrollHeight;
}

// A teammate takes over. Announced out loud and on screen BEFORE the face
// changes: a visitor whose screen swaps mid conversation with no explanation
// has been tricked, not helped.
async function swapPersona(h){
  const stage=document.querySelector('.stage');
  const card=document.createElement('div');
  card.className='swap';
  card.innerHTML=`<div><div class="monogram" style="margin:0 auto;">${esc((h.persona.name||'?')[0])}</div>
    <div class="nm">${h.persona.emoji||''} ${esc(h.persona.name)}</div>
    <div class="muted" style="margin-top:4px;">${esc(h.persona.title)} is joining</div></div>`;
  stage.appendChild(card);

  say('claire', h.line, false, (PERSONA&&PERSONA.name)||'Claire');
  speakAvatar(h.line);

  PERSONA=h.persona;
  const w=$('whois');
  if(w) w.innerHTML=`<span class="em">${h.persona.emoji||'💬'}</span><span><span class="nm">${esc(h.persona.name)}</span><br><span class="ti">${esc(h.persona.title)}</span></span>`;
  const mono=$('mono');
  if(mono){
    if(h.persona.portrait&&mono.tagName==='IMG'){ mono.src=h.persona.portrait; mono.alt=h.persona.name; }
    else if(mono.tagName!=='IMG'){ mono.textContent=(h.persona.name||'?')[0]; }
  }
  const rt=$('restText'); if(rt) rt.textContent=`${h.persona.name} is listening`;
  const q=$('q'); if(q) q.placeholder=`Ask ${h.persona.name} about ${SESSION.community.name}`;

  // The new face needs its own avatar session. Tear the old one down first so
  // two metered streams never run at once.
  try{ if(AVATAR&&AVATAR.stopAvatar) await AVATAR.stopAvatar(); }catch(_){}
  AVATAR=null;
  await connectAvatar(null);
  card.remove();
}

// ---------------------------------------------------------------------------
// Speech in. Browser STT keeps this free and adds no server audio path. Where
// the browser has no support the visitor types, and is told so plainly rather
// than clicking a button that does nothing.
// ---------------------------------------------------------------------------
// The mic button toggles CONVERSATION mode: tap once and Claire holds a
// hands-free back-and-forth. Primary path streams your mic to DEEPGRAM (the
// same engine the phone uses, far more accurate than the browser recognizer);
// it falls back to the browser's speech recognition if the stream can't open.
// Half-duplex on purpose: the mic is muted while she speaks so she never
// transcribes her own voice (the echo trap). Tap again to end.
let STT_MODE=null, STT_WS=null, MIC_STREAM=null, ACTX=null, SRC_NODE=null, PROC_NODE=null, SEND_MUTE_UNTIL=0;
const STT_RATE=16000;

function toggleMic(){ CONVO ? stopConvo() : startConvo(); }

async function startConvo(){
  CONVO=true; $('mic').classList.add('on'); $('mic').title='End the conversation';
  if($('micLabel')) $('micLabel').textContent='End conversation';
  stopSpeaking();          // if she was mid-sentence, tapping to talk cuts her off
  try{ await startDeepgram(); }
  catch(e){ console.warn('[claire] Deepgram STT unavailable, using browser STT:', e && e.message); startBrowserSTT(); }
}
function stopConvo(){ CONVO=false; $('mic').classList.remove('on'); $('mic').title='Start a conversation with Claire'; if($('micLabel')) $('micLabel').textContent='Start conversation with Claire'; stopDeepgram(); stopMic(); setRest(); }

// ---- Deepgram streaming path (primary) -----------------------------------
async function startDeepgram(){
  MIC_STREAM=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  const wsUrl=location.origin.replace(/^http/,'ws')+'/api/claire/stt-stream';
  await new Promise((resolve,reject)=>{
    STT_WS=new WebSocket(wsUrl);
    let opened=false;
    const to=setTimeout(()=>{ if(!opened){ try{STT_WS.close();}catch(_){}; reject(new Error('stt open timeout')); } },6000);
    STT_WS.onmessage=e=>{ let m; try{m=JSON.parse(e.data);}catch(_){return;}
      if(m.type==='ready'){ opened=true; clearTimeout(to); STT_MODE='deepgram'; beginCapture(); setRest('listening'); resolve(); }
      else if(m.type==='partial'){ if(!BUSY && m.text){ $('q').value=m.text; } }
      else if(m.type==='utterance'){ if(m.text && !BUSY) ask(m.text); }
      else if(m.type==='error'){ if(!opened){ clearTimeout(to); reject(new Error(m.message||'stt error')); } else { console.warn('[claire] stt:',m.message); } }
    };
    STT_WS.onerror=()=>{ if(!opened){ clearTimeout(to); reject(new Error('stt ws error')); } };
    STT_WS.onclose=()=>{ if(CONVO && STT_MODE==='deepgram'){ setTimeout(()=>{ if(CONVO && !BUSY){ stopDeepgram(); startConvo(); } },600); } };
  });
}
function beginCapture(){
  ACTX=new (window.AudioContext||window.webkitAudioContext)();
  SRC_NODE=ACTX.createMediaStreamSource(MIC_STREAM);
  PROC_NODE=ACTX.createScriptProcessor(2048,1,1);
  PROC_NODE.onaudioprocess=ev=>{
    if(!STT_WS||STT_WS.readyState!==1) return;
    // Half-duplex: while Claire speaks (or a short tail after), send SILENCE
    // instead of the mic so we never feed her own voice back in, but the
    // Deepgram socket stays warm (it drops after ~10s of no audio, which would
    // kill the mic on a long answer).
    const muted = SPEAKING || Date.now()<SEND_MUTE_UNTIL;
    const src = ev.inputBuffer.getChannelData(0);
    const frame = muted ? new Float32Array(src.length) : src;
    const pcm=floatToPcm16(resampleTo(frame, ACTX.sampleRate, STT_RATE));
    try{ STT_WS.send(JSON.stringify({type:'audio', audio:b64FromBytes(new Uint8Array(pcm.buffer))})); }catch(_){}
  };
  SRC_NODE.connect(PROC_NODE); PROC_NODE.connect(ACTX.destination);
}
function stopDeepgram(){
  try{ STT_WS && STT_WS.readyState===1 && STT_WS.send(JSON.stringify({type:'bye'})); }catch(_){}
  try{ STT_WS && (STT_WS.onclose=null, STT_WS.close()); }catch(_){}
  try{ PROC_NODE && PROC_NODE.disconnect(); }catch(_){}
  try{ SRC_NODE && SRC_NODE.disconnect(); }catch(_){}
  try{ MIC_STREAM && MIC_STREAM.getTracks().forEach(t=>t.stop()); }catch(_){}
  try{ ACTX && ACTX.state!=='closed' && ACTX.close(); }catch(_){}
  STT_WS=SRC_NODE=PROC_NODE=MIC_STREAM=ACTX=null; if(STT_MODE==='deepgram') STT_MODE=null;
}
function floatToPcm16(f32){ const o=new Int16Array(f32.length); for(let i=0;i<f32.length;i++){ let s=Math.max(-1,Math.min(1,f32[i])); o[i]=s<0?s*0x8000:s*0x7fff; } return o; }
function resampleTo(f32,inR,outR){ if(inR===outR) return f32; const r=inR/outR,n=Math.max(1,Math.round(f32.length/r)),o=new Float32Array(n); for(let i=0;i<n;i++){ const idx=i*r,i0=Math.floor(idx),i1=Math.min(i0+1,f32.length-1),fr=idx-i0; o[i]=f32[i0]*(1-fr)+f32[i1]*fr; } return o; }
function b64FromBytes(bytes){ let s=''; const CH=0x8000; for(let i=0;i<bytes.length;i+=CH){ s+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH)); } return btoa(s); }

// ---- Browser SpeechRecognition (fallback) --------------------------------
function startBrowserSTT(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ banner('This browser will not let Claire hear you. Type your question instead, or open the visit in Chrome or Edge.'); CONVO=false; $('mic').classList.remove('on'); $('mic').title='Start a conversation with Claire'; if($('micLabel')) $('micLabel').textContent='Start conversation with Claire'; return; }
  STT_MODE='browser'; listenTurn();
}
// Open the mic for ONE of your turns. Accumulates speech and only treats you as
// finished after a real pause (SILENCE_MS), so a mid-thought breath doesn't get
// sent as a half-question.
function listenTurn(){
  if(!CONVO||BUSY) return;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR) return;
  try{ if(RECOG){ RECOG.onend=null; RECOG.stop(); } }catch(_){}
  HEARD='';
  RECOG=new SR();
  RECOG.lang=SESSION.language==='es'?'es-US':'en-US';
  RECOG.interimResults=true; RECOG.continuous=true;
  RECOG.onresult=e=>{
    let interim='', finalAdd='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const seg=e.results[i][0].transcript;
      if(e.results[i].isFinal) finalAdd+=seg; else interim+=seg;
    }
    if(finalAdd) HEARD=(HEARD?HEARD+' ':'')+finalAdd.trim();
    $('q').value=(HEARD?HEARD+' ':'')+interim;
    // Reset the end-of-speech timer on every bit of speech.
    clearTimeout(SIL_TIMER);
    SIL_TIMER=setTimeout(()=>{
      const said=(HEARD||interim||'').trim();
      if(said){ stopMic(); ask(said); }   // ask() will reopen the mic when she's done
    }, SILENCE_MS);
  };
  RECOG.onerror=()=>{ if(CONVO && !BUSY) setTimeout(listenTurn, 400); };
  RECOG.onend=()=>{ /* keep listening across the loop unless we sent a turn */ if(CONVO && !BUSY && !SIL_TIMER) setTimeout(listenTurn, 200); };
  try{ RECOG.start(); LISTENING=true; $('mic').classList.add('on'); setRest('listening'); }catch(_){ /* start can throw if one is already running */ }
}
function stopMic(){ LISTENING=false; clearTimeout(SIL_TIMER); SIL_TIMER=null; if(RECOG){ try{RECOG.onend=null; RECOG.stop();}catch(_){} RECOG=null; } if(!CONVO){ const m=$('mic'); if(m) m.classList.remove('on'); } }
// Small status line under the avatar so it's obvious whose turn it is.
function setRest(state){ const r=$('restText'); if(!r) return;
  const nm=(SESSION&&SESSION.persona&&SESSION.persona.name)||'Claire';
  r.textContent = state==='listening' ? 'Listening…' : state==='thinking' ? `${nm} is thinking…` : state==='speaking' ? `${nm} is speaking…` : `${nm} is listening`;
}

// ---------------------------------------------------------------------------
// The meter. The browser counts, the SERVER decides. A client-side timer is a
// suggestion and the thing being limited is money.
// ---------------------------------------------------------------------------
function startMeter(){
  ELAPSED=0;
  TICK=setInterval(()=>{
    ELAPSED++;
    const left=Math.max(0,SESSION.seconds_cap-ELAPSED);
    const t=$('timer'); if(t) t.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')} left`;
  },1000);
  BEAT=setInterval(async()=>{
    try{
      const r=await fetch(A+'/session/'+SESSION.id+'/heartbeat',{method:'POST',credentials:'same-origin',
        headers:{'Content-Type':'application/json'},body:JSON.stringify({avatar_seconds:ELAPSED})});
      const j=await r.json();
      if(j&&j.active===false) endVisit(j.reason||'ended',true);
    }catch(_){ /* a dropped heartbeat must not end a live visit */ }
  },20000);
}

async function handoff(){
  try{
    const r=await fetch(A+'/session/'+SESSION.id+'/handoff',{method:'POST',credentials:'same-origin',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({reason:'visitor_requested'})});
    const j=await r.json();
    const msg=j.message||'I have passed this to the team.';
    $('cap').textContent=msg; say('claire',msg); speakAvatar(msg);
  }catch(_){ banner('Could not reach the team just now. Call the office and someone will pick up.'); }
}

async function endVisit(reason,capped){
  CONVO=false; clearInterval(TICK); clearInterval(BEAT); stopDeepgram(); stopMic(); stopSpeaking();
  try{ if(AVATAR&&AVATAR.stopAvatar) await AVATAR.stopAvatar(); }catch(_){}
  try{ await fetch(A+'/session/'+SESSION.id+'/end',{method:'POST',credentials:'same-origin',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({avatar_seconds:ELAPSED,reason})}); }catch(_){}
  $('app').innerHTML=`<div class="shell"><div class="gate">
    <div class="monogram" style="margin:0 auto 18px;">C</div>
    <h1 style="font-family:Georgia,serif;color:#fff;font-size:21px;margin:0 0 10px;">${capped?'That is the time limit':'Thanks for stopping by'}</h1>
    <p class="muted" style="line-height:1.6;">${capped
      ? 'Visits run to '+Math.round(SESSION.seconds_cap/60)+' minutes. If we did not finish, start another one or ask for a person and someone will pick it up with everything we covered.'
      : 'Anything we discussed is saved to your association record, so nobody will ask you to repeat it.'}</p>
    <div style="margin-top:18px;"><button class="btn" onclick="location.reload()">Start another visit</button></div>
  </div></div>`;
}

boot();
</script>
