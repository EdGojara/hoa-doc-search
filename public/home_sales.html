<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Sales · Bedrock</title>
<style>
  :root { --navy:#0B1D34; --gold:#D4AF37; --ink:#1f2430; --ink-soft:#475569; --ink-faint:#94a3b8;
          --rule:#e7e3d8; --bg:#f7f5ef; --ok:#15803d; --err:#b91c1c; --font-serif:'Cormorant Garamond',Georgia,serif; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:Inter,system-ui,-apple-system,sans-serif; font-size:14px; }
  header.page { background:var(--navy); color:#fff; padding:18px 26px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; border-bottom:3px solid var(--gold); }
  header.page h1 { font-family:var(--font-serif); font-weight:600; font-size:26px; margin:0; }
  header.page h1 em { color:var(--gold); font-style:italic; }
  .wrap { max-width:1080px; margin:0 auto; padding:22px 26px 60px; }
  select, input[type=text], input[type=date], input[type=email] { padding:8px 12px; border-radius:8px; border:1px solid var(--rule); background:#fff; color:var(--ink); font-size:14px; }
  header.page select { border:1px solid rgba(255,255,255,0.3); min-width:210px; }
  .card { background:#fff; border:1px solid var(--rule); border-radius:12px; padding:18px 20px; box-shadow:0 1px 2px rgba(0,0,0,0.03); margin-bottom:16px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; padding:8px 10px; color:var(--ink-faint); font-size:11px; letter-spacing:0.05em; text-transform:uppercase; border-bottom:2px solid var(--rule); }
  td { padding:9px 10px; border-bottom:1px solid #f1efe8; vertical-align:top; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .badge { display:inline-block; padding:3px 11px; border-radius:999px; font-size:12px; font-weight:700; }
  .badge.ok { background:#dcfce7; color:var(--ok); } .badge.err { background:#fee2e2; color:var(--err); }
  .badge.req { background:#fef3c7; color:#92400e; } .badge.disc { background:#dbeafe; color:#1e40af; } .badge.closed { background:#e2e8f0; color:#334155; }
  .muted { color:var(--ink-faint); }
  h2.sec { font-family:var(--font-serif); font-size:20px; color:var(--navy); margin:0 0 4px; }
  .btn { padding:9px 18px; border-radius:8px; border:1px solid var(--navy); background:var(--navy); color:#fff; font-size:13.5px; font-weight:700; cursor:pointer; }
  .btn.gold { background:var(--gold); border-color:var(--gold); color:var(--navy); }
  .btn.ghost { background:#fff; color:var(--navy); }
  .btn:disabled { opacity:.5; cursor:default; }
  .field { display:flex; flex-direction:column; gap:4px; margin-bottom:12px; }
  .field label { font-size:12px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .kv { display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid #f1efe8; }
  .kv .k { color:var(--ink-soft); } .kv .v { font-weight:600; }
  .timeline { list-style:none; padding:0; margin:0; }
  .timeline li { padding:10px 0 10px 18px; border-left:2px solid var(--rule); position:relative; }
  .timeline li:before { content:''; position:absolute; left:-6px; top:14px; width:10px; height:10px; border-radius:50%; background:var(--gold); }
  .timeline li.current:before { background:var(--ok); }
  .result-ok { background:#f0fdf4; border:1px solid #bbf7d0; border-radius:10px; padding:14px 16px; }
  .result-warn { background:#fffbeb; border:1px solid #fde68a; border-radius:10px; padding:14px 16px; }
  a.link { color:var(--navy); font-weight:600; cursor:pointer; text-decoration:none; border-bottom:1px dotted var(--ink-faint); }
</style>
</head>
<body>
<header class="page">
  <div>
    <div style="display:flex; gap:20px; align-items:center; margin-bottom:7px; font-size:13px;">
      <a href="/" style="color:#fff; text-decoration:none; opacity:.85;">&larr; trustEd Home</a>
    </div>
    <h1>Bedrock <em>Home Sales</em></h1>
    <div style="font-size:12px; opacity:.8; margin-top:3px;">Resale disclosures &amp; ownership transfers · <em>community simplified</em></div>
  </div>
  <select id="commSel"></select>
</header>
<div class="wrap">
  <div class="row" style="margin-bottom:16px;">
    <button class="btn gold" id="btnRequest">＋ Log resale request</button>
    <button class="btn" id="btnScan">📄 Scan closing packet</button>
    <button class="btn" id="btnProrate">🧮 Prorate assessment</button>
    <button class="btn" id="btnWelcome">📬 Welcome packet</button>
  </div>
  <div id="panel"></div>
  <div id="list"><div class="muted" style="padding:30px; text-align:center;">Loading…</div></div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const fmt = (cents) => '$' + (Number(cents||0)/100).toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2});
  const esc = (s) => String(s==null?'':s).replace(/[&<>"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fmtDate = (d) => { if (!d) return '—'; const t = new Date(d + (String(d).length===10?'T00:00:00':'')); return isNaN(t)? d : t.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}); };
  const dollarsToCents = (v) => { if (v===''||v==null) return null; const n = Number(String(v).replace(/[$,]/g,'')); return Number.isFinite(n)? Math.round(n*100): null; };
  let CID = null, COMMS = [];

  const STAGE_BADGE = {
    requested: '<span class="badge req">Requested</span>',
    disclosed: '<span class="badge disc">Disclosed</span>',
    closed:    '<span class="badge closed">Closed</span>',
    cancelled: '<span class="badge">Cancelled</span>',
  };

  async function init() {
    const r = await fetch('/api/communities');
    const j = await r.json();
    COMMS = j.communities || [];
    $('commSel').innerHTML = COMMS.map((c)=>`<option value="${c.id}">${esc(c.name)}</option>`).join('') || '<option>No communities</option>';
    CID = COMMS[0] && COMMS[0].id;
    $('commSel').addEventListener('change', (e)=>{ CID = e.target.value; clearPanel(); loadList(); });
    $('btnRequest').addEventListener('click', openRequestFlow);
    $('btnScan').addEventListener('click', openScanFlow);
    $('btnProrate').addEventListener('click', openProrateFlow);
    $('btnWelcome').addEventListener('click', openWelcomeFlow);
    if (CID) loadList(); else $('list').innerHTML = '<div class="card muted">No managed communities found.</div>';
  }

  function clearPanel(){ $('panel').innerHTML = ''; }

  // ── The lifecycle list ────────────────────────────────────────────────────
  async function loadList() {
    $('list').innerHTML = '<div class="muted" style="padding:30px; text-align:center;">Loading…</div>';
    try {
      await loadWelcomeSent();
      const r = await fetch(`/api/home-sales?community_id=${CID}`);
      const j = await r.json(); if (j.error) throw new Error(j.error);
      const sales = j.sales || [];
      if (!sales.length) {
        $('list').innerHTML = '<div class="card muted" style="padding:24px;">No home sales tracked yet. Log a resale request when HomeWise emails, or scan a closing packet when the title mail arrives.</div>';
        return;
      }
      const rows = sales.map((s)=>{
        const addr = s.properties ? (s.properties.street_address + (s.properties.unit?(' '+s.properties.unit):'')) : '—';
        const bal = s.status==='closed'
          ? (s.seller_final_balance_cents===0
              ? '<span class="badge ok">cleared $0</span>'
              : `<span class="badge err">${fmt(s.seller_final_balance_cents)}</span>`)
          : (s.balance_cents===0 ? '<span class="badge ok">$0</span>' : (s.balance_cents!=null?fmt(s.balance_cents):'—'));
        const drv = s.drv_clean==null ? '—' : (s.drv_clean ? '<span class="badge ok">clean</span>' : `<span class="badge err">${s.open_violations_count||0} open</span>`);
        // The welcome packet, for closed sales only. A closed sale with no
        // packet is a new owner nobody has spoken to, so it shows as an action
        // rather than a blank cell.
        const wp = WELCOME_BY_PROP[s.property_id];
        const packet = s.status !== 'closed' ? '<span class="muted">—</span>'
          : (wp && wp.status === 'sent') ? '<span class="badge ok">sent</span>'
          : (wp ? '<span class="badge req">filed</span>'
                : `<a class="link" onclick="openWelcomeFor('${s.property_id}','${s.id}','${esc(s.buyer_name||'')}','${esc(s.closing_date||'')}')">send</a>`);
        return `<tr>
          <td><a class="link" onclick="openHistory('${s.property_id}')">${esc(addr)}</a></td>
          <td>${STAGE_BADGE[s.status]||esc(s.status)}</td>
          <td>${esc(s.seller_name||'—')}${s.buyer_name?(' <span class="muted">→</span> '+esc(s.buyer_name)):''}</td>
          <td>${s.closing_date?fmtDate(s.closing_date):(s.request_received_at?('req '+fmtDate(s.request_received_at)):'—')}</td>
          <td>${drv}</td>
          <td class="num">${bal}</td>
          <td class="num">${s.transfer_fee_cents!=null?fmt(s.transfer_fee_cents):'—'}</td>
          <td>${packet}</td>
        </tr>`;
      }).join('');
      $('list').innerHTML = `<div class="card">
        <h2 class="sec">Sales &amp; resale requests</h2>
        <div class="muted" style="margin-bottom:10px; font-size:12.5px;">Click a property for its full ownership history.</div>
        <table><thead><tr><th>Property</th><th>Stage</th><th>Seller → Buyer</th><th>Closing / Request</th><th>DRV</th><th class="num">Balance</th><th class="num">Transfer fee</th><th>Welcome</th></tr></thead>
        <tbody>${rows}</tbody></table></div>`;
    } catch (e) { $('list').innerHTML = '<div class="card" style="color:var(--err)">Couldn\'t load: '+esc(e.message)+'</div>'; }
  }

  // ── Part 1: resale request — pick property, show snapshot, log ─────────────
  function openRequestFlow() {
    clearPanel();
    $('panel').innerHTML = `<div class="card">
      <h2 class="sec">Log a resale request <span class="muted" style="font-size:13px;">(HomeWise / title)</span></h2>
      <div class="field"><label>Find the property selling</label>
        <input type="text" id="rq-search" placeholder="Street address or owner name…" autocomplete="off"></div>
      <div id="rq-results"></div>
      <div id="rq-snapshot"></div>
    </div>`;
    let t; $('rq-search').addEventListener('input', (e)=>{ clearTimeout(t); t=setTimeout(()=>propSearch(e.target.value, 'rq'), 250); });
    $('rq-search').focus();
  }

  async function propSearch(q, ctx) {
    if (!q || q.trim().length < 2) { $(ctx+'-results').innerHTML = ''; return; }
    const r = await fetch(`/api/home-sales/properties/search?community_id=${CID}&q=${encodeURIComponent(q)}`);
    const j = await r.json(); const props = j.properties || [];
    $(ctx+'-results').innerHTML = props.length ? props.map((p)=>
      `<div class="row" style="padding:8px 0; border-bottom:1px solid #f1efe8;">
        <a class="link" onclick="pickProperty('${p.property_id}','${ctx}')">${esc(p.street_address)}${p.unit?(' '+esc(p.unit)):''}</a>
        <span class="muted" style="font-size:12px;">${esc(p.owner_name||'')}</span></div>`).join('')
      : '<div class="muted" style="padding:8px 0;">No match.</div>';
  }

  window.pickProperty = async function(property_id, ctx) {
    if (ctx === 'rq') {
      $('rq-results').innerHTML = '';
      const snap = await fetchSnapshot(property_id);
      if (!snap) { $('rq-snapshot').innerHTML = '<div class="muted">Couldn\'t load that property.</div>'; return; }
      $('rq-snapshot').innerHTML = snapshotCard(snap) + `
        <div class="grid2" style="margin-top:14px;">
          <div class="field"><label>Requested by</label><input type="text" id="rq-by" placeholder="HomeWise / title company / agent"></div>
          <div class="field"><label>Source</label><select id="rq-source">
            <option value="homewise">HomeWise</option><option value="title_company">Title company</option><option value="agent">Agent</option><option value="other">Other</option></select></div>
        </div>
        <button class="btn gold" onclick="submitRequest('${property_id}')">Log request</button>`;
    } else if (ctx === 'sc') {
      // scan flow manual property pick
      window._scanProp = property_id;
      $('sc-results').innerHTML = '';
      const snap = await fetchSnapshot(property_id);
      $('sc-prop-chosen').innerHTML = snap ? ('Matched: <b>'+esc(snap.property.street_address)+'</b> — seller of record <b>'+esc(snap.owner?snap.owner.owner_name:'unknown')+'</b>') : '';
      renderSellerCheck(snap);
    } else if (ctx === 'wp') {
      $('wp-results').innerHTML = '';
      renderWelcomePanel(property_id, {});
    } else if (ctx === 'pr') {
      // proration flow property pick
      window._prProp = property_id;
      $('pr-results').innerHTML = '';
      const snap = await fetchSnapshot(property_id);
      $('pr-prop-chosen').innerHTML = snap ? ('Selected: <b>'+esc(snap.property.street_address)+'</b> — current owner <b>'+esc(snap.owner?snap.owner.owner_name:'unknown')+'</b>') : '';
      prPreview();
    }
  };

  async function fetchSnapshot(property_id) {
    const r = await fetch(`/api/home-sales/property/${property_id}/snapshot?community_id=${CID}`);
    if (!r.ok) return null;
    return r.json();
  }

  function snapshotCard(snap) {
    const o = snap.owner || {};
    return `<div class="card" style="background:#fbfaf6;">
      <div class="kv"><span class="k">Property</span><span class="v">${esc(snap.property.street_address)}${snap.property.unit?(' '+esc(snap.property.unit)):''}</span></div>
      <div class="kv"><span class="k">Owner of record</span><span class="v">${esc(o.owner_name||'—')}</span></div>
      <div class="kv"><span class="k">Account balance${snap.balance_as_of?(' (as of '+fmtDate(snap.balance_as_of)+')'):''}</span><span class="v">${snap.balance_is_zero?'<span class="badge ok">$0.00 — cleared</span>':'<span class="badge err">'+fmt(snap.balance_cents)+' owed</span>'}</span></div>
      <div class="kv"><span class="k">Deed-restriction (DRV) status</span><span class="v">${snap.drv_clean?'<span class="badge ok">Clean — no open violations</span>':'<span class="badge err">'+snap.open_violations_count+' open ('+esc(snap.worst_open_stage||'')+')</span>'}</span></div>
      <div class="kv" style="border-bottom:none;"><span class="k">Inspection</span><span class="v muted">Schedule a resale inspection to confirm condition</span></div>
    </div>`;
  }

  window.submitRequest = async function(property_id) {
    const body = { community_id: CID, property_id, requested_by: $('rq-by').value || null, request_source: $('rq-source').value };
    const r = await fetch('/api/home-sales/request', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const j = await r.json(); if (j.error) { alert('Couldn\'t log: '+j.error); return; }
    clearPanel(); loadList();
  };

  // ── Part 2: scan the closing packet → record the transfer ──────────────────
  function openScanFlow() {
    clearPanel();
    $('panel').innerHTML = `<div class="card">
      <h2 class="sec">Scan closing packet <span class="muted" style="font-size:13px;">(title mail + transfer-fee check)</span></h2>
      <div class="muted" style="margin-bottom:12px; font-size:12.5px;">Upload the cover/transfer letter (PDF or photo). We'll read the buyer, seller, closing date, and fees, then you confirm before ownership updates.</div>
      <input type="file" id="sc-file" accept="application/pdf,image/*">
      <button class="btn" id="sc-go" style="margin-left:8px;">Read document</button>
      <div id="sc-out" style="margin-top:14px;"></div>
    </div>`;
    $('sc-go').addEventListener('click', doScan);
  }

  async function doScan() {
    const f = $('sc-file').files && $('sc-file').files[0];
    if (!f) { alert('Choose a file first.'); return; }
    $('sc-go').disabled = true; $('sc-out').innerHTML = '<div class="muted">Reading the document…</div>';
    try {
      const fd = new FormData(); fd.append('file', f); fd.append('community_id', CID);
      const r = await fetch('/api/home-sales/scan', { method:'POST', body: fd });
      const j = await r.json();
      if (j.error) { $('sc-out').innerHTML = '<div class="result-warn">Couldn\'t read it: '+esc(j.error)+(j.raw_extracted?'<pre style="white-space:pre-wrap; font-size:11px;">'+esc(String(j.raw_extracted))+'</pre>':'')+'</div>'; return; }
      window._scanRaw = j.raw_extracted || null;
      renderScanForm(j.extracted || {}, j.property_matches || []);
    } catch (e) { $('sc-out').innerHTML = '<div class="result-warn">'+esc(e.message)+'</div>'; }
    finally { $('sc-go').disabled = false; }
  }

  function renderScanForm(ex, matches) {
    window._scanProp = matches.length === 1 ? matches[0].property_id : null;
    const matchOpts = matches.map((m)=>`<option value="${m.property_id}">${esc(m.street_address)}${m.unit?(' '+esc(m.unit)):''} — ${esc(m.owner_name||'')}</option>`).join('');
    $('sc-out').innerHTML = `
      <div class="card" style="background:#fbfaf6;">
        <div class="row" style="justify-content:space-between;"><b>What we read</b>
          <span class="badge ${ex.confidence==='high'?'ok':(ex.confidence==='low'?'err':'req')}">${esc(ex.confidence||'?')} confidence</span></div>
        ${ex.notes?('<div class="muted" style="margin:6px 0; font-size:12.5px;">Note: '+esc(ex.notes)+'</div>'):''}
        <div class="field" style="margin-top:10px;"><label>Property (confirm the match)</label>
          ${matches.length?('<select id="sc-prop">'+matchOpts+'</select>'):'<div class="muted">No address match — search below.</div>'}
          <input type="text" id="sc-search" placeholder="Search by address/owner if the match is wrong…" autocomplete="off" style="margin-top:6px;">
          <div id="sc-results"></div><div id="sc-prop-chosen" class="muted" style="font-size:12px; margin-top:4px;"></div>
        </div>
        <div class="grid2">
          <div class="field"><label>Buyer (new owner)</label><input type="text" id="sc-buyer" value="${esc(ex.buyer_name||'')}"></div>
          <div class="field"><label>Closing date</label><input type="date" id="sc-closing" value="${esc(ex.closing_date||'')}"></div>
          <div class="field"><label>Buyer email</label><input type="email" id="sc-bemail" value="${esc(ex.buyer_email||'')}"></div>
          <div class="field"><label>Buyer mailing address</label><input type="text" id="sc-bmail" value="${esc(ex.buyer_mailing_address||'')}"></div>
          <div class="field"><label>Transfer fee → association ($)</label><input type="text" id="sc-tfee" value="${ex.transfer_fee_cents!=null?(ex.transfer_fee_cents/100):''}"></div>
          <div class="field"><label>Bedrock transfer fee ($)</label><input type="text" id="sc-mfee" value="${ex.management_transfer_fee_cents!=null?(ex.management_transfer_fee_cents/100):''}"></div>
        </div>
        <div id="sc-seller-check"></div>
        <button class="btn gold" id="sc-record" style="margin-top:8px;">Record closing &amp; update ownership</button>
      </div>`;
    let t; $('sc-search').addEventListener('input', (e)=>{ clearTimeout(t); t=setTimeout(()=>propSearch(e.target.value,'sc'), 250); });
    const sel = $('sc-prop');
    if (sel) { sel.addEventListener('change', async ()=>{ window._scanProp = sel.value; renderSellerCheck(await fetchSnapshot(sel.value)); });
               window._scanProp = sel.value; fetchSnapshot(sel.value).then(renderSellerCheck); }
    $('sc-record').addEventListener('click', recordClosing);
  }

  function renderSellerCheck(snap) {
    const el = $('sc-seller-check'); if (!el) return;
    if (!snap) { el.innerHTML = ''; return; }
    const o = snap.owner || {};
    el.innerHTML = `<div class="kv"><span class="k">Seller of record</span><span class="v">${esc(o.owner_name||'—')}</span></div>
      <div class="kv"><span class="k">Seller balance at closing</span><span class="v">${snap.balance_is_zero?'<span class="badge ok">$0.00 — cleared</span>':'<span class="badge err">'+fmt(snap.balance_cents)+' still owed</span>'}</span></div>
      <div class="kv"><span class="k">DRV</span><span class="v">${snap.drv_clean?'<span class="badge ok">clean</span>':'<span class="badge err">'+snap.open_violations_count+' open</span>'}</span></div>`;
  }

  async function recordClosing() {
    const property_id = window._scanProp;
    if (!property_id) { alert('Confirm the property first.'); return; }
    const buyer = $('sc-buyer').value.trim();
    const closing = $('sc-closing').value;
    if (!buyer) { alert('Buyer name is required.'); return; }
    if (!closing) { alert('Closing date is required.'); return; }
    $('sc-record').disabled = true;
    const body = {
      community_id: CID, property_id,
      buyer_name: buyer, closing_date: closing,
      buyer_email: $('sc-bemail').value || null,
      buyer_mailing_address: $('sc-bmail').value || null,
      transfer_fee_cents: dollarsToCents($('sc-tfee').value),
      management_transfer_fee_cents: dollarsToCents($('sc-mfee').value),
      raw_extraction: window._scanRaw || null,
    };
    try {
      const r = await fetch('/api/home-sales/record-closing', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
      const j = await r.json(); if (j.error) throw new Error(j.error);
      const cleared = j.seller_cleared;
      $('sc-out').innerHTML = `<div class="${cleared?'result-ok':'result-warn'}">
        <b>Ownership updated.</b> ${esc(buyer)} is now the owner of record as of ${fmtDate(closing)}; the prior owner moved into history.
        <div style="margin-top:8px;">Seller's final balance: ${cleared?'<span class="badge ok">$0.00 — cleared at closing</span>':'<span class="badge err">'+fmt(j.seller_final_balance_cents)+' — NOT zero, review before deposit</span>'}</div>
        <div style="margin-top:14px; padding-top:12px; border-top:1px solid #e7e3d8;">
          <b>Next: welcome the new owner.</b>
          <div class="muted" style="font-size:12.5px; margin:3px 0 8px;">This is the only moment we know a new person owns this lot. Everything in the packet is specific to this community.</div>
          <div id="wp-panel"></div>
        </div>
      </div>`;
      // Offered, never automatic. The operator reads it and sends it.
      renderWelcomePanel(property_id, {
        owner_name: buyer, effective_date: closing,
        occasion: 'resale', home_sale_id: (j.sale && j.sale.id) || null,
      });
      loadList();
    } catch (e) { alert('Couldn\'t record: '+e.message); $('sc-record').disabled = false; }
  }

  // ── Ownership history for a property ───────────────────────────────────────
  window.openHistory = async function(property_id) {
    clearPanel();
    $('panel').innerHTML = '<div class="card muted">Loading history…</div>';
    const r = await fetch(`/api/home-sales/property/${property_id}/history`);
    const j = await r.json();
    const owns = j.ownerships || [], sales = j.sales || [];
    const tl = owns.map((o)=>{
      const name = o.contacts ? o.contacts.full_name : '—';
      const cur = !o.end_date;
      return `<li class="${cur?'current':''}">
        <b>${esc(name)}</b> ${cur?'<span class="badge ok" style="font-size:10px;">current</span>':''}
        <div class="muted" style="font-size:12.5px;">${fmtDate(o.start_date)} → ${o.end_date?fmtDate(o.end_date):'present'}${o.vesting?(' · '+esc(o.vesting)):''}</div>
      </li>`;
    }).join('');
    const saleRows = sales.filter((s)=>s.status==='closed').map((s)=>
      `<div class="kv"><span class="k">${fmtDate(s.closing_date)} — ${esc(s.seller_name||'')} → ${esc(s.buyer_name||'')}</span>
       <span class="v">${s.seller_final_balance_cents===0?'<span class="badge ok">cleared</span>':'<span class="badge err">'+fmt(s.seller_final_balance_cents)+'</span>'}${s.transfer_fee_cents!=null?(' · fee '+fmt(s.transfer_fee_cents)):''}</span></div>`).join('');
    $('panel').innerHTML = `<div class="card">
      <div class="row" style="justify-content:space-between;"><h2 class="sec">Ownership history</h2><a class="link" onclick="clearPanel()">close</a></div>
      <ul class="timeline">${tl || '<li class="muted">No ownership records.</li>'}</ul>
      ${saleRows?('<h2 class="sec" style="margin-top:14px; font-size:16px;">Recorded sales</h2>'+saleRows):''}
    </div>`;
    window.scrollTo({top:0, behavior:'smooth'});
  };

  // -- New-homeowner welcome packet ------------------------------------------
  // Lives here because the closing is the trigger. Nothing sends itself: the
  // operator sees what will print AND what is missing before anything goes out.
  function openWelcomeFlow() {
    if (!CID) { alert('Pick a community first.'); return; }
    clearPanel();
    $('panel').innerHTML = `<div class="card">
      <h2 class="sec">Welcome packet <span class="muted" style="font-size:13px;">(new homeowner)</span></h2>
      <div class="muted" style="margin-bottom:12px; font-size:12.5px;">Everything in the packet is specific to this community: the trash schedule, the numbers, how architectural approval works, and what owners here actually get written about.</div>
      <div class="field"><label>Which home</label>
        <input type="text" id="wp-search" placeholder="Street address or owner name&hellip;" autocomplete="off"></div>
      <div id="wp-results"></div>
      <div id="wp-panel"></div>
    </div>`;
    let t; $('wp-search').addEventListener('input', (e)=>{ clearTimeout(t); t=setTimeout(()=>propSearch(e.target.value,'wp'), 250); });
    $('wp-search').focus();
  }

  // Straight from a closed sale in the list, with the buyer and closing date
  // already known, so the operator never re-types what the system has.
  window.openWelcomeFor = function(property_id, sale_id, buyer, closing) {
    clearPanel();
    $('panel').innerHTML = `<div class="card">
      <div class="row" style="justify-content:space-between;"><h2 class="sec">Welcome packet</h2><a class="link" onclick="clearPanel()">close</a></div>
      <div id="wp-panel"></div></div>`;
    renderWelcomePanel(property_id, {
      owner_name: buyer || null, effective_date: closing || null,
      occasion: 'resale', home_sale_id: sale_id || null,
    });
    window.scrollTo({top:0, behavior:'smooth'});
  };

  // Renders into #wp-panel when the flow opened it, otherwise into ctx.into.
  window.renderWelcomePanel = async function(property_id, ctx) {
    ctx = ctx || {};
    const host = $('wp-panel') || $(ctx.into);
    if (!host) return;
    host.innerHTML = '<div class="muted" style="padding:12px 0;">Checking what we can tell them&hellip;</div>';
    const qs = new URLSearchParams({ community_id: CID, property_id });
    if (ctx.owner_name) qs.set('owner_name', ctx.owner_name);
    if (ctx.effective_date) qs.set('effective_date', ctx.effective_date);
    if (ctx.occasion) qs.set('occasion', ctx.occasion);
    let j, r;
    try {
      r = await fetch('/api/welcome/preview?' + qs.toString());
      j = await r.json();
    } catch (e) { host.innerHTML = '<div class="result-warn">Could not build it: '+esc(e.message)+'</div>'; return; }

    if (r.status === 409) {
      // The lifecycle refusal (a community we are handing off). Say why, in full.
      host.innerHTML = '<div class="result-warn"><b>No welcome packet for this community.</b><div style="margin-top:6px;">'+esc(j.reason||'')+'</div></div>';
      return;
    }
    if (!r.ok) { host.innerHTML = '<div class="result-warn">'+esc(j.reason||j.error||'Could not build it')+'</div>'; return; }

    window._wpProp = property_id;
    window._wpCtx = ctx;
    const inc = j.included || [], miss = j.missing || [];
    const link = '/api/welcome/preview.html?' + qs.toString();
    const pdf  = '/api/welcome/pdf?' + qs.toString();
    const letterHtml = '/api/welcome/letter.html?' + qs.toString();
    const letterPdf  = '/api/welcome/letter.pdf?' + qs.toString();
    const email = (j.owner && j.owner.email) || '';

    const missBlock = miss.length ? `<div style="margin-top:14px;">
          <div style="font-weight:700; font-size:12.5px; margin-bottom:4px;">Gaps in what we can tell them</div>
          <div class="muted" style="font-size:12px; margin-bottom:6px;">An empty section does not print, it is never filled with generic copy. Supplying these improves every packet this community sends from here on.</div>
          ${miss.map((m)=>`<div style="padding:6px 0; border-bottom:1px solid #f1efe8;">
            <b>${esc(m.title)}</b>
            ${m.partial?'<span class="badge req" style="font-size:10px;">partial</span>':'<span class="badge" style="font-size:10px; background:#e2e8f0; color:#334155;">not printed</span>'}
            ${m.detail?('<div class="muted" style="font-size:12px;">'+esc(m.detail)+'</div>'):''}
            ${m.fix?('<div class="muted" style="font-size:12px;">'+esc(m.fix)+'</div>'):''}</div>`).join('')}
        </div>` : '<div class="result-ok" style="margin-top:12px;">Every section has data. This community sends a complete packet.</div>';

    host.innerHTML = `
      <div class="card" style="background:#fbfaf6; margin-top:12px;">
        <div class="kv"><span class="k">Home</span><span class="v">${esc(j.property.street_address)}${j.property.unit?(' '+esc(j.property.unit)):''}</span></div>
        <div class="kv"><span class="k">Owner</span><span class="v">${esc((j.owner&&j.owner.name)||'—')}</span></div>
        <div class="kv" style="border-bottom:none;"><span class="k">Sections that will print</span><span class="v">${inc.length} of ${j.total_sections || inc.length}</span></div>
        <div style="margin-top:8px;">${inc.map((x)=>'<span class="badge ok" style="margin:2px 4px 2px 0; font-weight:600;">'+esc(x.title)+'</span>').join('')}</div>
        ${missBlock}
        <div style="margin-top:16px;">
          <div class="muted" style="font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px;">The letter <span style="text-transform:none;">(one page, what you mail)</span></div>
          <div class="row">
            <a class="btn ghost" href="${esc(letterHtml)}" target="_blank" rel="noopener">Read letter</a>
            <a class="btn ghost" href="${esc(letterPdf)}" target="_blank" rel="noopener">Letter PDF</a>
          </div>
          <div class="muted" style="font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; margin:12px 0 4px;">The packet <span style="text-transform:none;">(the full reference, attached to the email)</span></div>
          <div class="row">
            <a class="btn ghost" href="${esc(link)}" target="_blank" rel="noopener">Read packet</a>
            <a class="btn ghost" href="${esc(pdf)}" target="_blank" rel="noopener">Packet PDF</a>
          </div>
        </div>
        <div class="grid2" style="margin-top:14px;">
          <div class="field"><label>Email it to</label><input type="email" id="wp-email" value="${esc(email)}" placeholder="new owner's email"></div>
          <div class="field"><label>&nbsp;</label>
            <div class="row">
              <button class="btn gold" id="wp-send">Send packet</button>
              <button class="btn ghost" id="wp-file">File without sending</button>
            </div></div>
        </div>
        <div id="wp-status" class="muted" style="font-size:12.5px; margin-top:6px;"></div>
      </div>`;
    $('wp-send').addEventListener('click', ()=>wpSend(false));
    $('wp-file').addEventListener('click', ()=>wpSend(true));
  };

  async function wpSend(saveOnly) {
    const st = $('wp-status');
    const to = ($('wp-email').value || '').trim();
    if (!saveOnly && !to) { st.innerHTML = '<span style="color:#b00">Add an email address, or file it without sending.</span>'; return; }
    $('wp-send').disabled = true; $('wp-file').disabled = true;
    st.textContent = saveOnly ? 'Filing…' : 'Sending…';
    const ctx = window._wpCtx || {};
    const body = {
      community_id: CID, property_id: window._wpProp,
      to_email: to || null, save_only: !!saveOnly,
      owner_name: ctx.owner_name || null,
      effective_date: ctx.effective_date || null,
      occasion: ctx.occasion || null,
      home_sale_id: ctx.home_sale_id || null,
    };
    try {
      const r = await fetch('/api/welcome/send', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
      const j = await r.json();
      if (!r.ok) throw new Error(j.detail || j.reason || j.error || 'failed');
      st.innerHTML = j.emailed
        ? '<span style="color:#166534">&#10003; Sent to '+esc(j.packet.sent_to_email)+' and filed to the association record.</span>'
        : '<span style="color:#166534">&#10003; Filed to the association record'+(j.stored?'':' (PDF storage failed, check the logs)')+'. Nothing was emailed.</span>';
      loadWelcomeSent();
    } catch (e) {
      st.innerHTML = '<span style="color:#b00">'+esc(e.message)+'</span>';
      $('wp-send').disabled = false; $('wp-file').disabled = false;
    }
  }

  // Which closings already got their packet. Loaded alongside the list so a
  // closed sale with no packet is visible rather than assumed handled.
  let WELCOME_BY_PROP = {};
  async function loadWelcomeSent() {
    try {
      const r = await fetch(`/api/welcome/history?community_id=${CID}`);
      if (!r.ok) { WELCOME_BY_PROP = {}; return; }
      const j = await r.json();
      const map = {};
      for (const p of (j.packets || [])) {
        if (!map[p.property_id] || (p.status === 'sent' && map[p.property_id].status !== 'sent')) map[p.property_id] = p;
      }
      WELCOME_BY_PROP = map;
    } catch (e) { WELCOME_BY_PROP = {}; }
  }

  // ── Prorated assessments at transfer ──────────────────────────────────────
  const PR_TYPES = [
    ['builder_to_homeowner','Builder → homeowner (first sale)'],
    ['developer_to_builder','Developer → builder'],
    ['owner_resale','Owner → owner (resale)'],
  ];
  async function openProrateFlow(){
    if (!CID) { alert('Pick a community first.'); return; }
    clearPanel();
    const rates = await fetch(`/api/assessment-proration/rates?community_id=${CID}`).then(r=>r.json()).catch(()=>({rates:[]}));
    const rateOf = (cls)=>{ const r=(rates.rates||[]).find(x=>x.owner_class===cls); return r? (r.annual_amount_cents/100).toFixed(2):''; };
    const typeOpts = PR_TYPES.map(([v,l])=>`<option value="${v}">${esc(l)}</option>`).join('');
    $('panel').innerHTML = `
      <div class="card" style="margin-bottom:14px;">
        <h2 class="sec">Assessment rates <span class="muted" style="font-size:12px;">— annual, per owner class</span></h2>
        <div class="grid2" style="margin-top:8px;">
          <div class="field"><label>Builder rate ($/yr)</label><input type="text" id="pr-rate-builder" value="${rateOf('builder')}" placeholder="e.g. 400.00"></div>
          <div class="field"><label>Homeowner rate ($/yr)</label><input type="text" id="pr-rate-homeowner" value="${rateOf('homeowner')}" placeholder="e.g. 600.00"></div>
        </div>
        <button class="btn" id="pr-save-rates" style="margin-top:8px;">Save rates</button>
        <span id="pr-rate-status" class="muted" style="font-size:12px; margin-left:10px;"></span>
      </div>
      <div class="card" style="margin-bottom:14px;">
        <h2 class="sec">Prorate a transfer</h2>
        <div class="muted" style="font-size:12.5px; margin:2px 0 10px;">Daily proration (days remaining ÷ days in the year) from the transfer date to Dec 31. A resale posts no charge — ownership and balance transfer only.</div>
        <div class="field"><label>Property</label><input type="text" id="pr-search" placeholder="Street address or owner…" autocomplete="off"></div>
        <div id="pr-results"></div>
        <div id="pr-prop-chosen" class="muted" style="font-size:12.5px; margin:6px 0;"></div>
        <div class="grid2">
          <div class="field"><label>Transfer type</label><select id="pr-type" onchange="prPreview()">${typeOpts}</select></div>
          <div class="field"><label>Transfer / closing date</label><input type="date" id="pr-date" onchange="prPreview()"></div>
        </div>
        <div id="pr-preview" style="margin-top:10px;"></div>
      </div>
      <div class="card"><h2 class="sec">Recent prorations</h2><div id="pr-history" class="muted" style="font-size:12.5px;">Loading…</div></div>`;
    window._prProp = null;
    let t; $('pr-search').addEventListener('input',(e)=>{ clearTimeout(t); t=setTimeout(()=>propSearch(e.target.value,'pr'),250); });
    $('pr-save-rates').addEventListener('click', prSaveRates);
    prLoadHistory();
  }
  async function prSaveRates(){
    const st = $('pr-rate-status'); st.textContent='Saving…';
    try {
      for (const cls of ['builder','homeowner']){
        const cents = dollarsToCents($('pr-rate-'+cls).value);
        if (cents==null) continue;
        const r = await fetch('/api/assessment-proration/rates',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({community_id:CID, owner_class:cls, annual_amount_cents:cents})});
        if (!r.ok){ const j=await r.json(); throw new Error(j.error||'save failed'); }
      }
      st.textContent='Saved.'; prPreview();
    } catch(e){ st.innerHTML='<span style="color:#b00">'+esc(e.message)+'</span>'; }
  }
  window.prPreview = async function(){
    const box = $('pr-preview'); if (!box) return;
    const property_id = window._prProp; const transfer_type = ($('pr-type')||{}).value; const effective_date = ($('pr-date')||{}).value;
    if (!property_id || !effective_date){ box.innerHTML = '<div class="muted" style="font-size:12.5px;">Pick a property, transfer type, and date to preview.</div>'; return; }
    box.innerHTML = '<div class="muted" style="font-size:12.5px;">Calculating…</div>';
    const j = await fetch('/api/assessment-proration/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({community_id:CID, property_id, transfer_type, effective_date})}).then(r=>r.json()).catch(()=>({error:'preview_failed'}));
    if (j.error==='no_rate'){ box.innerHTML = '<div class="card" style="background:#fff7ed; border-color:#fed7aa; font-size:12.5px; padding:10px 12px;">⚠ '+esc(j.note||'No rate set.')+' Set it above and save.</div>'; return; }
    if (j.error){ box.innerHTML = '<div style="color:#b00; font-size:12.5px;">Could not preview: '+esc(j.detail||j.error)+'</div>'; return; }
    if (!j.charge){
      box.innerHTML = `<div class="card" style="background:#f0f9ff; border-color:#bae6fd; padding:12px 14px;">
        <div style="font-weight:600;">No HOA charge for this transfer</div>
        <div class="muted" style="font-size:12.5px; margin-top:3px;">${esc(j.note||'')}</div>
        <button class="btn" style="margin-top:8px;" onclick="prPost(false)">Log transfer (no charge)</button>
        <span id="pr-post-status" class="muted" style="font-size:12px; margin-left:8px;"></span></div>`;
      return;
    }
    box.innerHTML = `<div class="card" style="background:#f0fdf4; border-color:#bbf7d0; padding:12px 14px;">
      <div style="font-size:20px; font-weight:700;">${fmt(j.prorated_amount_cents)}</div>
      <div class="muted" style="font-size:12.5px; margin-top:3px;">${esc(j.note||'')}</div>
      <div style="margin-top:8px; display:flex; gap:8px; align-items:center;">
        <button class="btn gold" onclick="prPost(false)">Post to owner's account</button>
        <span id="pr-post-status" class="muted" style="font-size:12px;"></span>
      </div></div>`;
  };
  window.prPost = async function(force){
    const property_id = window._prProp; const transfer_type = $('pr-type').value; const effective_date = $('pr-date').value;
    const st = $('pr-post-status'); if (st) st.textContent='Posting…';
    const r = await fetch('/api/assessment-proration/post',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({community_id:CID, property_id, transfer_type, effective_date, allow_duplicate:!!force})});
    const j = await r.json();
    if (r.status===409 && j.error==='already_prorated'){
      if (confirm((j.detail||'Already prorated.')+'\n\nPost it again anyway?')) return prPost(true);
      if (st) st.textContent=''; return;
    }
    if (!r.ok || !j.ok){ if (st) st.innerHTML='<span style="color:#b00">'+esc(j.detail||j.error||'failed')+'</span>'; else alert(j.detail||j.error||'failed'); return; }
    if (st) st.innerHTML='<span style="color:#166534">✓ '+(j.charge?('charged '+fmt(j.prorated_amount_cents)):'transfer logged')+'</span>';
    prLoadHistory();
  };
  async function prLoadHistory(){
    const box = $('pr-history'); if (!box) return;
    const j = await fetch(`/api/assessment-proration/history?community_id=${CID}`).then(r=>r.json()).catch(()=>({history:[]}));
    const h = j.history||[];
    if (!h.length){ box.innerHTML = 'No prorations yet.'; return; }
    box.innerHTML = '<table style="width:100%; font-size:12.5px;"><thead><tr><th style="text-align:left;">Property</th><th style="text-align:left;">Type</th><th style="text-align:left;">Effective</th><th style="text-align:right;">Days</th><th style="text-align:right;">Amount</th></tr></thead><tbody>'
      + h.map(x=>`<tr><td>${esc(x.properties?x.properties.street_address:'—')}</td><td>${esc(String(x.transfer_type||'').replace(/_/g,' '))}</td><td>${esc(fmtDate(x.effective_date))}</td><td style="text-align:right;">${x.prorated_amount_cents>0?(x.days_prorated+'/'+x.days_in_year):'—'}</td><td style="text-align:right;">${x.prorated_amount_cents>0?fmt(x.prorated_amount_cents):'<span class="muted">no charge</span>'}</td></tr>`).join('')
      + '</tbody></table>';
  }

  init();
</script>
</body>
</html>
