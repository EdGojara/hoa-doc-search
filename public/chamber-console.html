<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chamber Console · Bedrock</title>
<style>
  :root { --navy:#0B1D34; --gold:#D4AF37; --ink:#1f2430; --ink-soft:#475569; --ink-faint:#94a3b8;
          --rule:#e7e3d8; --bg:#f7f5ef; --ok:#15803d; --err:#b91c1c; --live:#dc2626; --font-serif:'Cormorant Garamond',Georgia,serif; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:Inter,system-ui,sans-serif; font-size:14px; }
  header { background:var(--navy); color:#fff; padding:14px 22px; border-bottom:3px solid var(--gold); display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  header h1 { font-family:var(--font-serif); font-weight:600; font-size:22px; margin:0; }
  header a { color:#fff; opacity:.85; text-decoration:none; font-size:13px; }
  .wrap { max-width:1080px; margin:0 auto; padding:18px 22px 60px; }
  select, input, textarea { padding:8px 11px; border-radius:8px; border:1px solid var(--rule); background:#fff; color:var(--ink); font-size:14px; font-family:inherit; }
  .card { background:#fff; border:1px solid var(--rule); border-radius:12px; padding:16px 18px; margin-bottom:16px; box-shadow:0 1px 2px rgba(0,0,0,.03); }
  .sec { font-family:var(--font-serif); font-size:19px; color:var(--navy); margin:0 0 10px; font-weight:600; }
  .btn { padding:9px 15px; border:none; border-radius:8px; background:var(--navy); color:#fff; font-weight:700; cursor:pointer; font-size:13.5px; }
  .btn.gold { background:var(--gold); color:var(--navy); } .btn.ghost { background:#fff; color:var(--navy); border:1px solid var(--rule); }
  .btn.red { background:var(--live); } .btn.green { background:var(--ok); } .btn:disabled { opacity:.5; cursor:not-allowed; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .field { display:flex; flex-direction:column; gap:4px; } .field label { font-size:11px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em; }
  .commbar { display:flex; align-items:center; gap:12px; background:#fff; border:1px solid var(--rule); border-left:5px solid var(--gold); border-radius:12px; padding:11px 16px; margin-bottom:16px; }
  .commbar select { min-width:280px; font-size:16px; font-weight:700; color:var(--navy); }
  .live-badge { display:inline-flex; align-items:center; gap:6px; background:var(--live); color:#fff; font-weight:800; font-size:11px; padding:3px 9px; border-radius:999px; }
  .live-dot { width:7px; height:7px; border-radius:50%; background:#fff; animation:pulse 1.4s infinite; } @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .qitem { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 10px; background:#f5f8fc; border-radius:8px; margin-bottom:6px; font-size:13px; }
  .agenda-line { display:flex; gap:8px; align-items:center; padding:6px 4px; border-bottom:1px solid #f1efe8; font-size:13px; }
  .agenda-line.current { font-weight:700; color:var(--navy); background:#fffdf5; border-radius:6px; }
  .muted { color:var(--ink-faint); font-size:12px; } .pill { font-size:11px; padding:2px 9px; border-radius:99px; background:#eef2f7; color:var(--ink-soft); }
</style>
</head>
<body>
<header>
  <div><a href="/">&larr; trustEd Home</a><h1>Chamber Console</h1></div>
  <div class="muted" style="color:#cbd5e1;">Run the meeting · homeowners watch in their portal <span style="opacity:.6;">· build 3</span></div>
</header>
<div class="wrap">
  <div class="commbar"><span style="font-size:11px; font-weight:800; letter-spacing:.09em; color:var(--ink-faint);">COMMUNITY</span><select id="commSel"></select></div>
  <div id="body"><div class="muted" style="padding:24px; text-align:center;">Loading…</div></div>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s==null?'':s).replace(/[&<>"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  let CID = null, _sel = null, _items = [], _poll = null;

  async function boot() {
    const comms = (await (await fetch('/api/communities')).json());
    const list = comms.communities || comms || [];
    list.sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));
    $('commSel').innerHTML = list.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
    CID = list[0] && list[0].id;
    $('commSel').addEventListener('change', (e)=>{ CID=e.target.value; _sel=null; loadAll(); });
    loadAll();
  }

  async function loadAll() {
    clearInterval(_poll);
    const [bl, lv] = await Promise.all([
      fetch(`/api/chamber/broadcasts?community_id=${CID}`).then(r=>r.json()),
      fetch(`/api/chamber/live?community_id=${CID}`).then(r=>r.json()),
    ]);
    const broadcasts = bl.broadcasts || [];
    _items = lv.items || [];
    if (!_sel) _sel = (lv.broadcast && lv.broadcast.id) || (broadcasts[0] && broadcasts[0].id) || null;
    render(broadcasts, lv);
    if (_sel) { refreshQueue(); _poll = setInterval(refreshQueue, 5000); }
  }

  function render(broadcasts, lv) {
    const sel = broadcasts.find(b=>b.id===_sel) || null;
    $('body').innerHTML = `
      ${createCard()}
      ${sel ? controlCard(sel, lv) : '<div class="card muted">No meeting selected. Create one above.</div>'}
      ${listCard(broadcasts)}`;
  }

  function createCard() {
    return `<div class="card">
      <div class="sec">New meeting</div>
      <div class="row" style="align-items:flex-end;">
        <div class="field" style="flex:2; min-width:220px;"><label>Title</label><input id="nt" placeholder="Board Meeting — August 18, 2026"></div>
        <div class="field"><label>Mode</label><select id="nmode">
          <option value="broadcast">Broadcast (televised)</option>
          <option value="meeting">Meeting (two-way)</option>
          <option value="webinar">Webinar</option></select></div>
        <div class="field"><label>Date / time</label><input id="nwhen" type="datetime-local"></div>
      </div>
      <div class="field" style="margin-top:10px;"><label>Agenda — one item per line</label><textarea id="nagenda" rows="4" placeholder="Call to Order&#10;Financial Report&#10;Manager Report&#10;Old Business&#10;New Business&#10;Homeowner Forum&#10;Adjourn"></textarea></div>
      <div class="row" style="align-items:flex-end; margin-top:10px;">
        <div class="field" style="flex:2; min-width:260px;"><label>Stream / room URL <span class="muted">(Daily room, Mux/Cloudflare player, or any embed)</span></label><input id="nurl" placeholder="https://…"></div>
        <div class="field"><label>Retention</label><select id="nret">
          <option value="delete_after_minutes_approved">Delete after minutes approved</option>
          <option value="retain">Retain recording</option>
          <option value="delete_after_days">Delete after 90 days</option></select></div>
        <button class="btn" onclick="createMeeting()">Create</button>
      </div>
      <div class="muted" style="margin-top:6px;">The URL is the branded player/room. Broadcast mode fills the player; Meeting/Webinar fills the two-way room. You can add it now or before going live.</div>
    </div>`;
  }

  function controlCard(b, lv) {
    const isLive = b.status==='live';
    const cur = b.current_item_index||0;
    const agenda = _items.length ? _items.map((it,i)=>`<div class="agenda-line ${i===cur&&isLive?'current':''}"><span>${i<cur?'✓':(i===cur&&isLive?'▸':'○')}</span><span>${esc(it.topic||it)}</span></div>`).join('') : '<div class="muted">No agenda linked. Link a meeting agenda to sync items.</div>';
    return `<div class="card" style="border-left:4px solid ${isLive?'var(--live)':'var(--gold)'};">
      <div class="row" style="justify-content:space-between;">
        <div><div class="sec" style="margin:0;">${esc(b.title||'Board Meeting')}</div>
          <div class="muted"><span class="pill">${esc(b.mode)}</span> ${isLive?'<span class="live-badge"><span class="live-dot"></span>LIVE</span>':esc(b.status)} · 👥 ${(lv&&lv.broadcast&&lv.broadcast.id===b.id)?(lv.attending||0):0} watching</div>
        </div>
        <div class="row">
          ${!isLive ? `<button class="btn green" onclick="setStatus('${b.id}','live')">● Go Live</button>` :
            `<button class="btn ${b.exec_session?'gold':'ghost'}" onclick="toggleExec('${b.id}',${!b.exec_session})">${b.exec_session?'▶ Resume open session':'🔒 Executive session'}</button>
             <button class="btn red" onclick="setStatus('${b.id}','ended')">■ End meeting</button>`}
        </div>
      </div>
      ${b.exec_session?'<div class="muted" style="color:var(--live); margin-top:6px;">🔒 Stream + recording paused. Homeowners see an executive-session card.</div>':''}
      ${(b.mode==='meeting'||b.mode==='webinar') && b.room_url ? `
        <div style="margin-top:12px; padding:12px 14px; background:#f0fdf4; border:1px solid #bbf7d0; border-radius:10px;">
          <div style="font-weight:700; color:#166534; margin-bottom:7px;">🎥 Two-way room ready — join with your camera &amp; mic</div>
          <div class="row" style="align-items:center;">
            <a class="btn green" href="${esc(b.room_url)}" target="_blank" rel="noopener" style="text-decoration:none;">▶ Join the meeting</a>
            <button class="btn ghost" onclick="navigator.clipboard.writeText('${esc(b.room_url)}'); this.textContent='✓ Link copied';">📋 Copy invite link</button>
            <span class="muted">${isLive?'Members are joining from their portal now.':'Members join from their portal once you <strong>Go&nbsp;Live</strong>. Invite anyone else with the link.'}</span>
          </div>
        </div>`:''}
      <div class="row" style="margin-top:12px; gap:24px; align-items:flex-start;">
        <div style="flex:1; min-width:240px;">
          <div class="muted" style="margin-bottom:4px;">AGENDA${isLive?' — advance as you go':''}</div>
          ${agenda}
          ${isLive && _items.length ? `<div class="row" style="margin-top:8px;"><button class="btn ghost" onclick="advance('${b.id}',${Math.max(0,cur-1)})" ${cur<=0?'disabled':''}>← Prev</button><button class="btn ghost" onclick="advance('${b.id}',${Math.min(_items.length-1,cur+1)})" ${cur>=_items.length-1?'disabled':''}>Next item →</button></div>`:''}
        </div>
        <div style="flex:1; min-width:240px;">
          <div class="muted" style="margin-bottom:4px;">HOMEOWNER FORUM — REQUESTS TO SPEAK</div>
          <div id="queue"><div class="muted">Loading queue…</div></div>
        </div>
      </div>
      <div class="field" style="margin-top:14px;"><label>Agenda (one item per line)</label><textarea id="ca" rows="4">${_items.map(it=>esc(it.topic||it)).join('\n')}</textarea></div>
      <div class="row" style="margin-top:12px; align-items:flex-end;">
        <div class="field" style="flex:2; min-width:260px;"><label>Stream / room URL</label><input id="cu" value="${esc(b.player_embed_url||b.room_url||b.hls_url||'')}"></div>
        <button class="btn ghost" onclick="saveAgenda('${b.id}')">Save agenda</button>
        <button class="btn ghost" onclick="saveUrl('${b.id}','${esc(b.mode)}')">Save URL</button>
        <button class="btn ghost" onclick="showAttendance('${b.id}')">📊 Attendance report</button>
        <a class="btn ghost" href="/portal-chamber.html" target="_blank" style="text-decoration:none;">↗ Preview homeowner view</a>
      </div>
    </div>
    <div id="att-modal"></div>`;
  }

  function listCard(broadcasts) {
    if (!broadcasts.length) return '';
    return `<div class="card"><div class="sec">Meetings</div>${broadcasts.map(b=>`
      <div class="qitem"><span>${esc(b.title||'Board Meeting')} <span class="pill">${esc(b.mode)}</span> <span class="muted">${esc(b.status)}${b.scheduled_at?' · '+new Date(b.scheduled_at).toLocaleString():''}</span></span>
      <button class="btn ghost" onclick="_sel='${b.id}';loadAll();">Open</button></div>`).join('')}</div>`;
  }

  async function refreshQueue() {
    if (!_sel) return;
    try {
      const [q, lv] = await Promise.all([
        fetch(`/api/chamber/broadcasts/${_sel}/speak`).then(r=>r.json()),
        fetch(`/api/chamber/live?community_id=${CID}`).then(r=>r.json()),
      ]);
      const box = $('queue'); if (!box) return;
      const reqs = (q.requests||[]).filter(r=>['requested','allowed','speaking'].includes(r.status));
      box.innerHTML = reqs.length ? reqs.map(r=>`<div class="qitem">
        <span><strong>${esc(r.display_name)}</strong>${r.property_address?` <span class="muted">${esc(r.property_address)}</span>`:''}${r.topic?`<br><span class="muted">"${esc(r.topic)}"</span>`:''} <span class="pill">${esc(r.status)}</span></span>
        <span class="row">
          ${r.status==='requested'?`<button class="btn green" onclick="speak('${r.id}','allowed')">Allow</button><button class="btn ghost" onclick="speak('${r.id}','denied')">Skip</button>`:''}
          ${r.status==='allowed'?`<button class="btn gold" onclick="speak('${r.id}','speaking')">🎤 On</button>`:''}
          ${r.status==='speaking'?`<button class="btn red" onclick="speak('${r.id}','done')">Done</button>`:''}
        </span></div>`).join('') : '<div class="muted">No requests yet.</div>';
      // Keep the attending count / current item fresh without a full re-render.
    } catch(_){}
  }

  window.createMeeting = async function createMeeting() {
    try {
      if(!CID){ alert('Pick a community first (top of the page).'); return; }
      const mode=$('nmode').value;
      const body = { community_id:CID, title:$('nt').value||null, mode, scheduled_at:$('nwhen').value?new Date($('nwhen').value).toISOString():null, retention_policy:$('nret').value };
      const ag=($('nagenda').value||'').split('\n').map(s=>s.trim()).filter(Boolean); if(ag.length) body.agenda_items=ag;
      const url=$('nurl').value.trim(); if(url){ if(mode==='broadcast') body.player_embed_url=url; else body.room_url=url; }
      const res = await fetch('/api/chamber/broadcasts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      const raw = await res.text();
      let j={}; try{ j=JSON.parse(raw); }catch(_){ alert('Create failed — HTTP '+res.status+'. The server did not return JSON (you may need to sign in again). First 300 chars:\n\n'+raw.slice(0,300)); return; }
      if(!res.ok || j.error){ alert('Create failed (HTTP '+res.status+'): '+(j.error||'unknown error')); return; }
      if(!j.broadcast || !j.broadcast.id){ alert('Create returned no meeting.'); return; }
      _sel = j.broadcast.id;
      await loadAll();
    } catch(e){ alert('Create error: '+((e&&e.message)||e)); }
  };
  async function patch(id, body){ const j=await (await fetch(`/api/chamber/broadcasts/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})).json(); if(j.error) alert(j.error); return j; }
  window.setStatus = async (id,status)=>{ if(status==='ended'&&!confirm('End the meeting for all homeowners?'))return; await patch(id,{status}); loadAll(); };
  window.toggleExec = async (id,on)=>{ await patch(id,{exec_session:on}); loadAll(); };
  window.advance = async (id,idx)=>{ await patch(id,{current_item_index:idx}); loadAll(); };
  window.saveUrl = async (id,mode)=>{ const u=$('cu').value.trim(); await patch(id, mode==='broadcast'?{player_embed_url:u}:{room_url:u}); loadAll(); };
  window.saveAgenda = async (id)=>{ const items=($('ca').value||'').split('\n').map(s=>s.trim()).filter(Boolean); await patch(id,{agenda_items:items}); loadAll(); };
  window.showAttendance = async (id)=>{
    const j = await (await fetch(`/api/chamber/broadcasts/${id}/attendance`)).json();
    if(j.error) return alert(j.error);
    const pct = j.roster ? Math.round(j.attended/j.roster*100) : 0;
    const rows = (j.rows||[]).map(r=>`<div class="qitem"><span>${esc(r.property)}</span><span class="muted">${r.minutes} min · joined ${new Date(r.joined_at).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}</span></div>`).join('') || '<div class="muted">No attendance recorded yet.</div>';
    $('att-modal').innerHTML = `<div style="position:fixed; inset:0; background:rgba(11,29,52,.55); display:flex; align-items:center; justify-content:center; z-index:50;" onclick="if(event.target===this)this.innerHTML='';">
      <div class="card" style="max-width:560px; width:92%; max-height:82vh; overflow:auto; margin:0;">
        <div class="row" style="justify-content:space-between;"><div class="sec" style="margin:0;">Attendance & engagement</div><button class="btn ghost" onclick="document.getElementById('att-modal').innerHTML='';">Close</button></div>
        <div class="muted" style="margin:4px 0 12px;">${esc(j.broadcast.title||'Board Meeting')}</div>
        <div class="row" style="gap:22px; margin-bottom:12px;">
          <div><div class="muted">Attended live</div><div style="font-size:24px; font-weight:800; color:var(--navy);">${j.attended}<span style="font-size:13px; font-weight:500; color:var(--ink-faint);"> of ${j.roster} (${pct}%)</span></div></div>
          <div><div class="muted">Avg watch</div><div style="font-size:24px; font-weight:800; color:var(--navy);">${j.avg_minutes}<span style="font-size:13px; font-weight:500; color:var(--ink-faint);"> min</span></div></div>
        </div>
        ${rows}
        <div class="muted" style="margin-top:10px;">A member-verified attendance record — proof of participation a Zoom link can't produce.</div>
      </div></div>`;
  };
  window.speak = async (id,status)=>{ const j=await (await fetch(`/api/chamber/speak/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})})).json(); if(j.error)alert(j.error); refreshQueue(); };

  boot();
</script>
</body>
</html>
