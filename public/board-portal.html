        : '';
      const next = p.next_action ? `<div style="font-size:12.5px;color:#334155;margin-top:3px;">Next: ${esc(p.next_action)}${p.next_action_owner ? ` <span style="color:#64748b;">— ${esc(p.next_action_owner)}</span>` : ''}</div>` : '';
      const nm = p.next_milestone ? `<div style="font-size:11.5px;color:#64748b;margin-top:2px;">Next milestone: ${esc(p.next_milestone.title)}${p.next_milestone.due_date ? ` — due ${esc(p.next_milestone.due_date)}` : ''}</div>` : '';
      const timeline = projectTimeline(p);
      return `<div style="border:1px solid #e2e8f0;border-left:4px solid ${h.fg};border-radius:9px;padding:11px 13px;margin-bottom:9px;background:#fff;">
        <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap;">
          <div style="min-width:220px;flex:1;">
            <div style="font-weight:700;color:#0B1D34;font-size:14px;">${esc(p.title || 'Project')}</div>
            <div style="font-size:11.5px;color:#64748b;">${esc(p.vendor || 'vendor TBD')}${p.target_date ? ` · target ${esc(p.target_date)}` : ''}${p.milestones_total ? ` · ${p.milestones_done}/${p.milestones_total} milestones` : ''}</div>
          </div>
          <span style="background:${h.bg};color:${h.fg};font-size:11px;font-weight:700;border-radius:20px;padding:3px 10px;white-space:nowrap;">${h.label}${pct != null ? ` · ${pct}%` : ''}</span>
        </div>
        ${cost}${next}${nm}${timeline}
      </div>`;
    };
    const attn = sm.needs_attention || 0, over = sm.over_budget || 0;
    return `<div style="margin:6px 0 16px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px;flex-wrap:wrap;">
        <h2 style="margin:0;color:#0B1D34;font-size:16px;">Projects</h2>
        <div style="display:flex;gap:10px;align-items:center;">
          <span style="font-size:12px;color:#64748b;">${sm.active || 0} active${attn ? ` · <b style="color:#b42318;">${attn} need attention</b>` : ''}${over ? ` · <b style="color:#b42318;">${over} over budget</b>` : ''}</span>
          <button onclick="openYearView()" style="padding:5px 11px;border-radius:7px;border:1px solid #0B1D34;background:#0B1D34;color:#fff;font-size:12px;font-weight:600;cursor:pointer;">📅 Year snapshot</button>
        </div>
      </div>
      ${rows.map(card).join('')}
    </div>`;
  }

  // Phase 2 v2 — board tiles (clean tile pattern matching homeowner portal).
  // Each tile is an entry point: icon + title + short description + one
  // headline metric. Click → detail. Boards see the curated landing, drill
  // in for the data.
  function renderDashboardCards(s, projects, motions, threads) {
    const fmtMoney = (cents) => {
      if (cents == null) return '—';
      const dollars = Number(cents) / 100;
      if (dollars >= 1_000_000) return '$' + (dollars / 1_000_000).toFixed(1) + 'M';
      if (dollars >= 1000)      return '$' + Math.round(dollars / 1000) + 'K';
      return '$' + dollars.toLocaleString('en-US', { maximumFractionDigits: 0 });
    };
    const slug = s.community?.slug || '';

    // ── Financial health row ────────────────────────────────────────
    const ar = s.ar_aging;
    const arTile = !ar ? '' : `
      <a class="board-tile" href="javascript:showAR()">
        <div class="tile-icon">💵</div>
        <div class="tile-title">Accounts Receivable</div>
        <div class="tile-desc">Outstanding balances, payment plans, and accounts approaching legal action.</div>
        <div class="tile-metric">
          <div>
            <div class="metric-value ${ar.owners_past_due > 0 ? 'warn' : 'good'}">${fmtMoney(ar.total_outstanding_cents)}</div>
            <div class="metric-label">${ar.owners_past_due} owner${ar.owners_past_due === 1 ? '' : 's'} past-due${ar.owners_at_legal > 0 ? ` · ${ar.owners_at_legal} at legal` : ''}</div>
          </div>
        </div>
        <div class="tile-cta">View aging detail →</div>
      </a>`;

    const rh = s.reserve_health;
    const rhTile = !rh ? '' : `
      <a class="board-tile" href="/reserve-map.html${slug ? '?community=' + encodeURIComponent(slug) : ''}" target="_blank" rel="noopener">
        <div class="tile-icon">🏦</div>
        <div class="tile-title">Reserve Study</div>
        <div class="tile-desc">Components, urgency, projected vs. actual spending across the community.</div>
        <div class="tile-metric">
          <div>
            <div class="metric-value">${fmtMoney(rh.total_future_cost_cents)}</div>
            <div class="metric-label">${rh.active_components || 0} components${rh.critical_2yr_count > 0 ? ` · ${rh.critical_2yr_count} critical` : ''}</div>
          </div>
        </div>
        <div class="tile-cta">Open reserve map →</div>
      </a>`;

    // ── Violations + ARC row ────────────────────────────────────────
    // Violations is its OWN tile (distinct from Accounts Receivable, which is
    // money owed). Always rendered so the board can always see compliance.
    const drv = s.drv_by_stage || {};
    const drvTotal = Object.values(drv).reduce((a, b) => a + (b || 0), 0);
    const drvCourtesy = (drv.courtesy_1 || 0) + (drv.courtesy_2 || 0);
    const drvSevere = (drv.certified_209 || 0) + (drv.fine_assessed || 0);
    const drvBreakdown = drvTotal === 0 ? 'all clear 🎉' : [
      drvCourtesy ? `${drvCourtesy} courtesy` : '',
      (drv.certified_209 || 0) ? `${drv.certified_209} at §209` : '',
      (drv.fine_assessed || 0) ? `${drv.fine_assessed} fined` : '',
    ].filter(Boolean).join(' · ');
    const drvTile = `
      <a class="board-tile" href="javascript:showProperties('open_only')">
        <div class="tile-icon">🚨</div>
        <div class="tile-title">Violations</div>
        <div class="tile-desc">Open violations by enforcement stage. Click any to drill into the property.</div>
        <div class="tile-metric">
          <div>
            <div class="metric-value ${drvSevere > 0 ? 'bad' : drvTotal > 0 ? 'warn' : 'good'}">${drvTotal}</div>
            <div class="metric-label">open · ${drvBreakdown}</div>
          </div>
        </div>
        <div class="tile-cta">View violations →</div>
      </a>`;

    // ARC — architectural applications + approvals (Ed 2026-08-09). Headline is
    // total applications decided; sub shows approved/denied + any still pending.
    const arc = s.arc_pipeline || {};
    const cCounts = s.counts || {};
    const arcDecided = cCounts.arc_decisions_total || 0;
    const arcApproved = cCounts.arc_approved_total || 0;
    const arcDenied = cCounts.arc_denied_total || 0;
    const arcPending = arc.open_total || 0;
    const arcSub = [
      `${arcApproved} approved`,
      arcDenied ? `${arcDenied} denied` : '',
      arcPending ? `${arcPending} pending` : '',
    ].filter(Boolean).join(' · ');
    const arcTile = `
      <a class="board-tile" href="/arc-review.html" target="_blank" rel="noopener">
        <div class="tile-icon">🏗️</div>
        <div class="tile-title">ARC</div>
        <div class="tile-desc">Architectural applications and approvals across the community.</div>
        <div class="tile-metric">
          <div>
            <div class="metric-value ${arcPending > 0 ? 'warn' : ''}">${arcDecided}</div>
            <div class="metric-label">applications · ${arcSub}</div>
          </div>
        </div>
        <div class="tile-cta">Review applications →</div>
      </a>`;

    // ── Properties + Meetings row ───────────────────────────────────
    // Properties = the ownership/residency ROSTER (distinct from Violations,
    // which is enforcement). Rental ratio is a real board metric — it drives
    // insurance, lending, and rental caps. Drill = look up any home.
    const c = s.counts || {};
    const totalHomes = c.total_properties || 0;
    const rentalPct = totalHomes ? Math.round(((c.renters || 0) / totalHomes) * 100) : 0;
    const propsTile = `
      <a class="board-tile" href="javascript:showPropertySearch()">
        <div class="tile-icon">🏘️</div>
        <div class="tile-title">Properties</div>
        <div class="tile-desc">Search any home to see its status — violations, balance, ARC, ownership.</div>
        <div class="tile-metric">
          <div>
            <div class="metric-value">${totalHomes}</div>
            <div class="metric-label">${c.owner_occupied || 0} owner-occupied · ${c.renters || 0} renter${c.renters === 1 ? '' : 's'}${totalHomes ? ` (${rentalPct}% rentals)` : ''}</div>
          </div>
        </div>
        <div class="tile-cta">Look up a home →</div>
      </a>`;

    const meetings = s.recent_meetings || [];
    const lastMeeting = meetings[0];
    const meetingsTile = `
      <a class="board-tile" href="/portal/meetings${slug ? '?community=' + encodeURIComponent(slug) : ''}" target="_blank" rel="noopener">
        <div class="tile-icon">📅</div>
        <div class="tile-title">Meetings & Minutes</div>
        <div class="tile-desc">Board meeting minutes, agendas, and recent decisions on file.</div>
        <div class="tile-metric">
          <div>
            <div class="metric-value">${meetings.length}</div>
            <div class="metric-label">${lastMeeting?.date ? 'last ' + new Date(lastMeeting.date).toLocaleDateString('en-US', { month: 'short', year: 'numeric' }) : 'on file'}</div>
          </div>
        </div>
        <div class="tile-cta">Browse meetings →</div>
      </a>`;

    // Projects — board accountability. Metric from the projects summary stashed
    // on load; drills into the full projects view (with the Year snapshot).
    const pj = (projects && projects.summary) || {};
    const pjActive = pj.active || 0;
    const pjAttn = pj.needs_attention || 0;
    const projectsTile = `
      <a class="board-tile" href="javascript:showProjects()">
        <div class="tile-icon">🔧</div>
        <div class="tile-title">Projects</div>
        <div class="tile-desc">Vendor projects, budget vs. actual, and what's waiting on a board decision.</div>
        <div class="tile-metric">
          <div>
            <div class="metric-value ${pjAttn > 0 ? 'warn' : ''}">${pjActive}</div>
            <div class="metric-label">active${pjAttn ? ` · ${pjAttn} need attention` : ''}</div>
          </div>
        </div>
        <div class="tile-cta">View projects →</div>
      </a>`;

    // Motions & Voting — board approvals with per-member votes and results.
    const ms = (motions && motions.motions) || [];
    const openMotions = ms.filter((m) => m.status === 'open');
    const awaitingMe = openMotions.filter((m) => !m.my_vote).length;
    const motionsTile = `
      <a class="board-tile" href="javascript:showMotions()">
        <div class="tile-icon">🗳️</div>
        <div class="tile-title">Motions &amp; Voting</div>
        <div class="tile-desc">Board approvals — record a motion, cast votes, see the result and who voted.</div>
        <div class="tile-metric">
          <div>
            <div class="metric-value ${awaitingMe > 0 ? 'warn' : ''}">${openMotions.length}</div>
            <div class="metric-label">open${awaitingMe > 0 ? ` · ${awaitingMe} awaiting your vote` : ''}</div>
          </div>
        </div>
        <div class="tile-cta">${awaitingMe > 0 ? 'Cast your vote →' : 'View motions →'}</div>
      </a>`;

    // Board Discussion — secure in-platform messaging, unread from the threads list.
    const thr = (threads && threads.threads) || [];
    const discUnread = thr.reduce((a, t) => a + (t.unread || 0), 0);
    const discussionTile = `
      <a class="board-tile" href="javascript:showGeneralThread()">
        <div class="tile-icon">💬</div>
        <div class="tile-title">Board Discussion</div>
        <div class="tile-desc">Talk with the board and manager in a secure place. History is kept, no email or texting.</div>
        <div class="tile-metric">
          <div>
            <div class="metric-value ${discUnread > 0 ? 'warn' : ''}">${discUnread || 0}</div>
            <div class="metric-label">${discUnread > 0 ? 'unread' : 'messages'}</div>
          </div>
        </div>
        <div class="tile-cta">${discUnread > 0 ? 'Catch up →' : 'Open discussion →'}</div>
      </a>`;

    return `
      <div class="tile-section-label">Financial health</div>
      <div class="board-tile-grid">
        ${arTile}
        ${rhTile}
        ${meetingsTile}
      </div>

      <div class="tile-section-label">Governance</div>
      <div class="board-tile-grid">
        ${motionsTile}
        ${discussionTile}
        ${projectsTile}
      </div>

      <div class="tile-section-label">Community health</div>
      <div class="board-tile-grid">
        ${drvTile}
        ${arcTile}
        ${propsTile}
      </div>
    `;
  }

  function renderFilterBar() {
    return `
      <div class="filter-row">
        <button class="chip ${currentFilter === 'all' ? 'active' : ''}" onclick="setFilter('all')">All properties</button>
        <button class="chip ${currentFilter === 'open_only' ? 'active' : ''}" onclick="setFilter('open_only')">Open violations only</button>
      </div>`;
  }
  function setFilter(f) {
    // Filter chips live inside the Properties drill-in — stay there, don't
    // bounce back to the landing.
    showProperties(f);
  }

  function renderPropertyList(rows) {
    if (!rows.length) {
      const msg = currentFilter === 'open_only'
        ? 'No properties with open violations in this community.'
        : 'No properties found for this community.';
      return `<div class="empty">${esc(msg)}</div>`;
    }
    const arrowSvg = '<svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>';
    return `
      <div class="properties-header">Properties (${rows.length})</div>
      ${rows.map((r) => `
        <div class="property-card" onclick="openProperty('${esc(r.property_id)}')">
          <div class="main">
            <div class="addr">${esc(r.street_address)}${r.unit ? ' #' + esc(r.unit) : ''}</div>
            <div class="owner">${esc(r.owner_name || '— no owner on record —')}${r.residency_type ? ' · ' + esc(r.residency_type.replace(/_/g, ' ')) : ''}</div>
            <div class="badges">
              ${r.open_violations > 0 ? `<span class="badge ${stageBadgeKind(r.worst_open_stage)}">${r.open_violations} open · ${esc(stageLabel(r.worst_open_stage))}</span>` : ''}
              ${r.violations_last_12mo > 0 && r.open_violations === 0 ? `<span class="badge neutral">${r.violations_last_12mo} in 12mo</span>` : ''}
              ${r.arc_decisions_count > 0 ? `<span class="badge neutral">${r.arc_decisions_count} ARC</span>` : ''}
              ${r.last_inspected_at ? `<span class="badge good">Inspected ${esc(fmtDate(r.last_inspected_at))}</span>` : ''}
            </div>
          </div>
          <div class="arrow">${arrowSvg}</div>
        </div>
      `).join('')}`;
  }

  // ----- Property detail drawer --------------------------------------------

  async function openProperty(propertyId) {
    const drawer = document.getElementById('drawer');
    const backdrop = document.getElementById('drawerBackdrop');
    document.getElementById('drawerAddr').textContent = '—';
    document.getElementById('drawerOwner').textContent = '';
    document.getElementById('drawerBody').innerHTML = '<div class="loading">Loading…</div>';
    drawer.classList.add('open');
    backdrop.classList.add('open');
    try {
      const j = await fetchJSON(`/api/board-portal/property/${encodeURIComponent(propertyId)}`);
      renderDrawer(j);
    } catch (e) {
      document.getElementById('drawerBody').innerHTML = `<div class="err">Load failed: ${esc(e.message)}</div>`;
    }
  }
  function closeDrawer() {
    document.getElementById('drawer').classList.remove('open');
    document.getElementById('drawerBackdrop').classList.remove('open');
  }

  function renderDrawer(j) {
    const s = j.summary || {};
    document.getElementById('drawerAddr').textContent = (s.street_address || '—') + (s.unit ? ' #' + s.unit : '');
    document.getElementById('drawerOwner').textContent = s.owner_name ? `Owner: ${s.owner_name}` : '— no owner on record —';

    const body = document.getElementById('drawerBody');
    body.innerHTML = `
      ${renderOverview(s)}
      ${renderOwnershipHistory(j.ownership_history || [], j.residency_history || [])}
      ${renderOpenViolations(j.open_violations || [])}
      ${renderArcDecisions(j.arc_decisions || [])}
      ${renderInteractions(j.interactions || [])}
      ${renderDocs(j.substrate_docs || [])}
    `;
  }

  function renderOwnershipHistory(owners, residencies) {
    if (!owners.length && !residencies.length) return '';
    // Merge owners + residencies into a timeline. Owners are the canonical
    // 'who owned this' record; residencies add the 'who actually lived here'
    // when different (e.g., rental periods). For boards, the owner timeline
    // is the main signal — surface that prominently; residency annotates.
    return `
      <div class="drawer-section">
        <div class="drawer-section-title">Ownership history (${owners.length})</div>
        ${owners.length ? owners.map((o) => {
          const span = o.end_date
            ? `${esc(fmtDate(o.start_date))} – ${esc(fmtDate(o.end_date))}`
            : `${esc(fmtDate(o.start_date))} – present`;
          const contact = (o.contact && o.contact.full_name) || '— unknown owner —';
          return `
            <div class="item">
              <div class="item-head">
                <span class="item-title">${esc(contact)}${o.is_primary ? ' (primary)' : ''}</span>
                <span class="item-date">${span}</span>
              </div>
              <div class="item-body">${esc(o.vesting || 'individual')}${o.source ? ` · sourced ${esc(o.source)}` : ''}</div>
            </div>`;
        }).join('') : '<div class="item-body">No ownership records on file.</div>'}
        ${residencies.length ? `
          <div style="margin-top:12px; padding-top:10px; border-top:1px dashed var(--rule); font-size:11px; color:var(--ink-muted); font-weight:600; letter-spacing:0.06em; text-transform:uppercase;">Residency notes</div>
          ${residencies.slice(0, 3).map((r) => {
            const span = r.end_date
              ? `${esc(fmtDate(r.start_date))} – ${esc(fmtDate(r.end_date))}`
              : `${esc(fmtDate(r.start_date))} – present`;
            const who = (r.contact && r.contact.full_name) || (r.residency_type === 'vacant' ? '— vacant —' : '— unknown —');
            return `
              <div class="item">
                <div class="item-head">
                  <span class="item-title">${esc(r.residency_type ? r.residency_type.replace(/_/g, ' ') : 'residency')}</span>
                  <span class="item-date">${span}</span>
                </div>
                <div class="item-body">${esc(who)}${r.lease_end_date ? ` · lease ends ${esc(fmtDate(r.lease_end_date))}` : ''}</div>
              </div>`;
          }).join('')}
        ` : ''}
      </div>`;
  }

  function renderOverview(s) {
    // Modules that aren't yet writing to the substrate get a "coming soon"
    // label instead of a "0" so the surface reads as in-progress not broken.
    // Honest states, never "coming soon": these fields ARE wired (v_property_summary).
    // A clean property legitimately reads $0 / none — that's good standing, not broken.
    const muted = (t) => `<span style="color:var(--ink-muted); font-style:italic; font-size:12px;">${t}</span>`;
    const fmtMoney = (v) => { if (v == null || v === '') return null; const n = Number(v); if (!isFinite(n)) return null; return (n < 0 ? '-$' : '$') + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
    const balDisp = (() => {
      const m = fmtMoney(s.current_balance);
      if (m == null) return muted('no balance on file');
      const n = Number(s.current_balance);
      if (n > 0) return `<strong style="color:#b45309;">Owes ${m}</strong>`;
      if (n < 0) return `<span style="color:#166534;">Credit ${fmtMoney(-n)}</span>`;
      return `<span style="color:#166534;">Current</span>`;
    })();
    return `
      <div class="drawer-section">
        <div class="drawer-section-title">Snapshot</div>
        <dl class="kv">
          <dt>Residency</dt><dd>${esc(s.residency_type ? s.residency_type.replace(/_/g, ' ') : '— unknown —')}${s.lease_end_date ? ` · lease ends ${esc(fmtDate(s.lease_end_date))}` : ''}</dd>
          <dt>Owner since</dt><dd>${esc(fmtDate(s.owned_since))}</dd>
          <dt>Account balance</dt><dd>${balDisp}</dd>
          <dt>Open violations</dt><dd>${s.open_violations > 0 ? `${s.open_violations}${s.worst_open_stage ? ' · ' + esc(stageLabel(s.worst_open_stage)) : ''}` : muted('none open')}</dd>
          <dt>Lifetime violations</dt><dd>${s.lifetime_violations > 0 ? `${s.lifetime_violations} · ${s.violations_last_12mo || 0} in last 12mo` : muted('none on record')}</dd>
          <dt>ARC decisions</dt><dd>${s.arc_decisions_count > 0 ? `${s.arc_decisions_count} · ${s.arc_approved_count || 0} approved · ${s.arc_denied_count || 0} denied` : muted('none on file')}</dd>
          <dt>Substrate docs</dt><dd>${s.substrate_doc_count > 0 ? s.substrate_doc_count : muted('none linked yet')}</dd>
          <dt>Last inspected</dt><dd>${s.last_inspected_at ? esc(fmtDate(s.last_inspected_at)) : muted('not yet inspected')}</dd>
        </dl>
      </div>`;
  }

  function renderOpenViolations(rows) {
    if (!rows.length) return '';
    return `
      <div class="drawer-section">
        <div class="drawer-section-title">Open violations (${rows.length})</div>
        ${rows.map((r) => `
          <div class="item">
            <div class="item-head">
              <span class="item-title">${esc((r.enforcement_categories && r.enforcement_categories.label) || 'Violation')}</span>
              <span class="item-date">${esc(stageLabel(r.current_stage))}</span>
            </div>
            <div class="item-body">Opened ${esc(fmtDate(r.opened_at))}${r.cure_period_ends_at ? ` · cure window ends ${esc(fmtDate(r.cure_period_ends_at))}` : ''}</div>
          </div>`).join('')}
      </div>`;
  }

  function renderArcDecisions(rows) {
    if (!rows.length) return '';
    return `
      <div class="drawer-section">
        <div class="drawer-section-title">ARC decisions (${rows.length})</div>
        ${rows.map((r) => `
          <div class="item">
            <div class="item-head">
              <span class="item-title">${esc(r.project_type || 'Project')}${r.decision_type ? ' · ' + esc(r.decision_type) : ''}</span>
              <span class="item-date">${esc(fmtDate(r.decided_at))}</span>
            </div>
            ${r.summary ? `<div class="item-body">${esc(r.summary)}</div>` : ''}
            ${r.conditions ? `<div class="item-body"><em>Conditions:</em> ${esc(r.conditions)}</div>` : ''}
          </div>`).join('')}
      </div>`;
  }

  function renderInteractions(rows) {
    if (!rows.length) {
      return `
        <div class="drawer-section">
          <div class="drawer-section-title">Interactions</div>
          <div class="empty" style="padding:16px; font-size:12.5px;">No interactions logged yet. As emails, letters, and notes flow into the system, they'll appear here.</div>
        </div>`;
    }
    return `
      <div class="drawer-section">
        <div class="drawer-section-title">Interactions (${rows.length})</div>
        ${rows.map((r) => `
          <div class="item">
            <div class="item-head">
              <span class="item-title">${esc(r.subject || (r.type ? r.type.replace(/_/g, ' ') : 'Interaction'))}</span>
              <span class="item-date">${esc(fmtDate(r.created_at))}</span>
            </div>
            ${r.summary ? `<div class="item-body">${esc(r.summary)}</div>` : ''}
          </div>`).join('')}
      </div>`;
  }

  function renderDocs(rows) {
    if (!rows.length) return '';
    return `
      <div class="drawer-section">
        <div class="drawer-section-title">Linked documents (${rows.length})</div>
        ${rows.map((r) => `
          <div class="item">
            <div class="item-head">
              <span class="item-title">${esc(r.title)}</span>
              <span class="item-date">${esc(fmtDate(r.effective_date || r.ingested_at))}</span>
            </div>
            <div class="item-body">${esc((r.source_type || '').replace(/_/g, ' '))}</div>
          </div>`).join('')}
      </div>`;
  }

  // ----- Boot ---------------------------------------------------------------
  // If arriving from the manager-view "Board View →" switch, the URL carries
  // ?view_as=<email>. Adopt it so the board portal opens DOWN-SCOPED to that
  // board member's own view (read-only preview banner), not staff god-mode.
  // Staff-only: a board member's own session ignores this (the API only honors
  // view_as for a staff viewer).
  try {
    const _va = new URLSearchParams(location.search).get('view_as');
    if (_va && _va.includes('@')) viewAsEmail = _va.trim().toLowerCase();
  } catch (_) { /* no-op */ }
  initAuth().then(loadCommunities);
</script>
</body>
